; Replace directory, PHP executable and user with this production site's values.
[program:water-alarm-gateway]
directory=/home/wwwroot/o2o/v20
command=/usr/local/php/bin/php think waterAlarmGateway
user=www
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/wwwroot/o2o/v20/runtime/water-alarm-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
