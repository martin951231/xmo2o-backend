[group:fastwhal_group]
programs=fastwhal_sys_log,house_order_log
#项目名(需要保证唯一)
[program:fastwhal_sys_log]
#脚本目录(^_^ 这里请根据网站实际部署的路径填写，如果是负载均衡的只需要一台机器部署即可)
directory=/home/wwwroot/o2o/v20
#脚本执行命令
command=/usr/local/php/bin/php think queue:listen --queue common-log

#supervisor启动的时候是否随着同时启动，默认True
autostart=true
#当程序exit的时候，这个program不会自动重启,默认unexpected，设置子进程挂掉后自动重启的情况，有三个选项，false,unexpected和true。如果为false的时候，无论什么情况下，都不会被重新启动，如果为unexpected，只有当进程的退出码不在下面的exitcodes里面定义的
autorestart=true
#这个选项是子进程启动多少秒之后，此时状态如果是running，则我们认为启动成功了。默认值为1
startsecs=3
#脚本运行的用户身份
user = www
#把stderr重定向到stdout，默认 false
redirect_stderr = true
stdout_logfile_backups = 10

[program:house_order_log]
directory=/home/wwwroot/o2o/v20
command=/usr/local/php/bin/php think queue:listen --queue add-pay-order-house
autostart=true
autorestart=false
startsecs=3
user = www
redirect_stderr = true
stdout_logfile_backups = 10