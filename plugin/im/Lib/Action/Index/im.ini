[kefu]
column[] = '{"type": "checkbox", "fixed": "left"}'
column[] = '{"field": "id", "title": "ID", "width": 80, "fixed": "left", "unresize": true, "sort": true}'
column[] = '{"field": "name", "title": "客服名称"}'
column[] = '{"field": "bind_uid", "title": "绑定用户","templet":"#show_bind_user"}'
column[] = '{"field": "bind_consumer_count", "title": "绑定客户数"}'
column[] = '{"field": "max_receive", "title": "最大接待数"}'
column[] = '{"field": "can_send_coupon", "title": "发送优惠券","templet":"#send_coupon"}'
column[] = '{"fixed": "right", "title": "操作", "toolbar": "#operate_bar", "width": 150}'

[addKefu]
params[] = '{"title":"客服名称","id":"kefu_name"}'
params[] = '{"title":"绑定用户","id":"bind_user","tip":"绑定用户后，该客服将可通过用户app或店员app来进入移动端客服聊天入口"}'
params[] = '{"title":"指定客户","id":"bind_consumer","tip":"即店铺可以给该客户指定专属客户，指定后，下次聊天将优先指定客户给该客服"}'
params[] = '{"title":"首句欢迎语","id":"welcome","tip":"当客户发送第一条消息，系统自动分配到在线客服时，会进行自动回复给客户"}'
params[] = '{"title":"客服最大接待数","id":"max_receive","tip":"即客服最大接待客户的数量；默认每个客服最大接待数为50个"}'
params[] = '{"title":"是否开启发送优惠券","id":"can_send_coupon","tip":"开启后，客服可以在与用户服聊天界面点击【优惠券】按钮，发送指定优惠券给到用户"}'