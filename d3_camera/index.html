<html>
	<head>
		<title></title>
		<meta charset="utf-8" />
		<script src="index.js"></script>
		<script src="jquery.min.js"></script>
		<script src="jsencrypt.min.js"></script>
		<script src="base64.js"></script>
		<script>
			function getRequest(param, url) {
				if (!url) {
					url = location.search;
				}
				var theRequest = {};
				if (url.indexOf("?") != -1) {
					var str = url.substr(1);
					strs = str.split("&");
					for (var i = 0; i < strs.length; i++) {
						//console.log(strs[i].split("=")[1]);
						theRequest[strs[i].split("=")[0]] = decodeURIComponent(strs[i].split("=")[1]);
					}
				}
				return theRequest[param] ? theRequest[param] : '';
			}
		</script>
		<style>
			* {
				margin: 0;
				padding: 0;
			}
		</style>
	</head>
	<body>
		<div>
			<div id='video' style="width:100%;height:100%;"></div>
		</div>
		<script>
			var player = undefined

			function initVideo(id, url) {
				var container = document.getElementById(id);
				var player = new window.Jessibuca({
					container: container,
					videoBuffer: 0.2,
					isResize: false,
					forceNoOffscreen: true,
					isNotMute: false,
					timeout: 10
				});
				player.on('load', function() {
					player.play(url)
				});
				player.on('error', function() {
					$('#video').html('<a href="javascript:location.reload()">播放失败，点击重试</a>');
				});
				player.on('timeout', function() {
					$('#video').html('<a href="javascript:location.reload()">播放超时，点击重试</a>');
				})
			}

			var ip = getRequest('ip'); // 设备局域网IP
			var port = 80; // 设备网页端口
			var proto = "http"; // 协议，http 或 https
			var username = getRequest('username'); // 设备网页登录用户名
			var password = getRequest('password'); // 设备网页登录密码

			var url = proto + "://" + ip + ":" + port + "/request.php"

			var data = {
				type: 'get_live_stream_type',
				module: 'BUS_WEB_REQUEST'
			}

			$.ajax({
				type: "POST",
				url: url,
				data: JSON.stringify(data),
				success: function(ajaxdata) {
					if (ajaxdata.state === 200) {
						var video_port = ajaxdata.body.port
						var pubkey = Base64.decode(ajaxdata.body.pubkey)
						var encryptStr = new JSEncrypt()
						encryptStr.setPublicKey(pubkey)
						var str = username + ':' + password
						var token = encodeURIComponent(encryptStr.encrypt(str.toString()))
						var video_url = "ws://" + ip + ":" + video_port + "/ws.flv?token=" + token;
						initVideo("video", video_url)
					}
				},
				error: function(ajaxdata) {
					$('#video').html('<a href="javascript:location.reload()">' + ajaxdata.statusText + '，点击重试</a>');
				}
			});
		</script>
	</body>
</html>
