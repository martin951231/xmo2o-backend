location / {
    if (!-d $request_filename){
        set $rule_0 1$rule_0;
    }
    if (!-f $request_filename){
        set $rule_0 2$rule_0;
    }
    if ($rule_0 = "21"){
        rewrite ^/(.*)$ /index.php?/$1 last;
    }
}
location /packapp/platn {
    if (!-f $request_filename){
        set $rule_1 1$rule_1;
    }
    if (!-d $request_filename){
        set $rule_1 2$rule_1;
    }
    if ($request_filename !~ .*(\.css|\.js|\.gif|\.html|\.png|\.jpg)$){
	set $rule_1 3$rule_1;
    }
    if ($rule_1 = "321"){
        rewrite ^.*$  /packapp/platn/index.html last;
    }
}
