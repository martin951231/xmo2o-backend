<!doctype html>

<html>

    <head>
        <meta charset="utf-8" />
        <script src="./jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
        <script type="text/javascript" src="./bootstrap/js/bootstrap.min.js" charset="utf-8"></script>
        <script src="./app.js" type="text/javascript" charset="utf-8"></script>
        <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet" />
        <script>

        </script>

        <style>
            html,body{
                background-color: #5e5e5e;
                padding: 0;
                margin: 0;
            }
            #page{
                margin: 1em auto;
                max-width: 700px;
            }

            #page .title2{
                font-weight: bold; color:#e89023; display: inline;margin:0;padding:0;font-weight: bold;height: 40px;line-height: 40px;
            }

            #page form{
                padding: 1em;
                border: 1px solid #c0c0c0;
                border-radius: 4px;
                margin-bottom: 0em;
                background-color: #ffffff;
            }

            #page .sreen{
                min-height: 50px;
                line-height: 50px;
                background-color: #0f0f0f;
                padding:0.4em;
                margin: 10px 0 8px 0;
                border-radius: 4px;
                font-size: 32px;
                color: #fff;
                position: relative;
            }

            #page .sreen .code{
                word-spacing:16px; letter-spacing: 4px;
                text-align: center;
                display: block;
            }

            #page .sreen .icons{
                font-size: 24px;
                position: absolute;
                left: 20px;
                bottom: 24px;
            }

            #page .sreen .icons .c1.on{
                color:greenyellow;
            }
            #page .sreen .icons .c1.off{
                color: #444444;
            }

            #page .sreen .icons .c2.on{
                color:red;
            }
            #page .sreen .icons .c2.off{
                color:#444444;
            }
        </style>

    </head>

    <body>

    <div id="page">
        <center>
            <h2 class="title2" style="">读卡器</h2>

        </center>

        <div class="sreen">
            <span class="code">未连接</span>
            <div class="icons">
                <i class="glyphicon glyphicon-resize-small c1 off"></i>
                <i class="glyphicon glyphicon-exclamation-sign c2 on"></i>
            </div>
        </div>

        <form class="form-horizontal">
            <div class="form-group">
                <label class="col-sm-2">串口设备：</label>
                <div class="col-sm-10">
                    <span class="dev_desc">...</span>
                </div>
            </div>
        </form>
    </div>
    </body>
