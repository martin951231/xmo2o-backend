<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>视频播放</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    .main-box {
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        overflow: hidden;
    }

    #video {
        width: 100%;
        height: 100%;
        background-color: #000;
    }
</style>

<body>
    <div class="main-box">
        <video id="video" controls width="600"></video>
    </div>

    <script src="./scripts/hls.js"></script>
    <script>
        // 获取当前页面的查询参数
        const params = new URLSearchParams(window.location.search);

        // 获取指定参数的值
        const videoUrl = params.get('url'); // 替换 'paramName' 为实际参数名
        const title = params.get('title');
        document.title = title || '视频播放'
        const video = document.getElementById('video');
        const videoSrc = videoUrl; // HLS 流地址

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // 对于原生支持 HLS 的浏览器
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => {
                video.play();
            });
        } else {
            alert('此浏览器不支持 HLS 播放');
        }
    </script>
</body>

</html>
