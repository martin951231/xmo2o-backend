<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>修改邮箱</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>  
		<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/birth_email.css" rel="stylesheet"/> 
		<style>
		   .weui-dialog__bd:first-child {
				padding: 15px 20px 1.7em;
				color: #353535;
				text-align: center
			}
			.weui-dialog__bd{
				text-align: center
			}
		
		</style>
	</head>
	<body> 
		 <div class="">
		 	<p class="pwdTil center"><L_>请填写您的邮箱</L_></p>   
			 <div class="regInput center" style="width:260px">
				<input type="email" name="email" id="email" class="email" style="width:260px"  placeholder="点击填写您的邮箱" />
			</div> 
		 </div> 
		<div class="bottmButton">
		 	<button class="next"><label class="red"><L_>保存</L_></label><i class="iconfont">&#xe600;</i></button>
		</div> 
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/common.js"></script>
		<script src="scripts/weui/weui.min.js"></script>
		<script>
			
			common.iosKeybordTop('email');
			if(!common.checkIos()){
				// $('#email').focus();
			}
			
			common.removeCache('userInfo',true);
			var userInfo = {}; 
            var email=''
			load_config(function(){  
				userInfo = common.getCache('userInfo',true);
                $('#email').val(userInfo.email);  
			},true); 
 
			$('.bottmButton').click(function(){    
                $('#email').val($.trim($('#email').val()));
                // alert($('#email').val());
                email=$('#email').val() 
                if(email != '' && /^((([a-z]|\d|[!#\$%&'\*\+\-\/=\?\^_`{\|}~]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])+(\.([a-z]|\d|[!#\$%&'\*\+\-\/=\?\^_`{\|}~]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])+)*)|((\x22)((((\x20|\x09)*(\x0d\x0a))?(\x20|\x09)+)?(([\x01-\x08\x0b\x0c\x0e-\x1f\x7f]|\x21|[\x23-\x5b]|[\x5d-\x7e]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])|(\\([\x01-\x09\x0b\x0c\x0d-\x7f]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF]))))*(((\x20|\x09)*(\x0d\x0a))?(\x20|\x09)+)?(\x22)))@((([a-z]|\d|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])|(([a-z]|\d|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])([a-z]|\d|-|\.|_|~|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])*([a-z]|\d|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])))\.)+(([a-z]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])|(([a-z]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])([a-z]|\d|-|\.|_|~|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])*([a-z]|[\u00A0-\uD7FF\uF900-\uFDCF\uFDF0-\uFFEF])))\.?$/.test(email)){  
                    console.log($('#email').val())
                    common.http('My&a=email',{email:$('#email').val()},function(result){ 
                        weui.toast('操作成功', {
                            duration: 1000,
                            className: 'custom-classname1',
                            callback: function(){openWebviewUrl('back'); }
                        }); 
                         
                    },function(errData){
                        if($('#email').val() == userInfo.email ){
                             weui.confirm(L_('不能和原来的邮箱一样！'), { 
                              buttons: [{
                                  label: L_('知道了！'),
                                  type: 'default',
                                  onClick: function(){  
                                      $('#email').val(userInfo.email);  
                                  }
                              }]
                            });
                        } 
                    });  
               }
               else{ 
                    weui.confirm(L_('邮箱输入不对！'), { 
                      buttons: [{
                          label: L_('知道了！'),
                          type: 'default',
                          onClick: function(){  
                              $('#email').val(userInfo.email);  
                          }
                      }]
                    });
               } 
			});
		</script> 
	</body>
</html>
