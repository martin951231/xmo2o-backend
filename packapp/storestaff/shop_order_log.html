<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no,minimal-ui">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>店员中心</title>
    <link href="css/order_detail.css" rel="stylesheet">
    <script src="scripts/jquery-1.8.3.min.js"></script>
    <!-- <script src="https://api.map.baidu.com/api?v=2.0&ak=4c1bb2055e24296bbaef36574877b4e2"></script> -->
</head>
<body style="zoom: 1;">
<section class="public">
    <div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
    <div class="content"><L_>订单状态</L_></div>
</section>
<div class="h44"></div>
<section class="g_details">
    <div class="orders_list"><ul></ul></div>
</section>
<script src="scripts/jquery-1.8.3.min.js"></script>
<script src="scripts/fastclick.js"></script>
<script src="scripts/layer/layer.m.js"></script>
<script src="scripts/common.js"></script>
<script src="scripts/work/shop_order_log.js"></script>
<script id="logTpl" type="text/html">
{{# for (var i in d) { }}
<li>
    <div class="time">{{ d[i].dateline }}</div>
    <div class="p18">
        <div class="con">
            {{# if (d[i].status == 0) { }}
                 <h2>{{ L_('订单生成成功') }}</h2>
                 <p>{{ L_('订单编号') }}：{{ d[i].real_orderid }}</p>
            {{# } else if (d[i].status == 1) { }}
                <h2>{{ L_('订单支付成功') }}</h2>
                <p>{{ L_('订单编号') }}：{{ d[i].real_orderid }}</p>
            {{# } else if (d[i].status == 2) { }}
                {{# if(d[i].note == '订单已确认，商家备货中'){ }}
                    <h2>{{ L_('店员已接单') }}</h2>
                    <p>订单已确认，商家备货中</p>
                {{#  }else if(d[i].note == 'update'){ }}
                    <h2>{{ L_('修改快递信息') }}</h2>
                    <p>{{ L_('已将快递公司修改为') }}<strong style="color:red"><L_>【{{d[i].express_name}}】</L_></strong>，{{ L_('快递单号') }}：<strong style="color:green">{{d[i].express_number}}</strong></p>
                {{#  }else if(d[i].is_pick_in_store == 3){ }}
                    <h2>{{ L_('店员已发货') }}</h2>
                    <p>{{ L_('已发货给快递公司') }}<strong style="color:red"><L_>【{{d[i].express_name}}】</L_></strong>，{{ L_('快递单号') }}：<strong style="color:green">{{d[i].express_number}}</strong></p>
                {{# }else{ }}
                    <h2>{{ L_('店员接单') }}</h2>
                    <p>{{ L_('店员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('正在准备商品') }}</p>
                {{# } }}                
            {{# } else if (d[i].status == 3) { }}
				{{# if (d[i].from_type == 0) { }}
					<h2>{{ L_('配送员接单') }}</h2> 
					<p>{{ L_('配送员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('正在赶往店铺取货') }}</p>
				{{# } else { }}
					<h2>{{ L_('分配配送员') }}</h2> 
					<p>{{ L_('配送员') }}：{{ L_('订单已分配给') }} {{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>，{{ L_('等待配送员接单') }}</p>
				{{# } }}
			{{# } else if (d[i].status == 4) { }}
                <h2>{{ L_('配送员取货') }}</h2>
                <p>{{ L_('配送员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>{{ L_('已取货，准备配送，请耐心等待') }}</p>
            {{# } else if (d[i].status == 5) { }}
                <h2>{{ L_('配送员配送中') }}</h2>
                <p>{{ L_('配送员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>{{ L_('正在配送中，请耐心等待！') }}</p>
            {{# } else if (d[i].status == 6) { }}
                <h2>{{ L_('订单已完成') }}</h2>
                <p>{{# if(d[i].is_pick_in_store < 2){ }} {{ L_('配送员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>{{ L_('已完成配送，欢迎下次光临！') }}{{# }else{ }}{{ L_('订单编号') }}：{{ d[i].real_orderid }} {{# } }}</p>
            {{# } else if (d[i].status == 7) { }}
                {{# if (d[i].is_pick_in_store == 3) { }}
                    <h2>{{ L_('店员已发货') }}</h2>
                    <p>{{ L_('店员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已发货给快递公司') }}<strong style="color:red"><L_>【{{ d[i].express_name }}】</L_></strong>，{{ L_('快递单号') }}：<strong style="color:green">{{ d[i].express_number }}</strong></p>
                {{# } else { }}
                    <h2>{{ L_('店员验证消费') }}</h2>
                    <p>{{ L_('店员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>{{ L_('将订单改成已消费') }}</p>
                {{# } }}
            {{# } else if (d[i].status == 8) { }}
                <h2>{{ L_('完成评论') }}</h2>
                <p>{{ L_('您已完成评论，谢谢您提出宝贵意见！') }}</p>
            {{# } else if (d[i].status == 9) { }}
                <h2>{{ L_('已完成退款') }}</h2>
                <p>{{# if (d[i].note == '') { }}{{ L_('您已完成退款') }}{{# } else { }} {{ d[i].note }} {{# } }}</p>
            {{# } else if (d[i].status == 10) { }}
                <h2>{{ L_('已取消订单') }}</h2>
                <p>{{# if (d[i].note == '') { }}{{ L_('您已经取消订单') }}{{# } else { }} {{ d[i].note }} {{# } }}</p>
            {{# } else if (d[i].status == 11) { }}
                <h2>{{ L_('商家分配自提点') }}</h2>
                <p>{{ L_('店员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a>{{ L_('给您分配') }}</p>
            {{# } else if (d[i].status == 12) { }}
                <h2>{{ L_('商家发货到自提点') }}</h2>
                <p>{{ L_('总数量') }}店员：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已经给您发货到配送点') }}</p>
            {{# } else if (d[i].status == 13) { }}
                <h2>{{ L_('自提点已接货') }}</h2>
                <p>{{ L_('自提点') }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong> <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已经接到您的货物了') }}</p>
            {{# } else if (d[i].status == 14) { }}
                <h2>{{ L_('自提点已发货') }}</h2>
                <p>{{ L_('自提点') }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong> <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已经给您发货了') }}</p>
            {{# } else if (d[i].status == 15) { }}
                <h2>{{ L_('您在自提点取货') }}</h2>
                <p>{{ L_('您在自提点') }}{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已经把您的货提走了！') }}</p>
            {{# } else if (d[i].status == 30) { }}
                <h2>{{ L_('店员为您修改了价格') }}</h2>
                <p>{{ L_('店员') }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong> <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('已将订单的总价修改成') }} {{ d[i].note }}</p>
            {{# } else if (d[i].status == 31) { }}
                <h2>{{ L_('配送员放弃配送') }}</h2>
                <p>{{ d[i].note }}</p>
			{{# } else if (d[i].status == 34) { }}
                <h2>{{ L_('订单已被取消') }}</h2>
                <p>{{ L_('无法达成配送，已为您取消订单') }}</p>
			{{# } else if (d[i].status == 35) { }}
                <h2>{{ L_('配送员接单') }}</h2>
                <p>{{ L_('配送员') }}：{{# if (d[i].name != '') { }}<strong style="color:red"><L_>【{{ d[i].name }}】</L_></strong>{{# } }} <a class="tel-btn" href="tel:{{ d[i].phone }}">{{ d[i].phone }}</a> {{ L_('正在赶往店铺取货') }}</p>
            {{# } else if (d[i].status == 36) { }}
                <h2>{{ L_('确认收货') }}</h2>
                <p>{{ d[i].note }}</p>
            {{# } else if (d[i].status == 41) { }}
                <h2>{{ L_('申请取消订单') }}</h2>
                <p>{{ L_('订单编号') }}：{{ d[i].real_orderid }}</p>
            {{# } else if (d[i].status == 42) { }}
                <h2>{{ L_('撤销申请取消订单') }}</h2>
                <p>{{ L_('订单编号') }}：{{ d[i].real_orderid }}</p>
            {{# } }}
            {{# if (i == 0) { }}
            <!-- <div class="map clr">
                <div class="pho" id="allmap"></div>
                <div class="refresh fr"></div>
            </div> -->
            {{# } }}
        </div>
    </div>
</li>
{{# } }}
</script>
</body>
</html>
