	<meta charset="utf-8" />
	<title>店员中心</title>
	<meta name="viewport"
		content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width" />
	<meta http-equiv="pragma" content="no-cache" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name='apple-touch-fullscreen' content='yes' />

<body style="background: url(images/dlbj_03.jpg) center no-repeat #2ecc71; background-size: 100% 100%;">
	<section class="signin">
		<div class="land_pos">
			<div class="land">
				<div class="logo">
					<img src="images/logo.png" />
				</div>
				<div class="clerk">
					<div class="clr clerk_input">
						<div class="fl pos number"></div>
						<div class="input">
							<input type="text" placeholder="请输入您的店员账号" id="account" autocomplete="off" />
						</div>
					</div>
					<div class="clr clerk_input">
						<div class="fl pos password"></div>
						<div class="input">
							<input type="password" placeholder="请输入您的店员密码" id="passwd" autocomplete="off" />
						</div>
					</div>
					<div class="remember clr" style="display:none;" id="reg_account">
						<div class="fr"><a style="color:#fff" href="reg.html">
								<L_>注册账号</L_> >
							</a></div>
					</div>
				</div>
				<div class="sign_bun">
					<L_>登 录</L_>
				</div>
				<div class="remember clr" style="display:none;">
					<div class="fl">
						<input type="checkbox" id="checkbox_c1" class="chk" checked="checked" />
						<label for="checkbox_c1"></label>
					</div>
					<div class="fl">
						<L_>记住密码</L_>
					</div>
				</div>
			</div>
		</div>
		<div class="fixedAgreement">
			<input class="weui-form-checkbox" id="login_agreement" type="checkbox" />
			<label style="display: flex;align-items: center; justify-content: center;" for="login_agreement">
				<i class="weui-icon-checkbox"></i>
				<p style="color: #fff;">登录代表你已经同意<span id="goAgreement">隐私政策</span></p>
			</label>
		</div>
		<div class="mark">
			<div class="noAgree">
				<img src="images/notice.png" style="width:60px" />
				<p class="textP">
					<L_>若不同意则不能正常使用本软件！</L_>
				</p>
				<button class="seen">知道了</button>
			</div>
		</div>
		<style>
			.fixedAgreement {
				position: absolute;
				bottom: 20px;
				text-align: center;
				width: 100%;
				left: 0;
				z-index: 0;


				display: none;
			}

			.fixedAgreement #goAgreement {
				color: red;
				display: inline-block;
				border: none;
				margin: 0;
				border: none;
				border-radius: 0px;
				font-size: 14px;
				width: auto;
			}

			.mark {
				width: 100%;
				height: 100%;
				position: fixed;
				left: 0;
				top: 0;
				z-index: 999;
				display: none;
				background-color: rgba(0, 0, 0, 0.7);
			}

			.noAgree {
				width: 70%;
				padding: 10px;
				margin: 60% auto;
				text-align: center;
				background: #fff;
				border-radius: 4px;
				padding: 20px 0 0 0;
			}

			.textP {
				padding: 10px 0;
			}

			.seen {
				color: #1b9dff;
				background: #fff;
				font-size: 16px;
				padding: 20px 0;
			}
