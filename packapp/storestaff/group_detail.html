<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>店员中心</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width,viewport-fit=cover"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
		<link href="css/pigcms.css?t=3" rel="stylesheet"/>
	</head>
	<body>
		<section class="public pageSliderHide">
			<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
			<div class="content"><L_>订单详情</L_></div>
		</section>
		<div class="nav-height"></div>
		<section class="g_details">
			<div class="commod detail_list"></div>

			<div class="user detail_list"></div>


			<div class="write detail_list"></div>

			<div class="distri detail_list" id="distriBox"></div>

            <div class="hotel detail_list"></div>

            <div class="order detail_list"></div>

			<div class="payment detail_list" id="paymentBox"></div>

			<div class="leaving detail_list"></div>
		</section>

		<section class="consum_tc">
			<div class="consum_tc_n">
				<div class="tc_top"><L_>消费码验证</L_></div>
				<div class="scroll">
					<ul></ul>
				</div>

				<div class="all">
					<span id="allVerify"><L_>全部验证</L_></span>
				</div>

				<div class="del"></div>
			</div>
		</section>
		<div class="mask"></div>
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/JRoll.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js?t=8"></script>
		<script src="scripts/work/group_detail.js"></script>


		<script id="passList" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
			<li class="clr">
				<span class="fl">{{ d[i].group_pass }}</span>
				{{# if (d[i].status == 0 ) { }}
				<span class="fr a39" data-pass="{{ d[i].group_pass }}">{{ L_('验证') }}</span>
				{{# } else { }}
				<span class="fr ecc">{{ L_('已消费') }}</span>
				{{# } }}
			</li>
			{{# } }}
		</script>
		<script id="goodsDetail" type="text/html">
			<div class="top clr">
				<h2 class="fl">{{ L_('商品信息') }}</h2>
				{{# if ((d.type==4 || d.type == 7) && d.is_pick_in_store == 1 && d.group_start_status != 0) { }}
				<div class="consum fr" data-type="0">{{ L_('用户取货确认') }}</div>
				{{# } else if (d.type == 1 && d.tuan_type != 2 ) { }}
				<div class="consum fr " id="consume" data-type="{{ d.pass_array }}">{{ L_('消费验证') }}</div>
				{{# } }}
			</div>
			<div class="commod_list">
				<div class="img fl">
					<img src="{{ d.pic }}">
				</div>
				<div class="content">
					<h2>{{ d.s_name }}</h2>
					<div class="clr price">
						<div class="fl">{{ L_('单价') }}<L_>：{{ currency_symbol }}{{ d.price }}</div>
						<div class="fl">{{ L_('数量') }}：{{ d.num}}</div>
					</div>
					<div class="clr">
						<div class="fl total" style="font-size:14px">{{ L_('共计') }}：{{ currency_symbol }}{{ d.total_money }}</div>
						<div class="state fr">
							{{# if(d.group_start_status == 0){ }}
								<span class="ff0">{{ L_('未成团') }}</span>
							{{# } else if(d.group_start_status == 2) { }}
								<span class="ff0">{{ L_('已过期') }}</span>
							{{# } else { }}

								{{# if (d.type == 1) { }}
								<span class="a2a">{{ L_('未消费') }}</span>
								{{# } else if (d.type == 2) { }}
								<span class="ef6">{{ L_('未发货') }}</span>
								{{# } else if (d.type == 3) { }}
								<span class="ecc">{{ L_('已消费') }}</span>
								{{# } else if (d.type == 4 && d.is_pick_in_store == 1) { }}
								<span class="ef6">{{ L_('未取货') }}</span>
								{{# } else if (d.type == 4) { }}
								<span class="ecc">{{ L_('已发货') }}</span>
								{{# }else if(d.type == 8){ }}
								<span class="ecc">{{ L_('已取货') }}</span>
								{{# } }}

								{{# if(d.status == 1){ }}
								<span class="ff0">{{ L_('已取消') }}</span>
								{{# }else if(d.status == 2){ }}
								<span class="ff0">{{ L_('线下未支付') }}</span>
								{{# }else if(d.status == 3){ }}
								<span class="ecc">{{ L_('已付款') }}</span>
								{{# }else if(d.status == 4){ }}
								<span class="ff0">{{ L_('待评论') }}</span>
								{{# }else if(d.status == 5){ }}
								<span class="ecc">{{ L_('已完成') }}</span>
								{{# }else if(d.status == 6){ }}
								<span class="ff0">{{ L_('未付款') }}</span>
								{{# }else if(d.status == 9){ }}
								<span class="ff0">{{ L_('已过期') }}</span>
								{{# } }}
							{{# } }}
						</div>
					</div>
				</div>
			</div>
		</script>
		<script id="userDetail" type="text/html">
			<div class="top clr">
				<h2 class="fl">{{ L_('用户信息') }}</h2>
			</div>
			<div class="user_list">
				<ul>
					<li class="clr">
						<span class="fl">{{ L_('用户ID') }}</span>
						<span class="fr">{{ d.uid }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('用户名') }}</span>
						<span class="fr">{{ d.nickname }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('手机号') }}</span>
						<span class="fr blue callPhone" data-phone="{{ d.user_phone }}">{{ d.user_phone }}</span>
					</li>
				</ul>
			</div>
		</script>

		<script id="writeDetail" type="text/html">
			{{# console.log(d);if(d){ }}
			<div class="top clr">
				<h2 class="fl">{{ L_('用户填写信息') }}</h2>
			</div>
			<div class="user_list">
				<ul>
					{{# for(var i in d){ }}
						{{# if (d[i]){ }}
							<li class="clr">
								<span class="fl">{{ d[i].name }}</span>
								<span class="fr">{{ d[i].value }}</span>
							</li>
						{{# } }}
					{{# } }}
				</ul>
			</div>
			{{# } }}
		</script>

		<script id="addressDetail" type="text/html">
			<div class="top clr">
				<h2 class="fl">{{ L_('配送信息') }}</h2>
			</div>
			<div class="distri_list">
				<ul>
					<li class="clr address">
						<div class="tit">
							<div class="tit_top clr">
								<div class="fl">{{ L_('收件人') }}：{{ d.distribution.contact_name }}</div>
								<div class="fr blue callPhone" data-phone="{{ d.distribution.phone }}">{{ d.distribution.phone }}</div>
							</div>
							<div class="tit_bot openMap" data-type="baidu" data-lng="{{ d.distribution.contact_name }}" data-lat="{{ d.distribution.contact_name }}" data-name="收件人：{{ d.distribution.contact_name }}" data-address="{{ d.distribution.adress }}">
								{{ L_('收货地址') }}：{{ d.distribution.adress }}
							</div>
						</div>
					</li>
					{{# if(d.pin_info=='' || d.pin_info.status==1|| d.pin_info.status==3){ }}
					<li class="clr express">
						<h2>{{ L_('快递信息') }}</h2>
						<div class="expressage clr">
							<div class="select">
								<select>
									{{# for(var i = 0, len = d.express_list.length; i < len; i++){ }}
									{{# if(d.distribution.express_type == d.express_list[i].ids){ }}
									<option value="{{ d.express_list[i].ids }}" selected>{{ d.express_list[i].name }}</option>
									{{# }else{ }}
									<option value="{{ d.express_list[i].ids }}" >{{ d.express_list[i].name }}</option>
									{{# } }}
									{{# } }}
								</select>
							</div>
							<div class="input">
								<input type="text" placeholder="点击输入快递号" value="{{ d.distribution.express_id }}"/><div class="sweep"></div>
							</div>
							<div class="preser">{{ L_('保存') }}</div>
						</div>
					</li>
					{{# }else{ }}
					<li class="clr express">
						<h2>{{ L_('快递信息') }}</h2>
						<div class="expressage clr">{{ L_('还未成团不能填写快递信息') }}</div>
					</li>
					{{# } }}
					<li class="clr express additional">
						<h2>{{ L_('额外信息') }} <span class="modify">{{ L_('修改') }}</span></h2>
						<div class="textarea">
							<textarea placeholder="点击进行修改信息">{{ d.distribution.merchant_remark }}</textarea>
						</div>
					</li>
				</ul>
			</div>
		</script>
        <script id="hotelDetail" type="text/html">
			<div class="top clr">
				<h2 class="fl">{{ L_('酒店订单详情') }}</h2>
			</div>
			<div class="user_list">
				<ul>
					<li class="clr">
						<span class="fl">{{ L_('房间类型') }}</span>
						<span class="fr">{{ d.cat_pname }} ({{ d.cat_name }})</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('入住时间') }}</span>
						<span class="fr">{{ d.dep_time_txt }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('离店时间') }}</span>
						<span class="fr">{{ d.end_time_txt }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('房间数') }}</span>
						<span class="fr">{{ d.num }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('入住天数') }}</span>
						<span class="fr">{{ parseInt(d.book_day) }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('价格清单') }}</span>
					</li>
					{{# for (var i in d.price_list_txt) { }}
					<li class="clr">
						<span class="fl">{{ d.price_list_txt[i].day }}</span>
						<span class="fl" style="margin-left:5px;"> {{ currency_symbol }}{{d.price_list_txt[i].price}} * {{ d.num }}</span>

					</li>
					{{# } }}
					{{# if(d.paid==1 && d.use_time == 0){ }}
					 <div class="top clr">
						<h2 class="fl">{{ L_('退款') }}</h2>
					</div>
						{{# for (var i in d.price_list_txt) { }}
							<li class="clr">
								<span class="fl">{{ d.price_list_txt[i].day2 }}</span>
								<span class="fl" style="margin-left:5px;"> {{ L_('可退') }} {{ d.price_list_txt[i].can_refund_day }} {{ L_('间') }}</span>
								{{# if(d.price_list_txt[i].can_refund_day>0){ }}
								<div class="Addsub">
									<a href="javascript:void(0)" class="jian" data-id="{{ i }}" style="display: inline;"></a>   <input type="text" value="0" readonly="true" class="refund_num" data-id="{{ d.price_list_txt[i].day_key }}" id="refund_num_{{ i }}" name="refund_num[{{ i }}]" style="display: inline-block;">
									<a href="javascript:void(0)" class="jia" data-id="{{ i }}" data-max_num="{{ d.price_list_txt[i].can_refund_day }}"></a>
								</div>

								{{# } }}
							</li>
						{{# } }}
						<li class="clr refund_button" style="display:none;">
							<div class="hotel_refund fr" id="hotel_refund">{{ L_('酒店退款') }}</div>
						</li>
					{{# } }}

					{{# if(d.refund_detail.score>0){ }}
					 <li class="clr">
						<span class="fl">{{ L_('已退积分') }}</span>
						<span class="fl" style="margin-left:5px;"> {{d.refund_detail.score}} </span>

					</li>
					{{# } }}
					{{# if(d.refund_detail.merchant_balance>0){ }}
					<li class="clr">
						<span class="fl">{{ L_('已退商家余额') }}</span>
						<span class="fl" style="margin-left:5px;"> {{ currency_symbol }}{{ d.refund_detail.merchant_balance }} </span>

					</li>
					{{# } }}

					{{# if(d.refund_detail.balance_pay>0){ }}
					<li class="clr">
						<span class="fl">{{ L_('已退平台余额') }}</span>
						<span class="fl" style="margin-left:5px;"> {{ currency_symbol }}{{d.refund_detail.balance_pay}} </span>

					</li>
					{{# } }}
					{{# if(d.refund_detail.payment_money>0){ }}
					<li class="clr">
						<span class="fl">{{ L_('已退在线支付') }}</span>
						<span class="fl" style="margin-left:5px;"> {{ currency_symbol }}{{d.refund_detail.payment_money}} </span>

					</li>
					{{# } }}
				</ul>
			</div>
        </script>
        <script id="orderDetail" type="text/html">
			<div class="top clr">
				<h2 class="fl">{{ L_('订单信息') }}</h2>
			</div>
			<div class="user_list">
				<ul>
					<li class="clr">
						<span class="fl">{{ L_('订单类型') }}</span>
						<span class="fr">{{ d.order_type }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('订单号') }}</span>
						<span class="fr">{{ d.real_orderid }}</span>
					</li>
					<li class="clr">
						<span class="fl">{{ L_('下单时间') }}</span>
						<span class="fr">{{ d.add_time }}</span>
					</li>
					{{# if ('未支付' != d.pay_time) { }}
					<li class="clr">
						<span class="fl">{{ L_('付款时间') }}</span>
						<span class="fr">{{ d.pay_time }}</span>
					</li>
					{{# }else{ }}
					 <li class="clr">
						<span class="fl">{{ L_('支付状态') }}</span>
						<span class="fr" style="color:red;">{{ L_('未支付') }}</span>
					</li>
					{{# } }}
					{{# if (d.refund_detail.refund_time && d.status == 1) { }}
					 <li class="clr">
						<span class="fl">{{ L_('退款时间') }}</span>
						<span class="fr" style="color:red;">{{ d.refund_detail.refund_time }}</span>
					</li>
					{{# } }}
					{{# if (d.pass_array_arr.length>0) { }}
					<li class="clr">
						<span class="fl">{{ L_('消费密码') }}</span>
						{{# for(var i = 0, len = d.pass_array_arr.length; i < len; i++){ }}
							<span class="fr" style="font-size: 12px;">
							{{ d.pass_array_arr[i].group_pass }}
							{{# if (d.pass_array_arr[i].verify_time) { }}
								(核销时间：{{ d.pass_array_arr[i].verify_time }})
							{{# } }}
							</span><br>
						{{# } }}
					</li>
					{{# }else if(d.group_pass){ }}
					<li class="clr">
						<span class="fl">{{ L_('消费密码') }}</span>
						<span class="fr" style="font-size: 12px;">
							{{ d.group_pass }}
							{{# if (d.verify_time) { }}
							(核销时间：{{ d.verify_time }})
							{{# } }}
						</span>
					</li>
					{{# } }}
				</ul>
			</div>
        </script>
		<script id="paymentDetail" type="text/html">
		<div class="top clr">
			<h2 class="fl">{{ L_('付款方式') }}</h2>
		</div>
		<div class="user_list">
			<ul>
				<li class="clr">
					<span class="fl">{{ L_('支付方式') }}</span>
					<span class="fr" {{# if(d.paytypestr=='货到付款(微信端)'){ }} style="color:red;" {{# } }}>{{ d.paytypestr }}</span>
				</li>
				{{# if (d.use_ecard_price>0) { }}
				<li class="clr" >
					<span class="fl">{{ L_('平台E卡支付') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.use_ecard_price }}</span>
				</li>
				{{# } }}
				<li class="clr">
					<span class="fl">{{ L_('平台余额支付') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.balance_pay }}</span>
				</li>

				<li class="clr">
					<span class="fl">{{ L_('平台积分抵扣') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.score_deducte }}</span>
				</li>
				<li class="clr">
					<span class="fl">{{ L_('平台优惠券') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.coupon_price }}</span>
				</li>
				<li class="clr">
					<span class="fl">{{ L_('商家优惠券') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.card_price }}</span>
				</li>
				<li class="clr">
					<span class="fl">{{ L_('商家会员卡折扣') }}</span>
					<span class="fr">{{ d.card_discount }}</span>
				</li>
				<li class="clr">
					<span class="fl">{{ L_('商家会员卡余额支付') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.merchant_balance }}</span>
				</li>
				<li class="clr">
					<span class="fl">{{ L_('在线支付金额') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.payment_money }}</span>
				</li>
				{{# if (d.internal_card_pay_money > 0) { }}
				<li class="clr">
					<span class="fl">{{ L_('一卡通支付金额') }}</span>
					<span class="fr">{{ currency_symbol }}{{ d.internal_card_pay_money }}</span>
				</li>
				{{# } }}
			</ul>
		</div>
		</script>
	</body>
</html>
