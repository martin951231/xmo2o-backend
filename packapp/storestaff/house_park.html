<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>店员中心</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
		<link href="css/pigcms.css" rel="stylesheet"/>
		<style>
			.store_list li{
				padding: 20px 3%;
				border-bottom: 1px solid #e6e6e6;
				position: relative;
				margin: 0 2%;
				width: 90%;
			}
			.store_list li:last-child{
				border-bottom: none;
			}
			.store_list li:after {
				content: " ";
				display: inline-block;
				height: 6px;
				width: 6px;
				border-width: 2px 2px 0 0;
				border-color: #c8c8cd;
				border-style: solid;
				-webkit-transform: matrix(.71,.71,-.71,.71,0,0);
				transform: matrix(.71,.71,-.71,.71,0,0);
				top: -2px;
				position: absolute;
				top: 50%;
				margin-top: -4px;
				right: 10px;
			}
		</style>
	</head>
	<body>
		<section class="public pageSliderHide">
			<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
			<div class="content"><L_>停车优惠券</L_></div>
		</section>
		<section class="p40 store_list" id="store_list">
			<ul></ul>
		</section>
		<script id="listTpl" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
				<li class="link-url" data-url="{{ d[i].turn_url }}" data-webview="true">
					{{ d[i].village_name }}
				</li>
			{{# } }}
		</script>
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js"></script>
		<script>
			common.http('Storestaff&a=house_park', {store_id: urlParam.store_id}, function(data){
				if(data.store_list.length > 0){
					for(var i in data.store_list){
						data.store_list[i].turn_url = 'iframe.html?url=' + escape(data.store_list[i].turn_url) + '&title=' + escape(data.store_list[i].village_name);
					}
				}
				laytpl($('#listTpl').html()).render(data.store_list, function(html){
					$('#store_list ul').append(html);
				});
			});
		</script>
	</body>
</html>
