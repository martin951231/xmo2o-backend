<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8"/>
        <title>店员中心</title>
        <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
        <meta http-equiv="pragma" content="no-cache"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name='apple-touch-fullscreen' content='yes'/>
        <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
        <meta name="format-detection" content="telephone=no"/>
        <meta name="format-detection" content="address=no"/>
        <link href="css/pigcms.css" rel="stylesheet"/>
		<link rel="stylesheet" type="text/css" href="css/css_whir.css">
		<style>
			.elastic .Switch li.on {
			    background: #2ecc71;
			}
			.Resersub input{
			    background: #2ecc71;
			}
			.elastic .swiper-wrapper .on {
			    border-bottom: #2ecc71 1px solid;
			    color: #2ecc71;
			}
			.setup li.classify,.setup li.number {
			    padding-right: 10px;
			}
			.reserve .reserve_tab .swi li{ width:33%; flex:1;-webkit-box-flex:1;height:30px;}
		</style>
    </head>
    <body>
        <section class="public">
            <div class="return link-url" data-url-type="openLeftWindow" data-url="back" data-closewebview="true"></div>
            <div class="content"><L_>桌台列表</L_></div>
        </section>
        
        <section class="reserve">
            <div class="reserve_tab" style="padding:8px 0;">
				<div class="search">
					<input type="text" id="searchTxt" placeholder="搜索桌台"/>
				</div>
                <div class="tab swi swiper-container">
                    <ul class="swiper-wrapper" id="tableTypeBox"></ul>
                </div>
            </div>
			<div id="tableBox"></div>
			<div id="tableSearchBox">
				<div class="lock">
					<ul class="clr"></ul>
				</div>
			</div>
        </section>

        <section class="table_details">
            <h2><L_>餐桌预订详情</L_></h2>
            <div class="tab_list"><ul></ul></div>
            <div class="del"></div>
        </section>

		<script id="bookListTpl" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
				<li>
					<div class="tit">{{ L_('订单编号') }}：{{ d[i].real_orderid }}</div>
					<div class="con">
						<dl class="clr">
							<dd>{{ L_('客户姓名') }}：{{ d[i].name }}</dd>
							<dd class="callPhone" data-phone="{{ d[i].phone }}">{{ L_('客户电话') }}：{{ d[i].phone }}</dd>
							<dd>{{ L_('预  订 金') }}：<span>{{ L_('￥') }}{{ d[i].book_price_txt }}</span></dd>
							<dd>{{ L_('预定时间') }}：{{ d[i].book_time_txt }}</dd>
						</dl>
					</div>  
				</li>
			{{# } }}
		</script>
		<script id="tableTypeTpl" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
				<li class="swiper-slide" data-type_id="{{ d[i].id }}">{{ d[i].name }}</li>
			{{# } }}
		</script>
		<script id="tableListTpl" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
				<div class="lock">
					<ul class="clr flex flex-wrap">
						{{# for(var j = 0, jlen = d[i].table_list.length; j < jlen; j++){ }}
							<li>
								<div class="lock_n">
									<div class="lock_top">
										<h2>{{ d[i].table_list[j].name }}</h2>
										<div class="estate">
											{{# if(d[i].table_list[j].store_open_table_type == 1){ }}
												{{# if(d[i].table_list[j].order_id > 0){ }}
													<div class="current uolock" style="padding-right:40px;">{{ L_('当前状态：就餐中') }}</div>
												{{# }else{ }}
													<div class="current unlock">{{ L_('当前状态：空桌') }}</div>
												{{# } }}
											{{# }else{ }}
												{{# if(d[i].table_list[j].status == 1){ }}
													<div class="current uolock">{{ L_('当前状态：锁定') }}</div>
												{{# }else{ }}
													<div class="current unlock">{{ L_('当前状态：解锁') }}</div>
												{{# } }}
											{{# } }}
											{{# if(d[i].min_people){ }}
											<div class="man_num" style="right: -8px;">（{{ d[i].min_people }}-{{ d[i].max_people }}人）</div>
											{{# } }}
										</div>
									</div>
									<div class="lock_end clr">
										{{# if(d[i].table_list[j].store_open_table_type == 1){ }}
											{{# if(d[i].table_list[j].order_id > 0){ }}
												<div class="dj uolock lock_table_{{ d[i].table_list[j].id }}" data-table_id="{{ d[i].table_list[j].id }}" data-table_type="{{ d[i].table_list[j].tid }}" data-order_id="{{ d[i].table_list[j].order_id }}" data-status="{{ d[i].table_list[j].o_status }}">{{ L_('点击处理') }}</div>
											{{# }else{ }}
												<div class="dj unlock lock_table_{{ d[i].table_list[j].id }}" data-table_id="{{ d[i].table_list[j].id }}" data-order_id="0" data-table_type="{{ d[i].table_list[j].tid }}">{{ L_('点击使用') }}</div>
											{{# } }}
										{{# }else{ }}
											{{# if(d[i].table_list[j].status == 1){ }}
												<div class="dj uolock lock_table_{{ d[i].table_list[j].id }}" data-table_id="{{ d[i].table_list[j].id }}" data-table_type="{{ d[i].table_list[j].tid }}">{{ L_('点击解锁') }}</div>
											{{# }else{ }}
												<div class="dj unlock lock_table_{{ d[i].table_list[j].id }}" data-table_id="{{ d[i].table_list[j].id }}" data-table_type="{{ d[i].table_list[j].tid }}">{{ L_('点击锁定') }}</div>
											{{# } }}
										{{# } }}
										<div class="ck" data-table_id="{{ d[i].table_list[j].id }}">{{ L_('查看预订') }}</div>
									</div>
								</div>
							</li>
						{{# } }}
					</ul>
				</div>
			{{# } }}
		</script>
        <div class="Mask"></div>

        <div class="time_content" style="position: fixed;top: 0;left: 0;bottom: 0;right: 0;background: rgba(0, 0, 0, .6);z-index: 1000;display: none;">
			<section class="elastic" style="height: 667px; overflow: hidden;">
			<div class="swiper-container swiper-container2 swiper-container-horizontal">
				<div class="swiper-wrapper date-wrapper">
				</div>
				<div class="swiper-button-prev"></div> 
				<div class="swiper-button-next"></div> 
			</div>
			<div class="Switch" style="height: 557px;">
			</div>
			<div class="Resersub" style=""><input type="submit" value="确认选择" class=""/></div>
			</section>
		</div>
        <script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
        <script src="scripts/common.js"></script>
        <script src="scripts/swiper-3.3.1.jquery.min.js"></script>
        <script src="scripts/work/foodshop_table_list.js"></script>
		<script src="scripts/JRoll.js"></script>
		<script src="scripts/work/storestaffAppoint.js"></script>
		<script src="scripts/work/foodshop_calll.js"></script>
    </body>
</html>
