<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<title>店员中心</title>
		<meta
			name="viewport"
			content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"
		/>
		<meta http-equiv="pragma" content="no-cache" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-touch-fullscreen" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="format-detection" content="address=no" />
		<link href="css/pigcms.css?t=1" rel="stylesheet" />
		<link href="css/mobiscroll.2.13.2.css" rel="stylesheet" />
		<style>
			.h130 {
				z-index: 1;
			}
			.store {
				margin-top: 128px;
			}
			.tabs {
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.tabs .tabs-item {
				padding: 10px 0;
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.tabs .tabs-item.active {
				color: #2ecc71;
			}
			.store .loading,
			.store .empty {
				display: none;
			}
		</style>
	</head>
	<body>
		<section class="public pageSliderHide">
			<div
				class="return link-url"
				data-url-type="openLeftWindow"
				data-url="back"
			></div>
			<div style="text-align: center; font-size: 16px">
				<L_>体育订单核销记录</L_>
			</div>
		</section>
		<div class="h44"></div>
		<section class="h130">
			<div class="cable">
				<form id="searchForm" method="post">
					<div class="cable_n cable_kd">
						<div class="input">
							<input
								type="search"
								id="find_value"
								placeholder="请输入关键词"
							/>
						</div>
						<div class="select">
							<select id="ft" name="ft">
								<option value="oid" class="L_">订单号</option>
								<option value="xm" class="L_">
									下单人姓名
								</option>
								<option value="dh" class="L_">手机号</option>
							</select>
						</div>
					</div>
				</form>
			</div>
			<div class="fix">
				<div class="kd_time clr">
					<div class="pos fl">
						<input
							type="text"
							placeholder="开始时间"
							readonly="readonly"
							id="stime"
							class="datas"
						/>
					</div>
					<div class="pos fr">
						<input
							type="text"
							placeholder="结束时间"
							readonly="readonly"
							id="etime"
							class="datas"
						/>
					</div>
				</div>
				<div class="tabs">
					<div class="L_ tabs-item" data-type="sportsTicket">
						门票
					</div>
					<div class="L_ tabs-item" data-type="timeCard">次卡</div>
				</div>
			</div>
		</section>
		<section class="store">
			<div class="entry kd_entry entry-sports" data-type="sportsTicket">
				<ul></ul>
				<div class="jroll-infinite-tip L_ loading">正在加载中...</div>
				<div class="jroll-infinite-tip L_ empty">暂无结果</div>
			</div>
			<div class="entry kd_entry entry-timeCard" data-type="timeCard">
				<ul></ul>
				<div class="jroll-infinite-tip L_ loading">正在加载中...</div>
				<div class="jroll-infinite-tip L_ empty">暂无结果</div>
			</div>
		</section>
		<div class="mask"></div>
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js"></script>
		<script src="scripts/mobiscroll.2.13.2.js"></script>
		<script src="scripts/work/sports.js?t=2"></script>

		<script id="listTpl" type="text/html">
			{{# for (var i = 0, len = d.length; i < len; i++){ }}
			<li id="order_{{d[i].order_id}}">
				<div class="top clr">
					<div class="fl">
						{{ L_('核销时间') }}：{{d[i].last_time}}
					</div>
				</div>
				<div class="con">
					<div class="con_top">
						<h2>
							{{ L_('订单编号') }}：<span style="color:#e93e14;"
								>{{d[i].real_orderid}}</span
							>
						</h2>
						{{# if(d[i].username){ }}
						<h2>
							{{ L_('下 单 人') }}：{{d[i].username}}
							<a
								href="javascript:void(0);"
								class="pho callPhone"
								data-phone="{{d[i].userphone}}"
								>{{d[i].userphone}}</a
							>
						</h2>
						{{# } }}
						<p>
							{{ L_('体育馆名称')
							}}：{{d[i].title}}-{{d[i].ticket_title}}
						</p>
						<p>
							{{ L_('核销金额') }}：<span class="red"
								>{{ currency_symbol }}{{d[i].price}}</span
							>
						</p>
					</div>
					<div class="remark">
						<div class="source">
							{{ L_('订单来源') }}：{{d[i].order_from}}
						</div>
					</div>
				</div>
			</li>
			{{# } }}
		</script>
		<script id="timeCardTpl" type="text/html">
			{{# for (var i = 0, len = d.length; i < len; i++){ }}
			<li d="order_{{d[i].order_id}}">
				<div class="top clr">
					<div class="fl">
						{{ L_('核销时间') }}：{{d[i].verify_time_txt}}
					</div>
				</div>
				<div class="con">
					<div class="con_top">
						<h2>
							{{ L_('订单编号') }}：<span style="color:#e93e14;"
								>{{d[i].orderid}}</span
							>
						</h2>
						<p>{{ L_('次卡名称') }}：{{d[i].title}}</p>
						<p>
							{{ L_('用户名称') }}：{{d[i].nickname}}&nbsp;<a
								href="javascript:void(0);"
								class="pho callPhone"
								data-phone="{{d[i].phone}}"
								>{{d[i].phone}}</a
							>
						</p>
						<p>{{ L_('核销店员') }}：{{d[i].staff_name}}</p>
					</div>
					<div class="remark">
						<div class="source">
							{{ L_('订单来源') }}：{{d[i].order_source}}
						</div>
					</div>
				</div>
			</li>
			{{# } }}
		</script>
	</body>
</html>
