<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8"/>
        <title>店员中心</title>
        <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width,viewport-fit=cover"/>
        <meta http-equiv="pragma" content="no-cache"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name='apple-touch-fullscreen' content='yes'/>
        <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
        <meta name="format-detection" content="telephone=no"/>
        <meta name="format-detection" content="address=no"/>
        <link href="css/pigcms.css?t=1" rel="stylesheet"/>
        <link href="css/mobiscroll.2.13.2.css" rel="stylesheet"/>
        <link href="scripts/weui/weui.min.css" rel="stylesheet"/>
        <style type="text/css">
            .refund_image{
                width: 64px;
                height: 64px;
                margin-left: 5px;
                border: 1px solid #ddd;
            }
        </style>
    </head>
    <body>
        <!-- 退款单号 -->
        <input type="hidden" id="business_refund_id" value="0"/>
        <input type="hidden" id="business_order_id" value="0"/>

        <section class="public">
            <div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
            <div class="content"><L_>订单详情</L_></div>
        </section>
        <div class="nav-height"></div>
        <section class="container">
			<section class="caption"></section>
			<section class="g_details">
				<div class="infor rese_infor">
					<ul></ul>
				</div>
			</section>
            <section class="refund_details">
				<div class="infor rese_infor">
					<ul></ul>
				</div>
			</section>
        </section>
        <!--div class="coping">
            <ul>
                <li class="top">
                    <span><L_>顶部</L_></span>
                </li>
                <li class="key">
                    <span><L_>上页</L_></span>
                </li>
            </ul>
        </div-->
        <div class="mask"></div>

        <section class="seek">
            <div class="within">
                <h2><L_>验证服务</L_></h2>
                <div class="con">
                    <div class="img">
                        <img src="images/tct_06.jpg">   
                    </div>
                    <div class="tit">
                        <p class="on"><L_>重要提示</L_></p>
                        <p class="p rig_p">验证服务后，订单状态将修改为已完成，并且不能恢复，<span class="red"><L_>确定验证？</L_></span></p>
                    </div>
                    <div class="button">
                        <input type="hidden" id="order_id" value="0"/>
                        <div class="clr p20">
                            <div class="fl close"><L_>点错了</L_></div>
                            <div class="fr ensure"><L_>确认消费</L_></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="del"></div>
        </section>
        

        <!-- 查看服务轨迹悬浮球 -->
        <div class="order_logs">
            <img src="images/cany2.png">
        </div>

        <script src="scripts/jquery-1.8.3.min.js"></script>
        <script src="scripts/fastclick.js"></script>
        <script src="scripts/layer/layer.m.js"></script>
        <script src="scripts/weui/weui.min.js"></script>
        <script src="scripts/common.js"></script>
        <script src="scripts/work/appoint_order_detail.js?t=1"></script>
        <script id="userDetail" type="text/html">
        <ul class="top">
            <li class="first">
                <div class="h2">
                    <div class="h2_top">
                        <span class="name">{{d.user_name}} </span>
                        <span class="pho callPhone" data-phone="{{ d.user_phone }}">{{d.user_phone}}</span>
                    </div>
                </div>
                {{# if (d.appoint_type == 0) { }}
                    <div class="service ddfw">{{ L_('到店服务') }}</div>
                {{# } else { }}
                    <div class="service smfw">{{ L_('上门服务') }}</div>
                {{# } }}
            </li>
            <li class="two clr">
                <div class="fl">
                    <h2>{{ L_('预约项目') }}</h2>
                    <p>{{ d.appoint_name }}</p>
                </div>
                <div class="fr">
                    <h2>{{ L_('预约时间') }}</h2>
                    <p>{{ d.appoint_date }}&nbsp;{{ d.appoint_time }}</p>
                </div>
            </li>
            {{# if (d.content != '' && d.content != null) { }}
            <li class="two three">
                <h2>{{ L_('留言') }}</h2>
                <p>{{ d.content }}</p>
            </li>
            {{# } }}
            {{# if (d.product_detail != '') { }}
            <li class="two three">
                <h2>{{ L_('选择预约详情') }}</h2>
                <p>{{ L_('名称') }}：{{d.product_detail.name}}&nbsp;&nbsp;&nbsp;&nbsp;{{ L_('价格') }}：{{ currency_symbol }}{{d.product_detail.price}}</p>
            </li>
            {{# } }}
        </ul>
        <ul class="end">
            <li class="two">
                <h2 class="fl">{{ L_('服务状态') }}</h2>
                <p class="p50">
                    <span class="e93">
                    {{# if (d.paid == 0) { }}
                        {{# if (d.service_status == 0) { }}{{ L_('未服务') }}
                        {{# } else if (d.service_status == 1) { }}{{ L_('已服务') }}
                        {{# } else if (d.service_status == 2) { }}{{ L_('已评价') }}
                        {{# } }}
                    {{# } else if (d.paid == 1) { }}
                       {{# if (d['payment_status']!=1) { }}
                            <span style="color:green">{{ L_('已支付') }}</span>
                       {{# } else if (d['service_status']<=0 && d['is_initiative']<=0) { }}
                            <span style="color:green">{{ L_('定金已支付') }}</span><span style="color:red">{{ L_('尾款待支付') }}</span>
                       {{# } else if (d['service_status']>0 && d['is_initiative']<=0) { }}
                            <span style="color:red">{{ L_('尾款待支付') }}</span>
                       {{# } else { }}
                            <span color="green">{{ L_('已支付') }}</span>
                       {{# } }}
                        {{# if (d.complete_source == 2) { }}
                            {{# if (d.service_status == 1) { }}{{ L_('已服务') }}
                            {{# } else { }}{{d.appoint_worker_name}}{{ L_('已服务') }}
                            {{# } }}
                        {{# } else if (d.service_status == 0) { }}{{ L_('未服务') }}
                        {{# } else if (d.service_status == 1) { }}{{ L_('已服务') }}
                        {{# } else if (d.service_status == 2) { }}{{ L_('已评价') }}
                        {{# } }}
                    {{# } else if (d.paid == 2) { }}{{ L_('已退款') }}
                    {{# } else if (d.paid == 3) { }}{{ L_('用户已取消') }}
                    {{# } else { }}{{ L_('订单异常') }}
                    {{# } }}
                    </span><br>
                    {{# if (d.worker_name != '') { }}
                    <span class="e93">{{ d.worker_name }} {{  d.appoint_worker_name }} {{ d.worker_phone }}</span><br>
                    <em>{{ d.worker_time }}</em>
                    {{# } }}
                </p>
            </li>
        </ul>
        </script>
        <script id="orderDetail" type="text/html">
        <li class="clr first">
            <div class="fl book">{{ L_('订单信息') }}</div>
            {{# if (d.type == 1) { }}
            <div class="fr payoff">{{ L_('平台分配') }}</div>
            {{# } }}
        </li>
        <li class="clr">
            <div class="fl book">{{ L_('订单编号') }}</div>
            <div class="fr payoff">{{d.order_id}}</div>
        </li>
        <li class="clr">
            <div class="fl">{{ L_('下单时间') }}</div>
            <div class="fr">{{d.order_time}}</div>
        </li>
        <li class="clr">
            <div class="fl">{{ L_('预付订金') }}</div>
            <div class="fr e93">{{ currency_symbol }}{{# if (d.product_id > 0) { }} {{ parseFloat(d.product_payment_price) }} {{# } else { }}{{ parseFloat(d.payment_money) }}{{# } }}</div>
        </li>
        <li class="clr">
            <div class="fl">{{ L_('支付状态') }}</div>
            <div class="fr e93">{{# if (d.paid == 0) { }}{{ L_('未支付') }} {{# } else { }} {{ L_('已支付') }} {{# } }}</div>
        </li>
        <li class="clr">
            <div class="fl">{{ L_('订单总价') }}</div>
            <div class="fr e93">{{ currency_symbol }}{{# if (d.product_id > 0) { }} {{ parseFloat(d.product_price) }} {{# } else { }}{{ parseFloat(d.appoint_price) }}{{# } }}</div>
        </li>
        <li class="clr">
            <div class="fl">{{ L_('尾款支付状态') }}</div>
            <div class="fr e93">{{# if (d.is_initiative > 0) { }} {{ L_('已支付') }} {{# } else { }} {{ L_('未支付') }} {{# } }}</div>
        </li>
        {{# if (parseFloat(d.merchant_balance) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('使用商户余额') }}</div>
            <div class="fr e2c">{{parseFloat(d.merchant_balance)}}</div>
        </li>
        {{# } }}
        {{# if (parseFloat(d.score_deducte) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('订金积分抵扣') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.score_deducte)}}（使用{{parseFloat(d.score_used_count)}}积分）</div>
        </li>
        {{# } }}
        {{# if (parseFloat(d.use_ecard_price) > 0) { }}
        <li class="clr">
            <div class="fl">{{ d.ecard_alias_name }}支付</div>
            <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.use_ecard_price)}}</div>
        </li>
        {{# } }}

        {{# if (d.is_initiative && d.service_status) { }}
            {{# if ((parseFloat(parseFloat(d.balance_pay) + parseFloat(d.product_balance_pay))) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('余额支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(parseFloat(d.balance_pay) + parseFloat(d.product_balance_pay)) }}</div>
            </li>
            {{# } }}
            {{# if (parseFloat(parseFloat(d.product_real_payment_price) + parseFloat(d.product_real_balace_price)) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('实际支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(parseFloat(d.product_real_payment_price) + parseFloat(d.product_real_balace_price)) }}</div>
            </li>
            {{# } }}
        {{# } else if (d.is_initiative && !d.service_status) { }}
            {{# if (parseFloat(d.product_balance_pay) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('余额支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(d.product_balance_pay) }}</div>
            </li>
            {{# } }}
            {{# if (parseFloat(d.product_real_payment_price) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('实际支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(d.product_real_payment_price) }}</div>
            </li>
            {{# } }}
        {{# } else { }}
            {{# if (parseFloat(d.balance_pay) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('余额支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.balance_pay)}}</div>
            </li>
            {{# } }}
            {{# if (parseFloat(d.pay_money)+parseFloat(d.user_pay_money) > 0) { }}
            <li class="clr">
                <div class="fl">{{ L_('实际支付金额') }}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.pay_money)+parseFloat(d.user_pay_money)}}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.pay_money)+parseFloat(d.user_pay_money)}}</div>
                <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.pay_money)+parseFloat(d.user_pay_money)}}</div>
            </li>
            {{# } }}
        {{# } }}
        {{# if (parseFloat(d.product_card_give_money) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('余额商家赠送余额') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(d.product_card_give_money) }}</div>
        </li>
        {{# } }}
        {{# if (d.product_id && d.paid == 1 && d.pay_time > 0 && parseFloat(parseFloat(d.pay_money) + parseFloat(d.balance_pay) + parseFloat(d.score_deducte)) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('实际支付定金') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(parseFloat(d.pay_money) + parseFloat(d.balance_pay) + parseFloat(d.score_deducte)) }}</div>
        </li>
        {{# } }}
        {{# if (d.product_id && d.paid == 1 && d.service_status == 1 && d.is_initiative) { }}
        {{# if (parseFloat(parseFloat(d.user_pay_money) + parseFloat(d.product_balance_pay)) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('实际支付尾款') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(parseFloat(d.user_pay_money) + parseFloat(d.product_balance_pay)) }}</div>
        </li>
        {{# } }}
        <li class="clr">
            {{#if (d.user_pay_time){}}
            <div class="fl">{{ L_('实际支付尾款时间') }}</div>
            <div class="fr e2c">
                {{ d.user_pay_time }}
            </div>
            {{# } else { }}
            <div class="fl">{{ L_('实际支付时间') }}</div>
            <div class="fr e2c">
                {{ d.pay_time }}
            </div>
            {{# } }}
        </li>
        {{# if (parseFloat(d.product_score_deducte) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('实际支付积分金额') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.product_score_deducte)}}（使用{{parseFloat(d.product_score_used_count)}}积分）</div>
        </li>
        {{# } }}
        {{# if (parseFloat(d.product_coupon_price) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('实际支付平台优惠券金额') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{parseFloat(d.product_coupon_price) }}</div>
        </li>
        {{# } }}
        {{# if (parseFloat(d.product_card_price) > 0) { }}
        <li class="clr">
            <div class="fl">{{ L_('实际支付商家优惠券金额') }}</div>
            <div class="fr e2c">-{{ currency_symbol }}{{ parseFloat(d.product_card_price) }}</div>
        </li>
        {{# } }}
        {{# } }}
        {{# if (d.cue_list != '') { }}
            {{# for (var i in d.cue_list) { }}
            <li class="clr">
                <div class="fl">{{ d.cue_list[i].name }}</div>
                <div class="fr e2c">{{# if(d.cue_list[i].type == 2 && d.cue_list[i].address != undefined) { }} {{ L_('地址') }}：{{ d.cue_list[i].address }} {{# } }}{{ d.cue_list[i].value }}</div>
            </li>
        <li class="clr">
            <div class="fl">联系电话:</div>
            <div class="fr e2c">
                {{# if(d.cue_list[i].phone != undefined) { }} {{ d.cue_list[i].phone }} {{# } }}
            </div>
        </li>
            {{# } }}
        {{# } }}
        {{# if (d.service_status == 0 && d.is_del == 0 && d.paid==1 && (!d.refund || !d.refund.id || d.refund.status !=0) ) { }}
            <div class="verification" data-id="{{d.order_id}}">{{ L_('验证服务') }}</div>
        {{# } }}
        </script>   
        
        <!-- 退款信息 -->
        <script id="refundDetail" type="text/html">
            <li class="clr first">
                <div class="fl book">{{ L_('退款信息') }}</div>
            </li>
            <li class="clr">
                <div class="fl">{{ L_('申请时间') }}</div>
                <div class="fr">{{d.apply_date}}</div>
            </li>
            <li class="clr">
                <div class="fl">{{ L_('退款备注') }}</div>
                <div class="fr">{{d.reason}}</div>
            </li>
            <li class="clr">
                <div class="fl">{{ L_('退款金额') }}</div>
                <div class="fr e93">{{d.price}}</div>
            </li>
            {{# if(d.images.length > 0){ }}
            <li class="clr">
                <div class="fl">{{ L_('退款凭证') }} <span style="font-size: 0.6rem;color: #9fa4b9;">（{{ L_('点击可查看大图') }}）</span></div>
                <div class="fr e93">
                    {{# for (var i in d.images) { }}
                        <img class="refund_image" src="{{d.images[i]}}">
                    {{# } }}
                </div>
            </li>
            {{# } }}
            {{# if(d.status == 0){ }}
            <li class="clr">
                <div class="fl">{{ L_('审核备注') }}</div>
                <div class="fr e93"><textarea id="audit_refund_remark" placeholder="请填写退款审核备注" style="border: 1px soid #ddd;"></textarea></div>
            </li>
            <li class="clr">
                <div class="disagree_refund" data-id="{{d.order_id}}">{{ L_('拒绝退款') }}</div>
                <div class="agree_refund" data-id="{{d.order_id}}">{{ L_('同意退款') }}</div>
            </li>
            {{# }else{ }}
                <li class="clr">
                    <div class="fl">{{ L_('审核时间') }}</div>
                    <div class="fr">{{d.reply_date}}</div>
                </li>
                <li class="clr">
                    <div class="fl">{{ L_('审核状态') }}</div>
                    <div class="fr e93">{{d.status_desc}}</div>
                </li>
                <li class="clr">
                    <div class="fl">{{ L_('审核备注') }}</div>
                    <div class="fr e93">{{d.reply_content}}</div>
                </li>
            {{# } }}
        </script>

        <style type="text/css">
            .agree_refund{
                display: inline-block;
                height: 50px;
                line-height: 50px;
                text-align: center;
                font-size: 16px;
                background: #2ecc71;
                width: 48%;
                color: #fff;
                float: right;
                border-radius: 2px;
            }

            .disagree_refund{
                display: inline-block;
                height: 50px;
                line-height: 50px;
                text-align: center;
                font-size: 16px;
                background: #9fa4b9;
                width: 48%;
                color: #fff;
                float: left;
                border-radius: 2px;
            }
            .order_logs{
                position: fixed;
                right: 20px;
                bottom: 20px;
                width: 35px;
                height: 35px;
                background-color: rgba(255, 102, 0, 0.5);
                border-radius: 50%;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
                z-index: 999;
            }
        </style>
    </body>
</html>
