<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>店员中心</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width,viewport-fit=cover"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
		<link href="css/pigcms.css?t=2" rel="stylesheet"/>
        <link href="css/mobiscroll.2.13.2.css" rel="stylesheet"/>
        <style>
            .search-condition .cable {
                position: relative;
                top: 0;
                background-color: #ffffff;
                min-height: 100px;
            }
            .search-condition .cable .cable_n {
                height: auto;
            }
            .search-condition .cable .cable_n .kd_time {
                margin-top: 8px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: none;
            }
            .search-condition .cable .cable_n .kd_time .pos {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .search-condition .cable .cable_n .total-price {
                margin-top: 8px;
                width: 100%;
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: space-between;
                line-height: 1;
            }
            .search-condition .cable .cable_n .total-price .price {
                color: #f3324d;
            }
            .printer{
                width: 1.7rem;float: right;right: 5px;margin-top: 1px;
            }
            .found{
                top: calc(constant(safe-area-inset-top) / 2)!important;
                top: calc(env(safe-area-inset-top) / 2)!important;
            }
        </style>
	</head>
	<body>
		<section class="public pageSliderHide">
			<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
			<div class="content"><L_>店员收银</L_></div>
			<div class="found link-url" data-url="cashier_set.html" data-webview="true"><L_>创建订单</L_></div>
			<div class="census">
                <div class="sus_popup"></div>
                <div class="sus_url">
                    <a href="javascript:void(0)" class="scan search" ><L_>扫码支付</L_></a>
                    <a href="cashier_set.html" class="cashier_set " ><L_>创建订单</L_></a>
                </div>
            </div>
		</section>
        <div class="h44 iosHeader"></div>
        <section class="search-condition">
            <div class="cable pageSliderHide">
				<div class="cable_n">
					<form id="searchForm" method="post">
                        <div>
                            <div class="input">
                                <input type="search" id="keyword" placeholder="请输入搜索内容" />
                            </div>
                            <div class="select">
                                <select id="condition">
                                    <option value="order_id" class="L_">订单号</option>
                                    <option value="phone" class="L_">手机号</option>
                                </select>
                            </div>
                        </div>
					</form>
                    <div class="kd_time">
                        <div class="pos">
                            <input type="text" placeholder="开始时间" readonly="readonly" id="stime" class='datas'/>
                        </div>
                        <div class="pos">
                            <input type="text" placeholder="结束时间" readonly="readonly" id="etime" class='datas'/>
                        </div>
                    </div>
                    <div class="total-price">
                        <L_>总额：</L_>
                        <span class="price">
                            <span id="Currency_symbol"><L_>￥</L_></span>
                            <span id="totalPrice">0.00</span>
                        </span>
                         <L_>退款总额：</L_>
                        <span class="price">
                            <span id="Currency_symbol"><L_>￥</L_></span>
                            <span id="refundTotalPrice">0.00</span>
                        </span>
                    </div>
				</div>
			</div>
        </section>
		<section class="order">
			<div class="discount" id="order_list"><ul></ul></div>
		</section>

		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js"></script>
        <script src="scripts/mobiscroll.2.13.2.js"></script>
		<script src="scripts/work/cashier.js?t=3"></script>
        <script>
            if(common.checkIosApp()){
                $('.order').css({

        </script>
	</body>
</html>
