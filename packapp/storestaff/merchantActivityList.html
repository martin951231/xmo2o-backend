<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>商家活动</title>
    <meta name="viewport"
        content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name='apple-touch-fullscreen' content='yes' />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="address=no" />
    <link rel="stylesheet" href="css/vant@2.12.47.css" />
    <script src="scripts/vue@2.6.14.min.js"></script>
    <script src="scripts/vant@2.12.14.min.js"></script>
    <script src="scripts/jquery-1.8.3.min.js"></script>
    <script src="scripts/layer/layer.m.js"></script>
</head>
<style>
    body {
        background-color: #f5f4f9;
    }

    .box {
        display: flex;
        padding: 10px;
        background-color: #fff;
        margin: 10px;
        border-radius: 6px;
        position: relative;
    }

    .box .top_title {
        position: absolute;
        top: 0;
        z-index: 1;
        font-size: 12px;
        color: #fff;
        border-radius: 2px;
        padding: 0 4px;
        text-align: center;
    }

    .box .left {
        margin-right: 14px;
        display: flex;
        align-items: center;
    }

    .box .left-center {
        position: relative;
    }

    .box .right {}

    .box .right .h4 {
        width: 150px;
        font-size: 15px;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
    }

    .box .right_btn {
        position: absolute;
        right: 10px;
        font-size: 14px;
        color: #1a86f9;
    }

    .box .right .ms {
        margin: 4px 0;
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
    }

    .box .right .time {
        margin: 4px 0;
        font-size: 12px;
        color: #1a86f9;
        overflow: hidden;
    }

    .box .right .hdlist {
        font-size: 12px;
        color: rgb(185, 185, 185);
        margin-top: 6px;
    }

    .selects {
        width: 75px;
        height: 32px;
        border-color: #ebebeb !important;
        outline: none;
        font-size: 12px;
    }

    .active_1 {
        background-color: #fec321;
    }

    .active_2 {
        background-color: #fe4900;
    }

    .active_3 {
        background-color: #25bb0a;
    }

    .active_4 {
        background-color: #b8bfbf;
    }

    .van-nav-bar__title {
        color: #fff;
    }

    .van-nav-bar .van-icon {
        color: #fff;
    }
</style>

<body>
    <div id="app">
        <van-nav-bar z-index="99" @click-left="toBack" :title="L_('商家活动')" style="background-color: #2ecc71;" fixed
            safe-area-inset-top="true" left-arrow>
        </van-nav-bar>
        <div style="padding-top: 46px;">
            <van-sticky :offset-top="46">
                <van-search v-model="value" show-action :placeholder="L_('请输入搜索关键词')" @search="onSearch">
                    <template #action>
                        <div @click="openSecect">
                            <span>{{searchTypeText}}</span>
                            <van-icon name="arrow-down" />
                        </div>
                    </template>
                </van-search>
            </van-sticky>
        </div>
        <van-list v-model="loading" :finished="finished" :finished-text="L_('没有更多了')" @load="onLoad">
            <div class="box-list">
                <div class="box" @click="toMerChantDetail(item)" v-for="item in dataList" :key="item.appoint_id">
                    <div class="right_btn">{{L_('报名查看')}}></div>
                    <div class="left">
                        <div class="left-center">
                            <span v-if="item.activity_status == 1"
                                class="top_title active_1">{{item.activity_status_text}}</span>
                            <span v-if="item.activity_status == 2"
                                class="top_title active_2">{{item.activity_status_text}}</span>
                            <span v-if="item.activity_status == 3"
                                class="top_title active_3">{{item.activity_status_text}}</span>
                            <span v-if="item.activity_status == 4"
                                class="top_title active_4">{{item.activity_status_text}}</span>
                            <span v-if="item.activity_status == 5"
                                class="top_title active_4">{{item.activity_status_text}}</span>
                            <van-image width="90px" height="90px" fit="cover" :src="item.image_small"></van-image>
                        </div>
                    </div>
                    <div class="right">
                        <div class="h4">{{item.title}}</div>
                        <div class="ms">{{item.desc}}</div>
                        <div class="time">
                            <van-icon name="clock-o" size="12px" color="#1a86f9" />
                            <span style="margin-left: 2px;">{{L_('开始时间：') + item.start_time}}</span>
                        </div>
                        <div class="hdlist">{{item.address}}</div>
                    </div>
                </div>
            </div>
        </van-list>
        <van-popup v-model="showPicker" round position="bottom">
            <van-picker show-toolbar :columns="columns" @cancel="showPicker = false" @confirm="onConfirm" />
        </van-popup>
    </div>

    <script src="scripts/common.js"></script>
    <script src="scripts/work/merchantActivityList.js"></script>
</body>

</html>
