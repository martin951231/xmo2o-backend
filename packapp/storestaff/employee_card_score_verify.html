        <section class="public pageSliderHide">

							</div>
						</li>
                        <li class="clr">
                            <div class="fl tit"><L_>备注</L_></div>
                            <div class="m100">
                                <textarea id="remark" placeholder="请输入本单备注"></textarea>
                            </div>
                        </li>
                        

					</ul>
				</div>

		<script >
			$(document).ready(function(){
				var code = urlParam.code;
				console.log(code)
				$('#confirmOrder').click(function(){
				console.log('orderForm')
					var score = parseFloat($('#score').val());
				console.log(score,'score')
					var remark = $('#remark').val();
				console.log(remark,'remark')
					if(isNaN(score)){
						motify.log('请输入积分数量');
						return false;
					}
					var postData = {};
					postData.code = code;
					postData.score = score;
					postData.remark = remark;

				console.log(postData,'postData')
					common.httpV20('/employee/storestaff.EmployeePayCode/deductions',postData , function (data) {
				console.log(data,'data')
		                motify.log('核销成功');
		                setTimeout(function(){
		                	// backHomePage();
		                }, 2000)
			        });
				});
			});

		</script>
