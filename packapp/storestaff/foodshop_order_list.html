<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>店员中心</title>
<meta name="viewport"
	content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width" />
<meta http-equiv="pragma" content="no-cache" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name='apple-touch-fullscreen' content='yes' />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="format-detection" content="telephone=no" />
<meta name="format-detection" content="address=no" /> 
<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
<link href="css/pigcms.css" rel="stylesheet" />

<link rel="stylesheet" type="text/css" href="css/css_whir.css">
<script src="scripts/swiper-3.3.1.jquery.min.js"></script>
<script src="scripts/work/foodshop_calll.js"></script>
<style>
	.elastic .Switch li.on {
	    background: #2ecc71;
	}
	.Resersub input{
	    background: #2ecc71;
	}
	.elastic .swiper-wrapper .on {
	    border-bottom: #2ecc71 1px solid;
	    color: #2ecc71;
	}
</style>
</head>
<body>
	<section class="public">
		<div class="return link-url" data-url-type="openLeftWindow" data-url="back" data-closewebview="true"></div>
		<div class="content"><L_>待确认菜品</L_></div>
		<div class="found"><L_>创建订单</L_></div>
	</section>

	<section class="reserve stay">
		<div class="reserve_tab">
			<form id="searchForm" method="post" action="">
			<!--div class="search">
				<input placeholder="搜索预订人、手机号码" id="find_value">
			</div-->
			  <div class="cable cable_kd">
					<div class="input">
                        <input type="text" id="find_value" name="fv" placeholder="请输入搜索内容" />
                    </div>
					<div class="select" style="right:25px;">
							<select name="ft" id="searchType" style="height:32px">
								<option value="dh"><L_>用户电话</L_></option>
								<option value="xm"><L_>用户姓名</L_></option>
								<option value="zt"><L_>桌台名称</L_></option>
							</select>
					</div>
				</div>
			</form>
		</div>
		<div class="entry">
			<ul></ul>
		</div>
	</section>

	<div class="cease">
		<div class="within">
			<div class="cease_top clr">
				<h2 class="fl"><L_>已点菜品</L_></h2>
				<!--div class="fl notice"><L_>暂未通知上菜</L_></div-->
			</div>
			<div class="surface">
				<ul></ul>
			</div>
			<div class="tol_price clr">
				<div class="fl"><L_>共12份</L_></div>
				<div class="fr price">总计：<span>￥488</span></div>
				<div class="fr go"><L_>去确认</L_></div>
			</div>
		</div>
		<div class="del"></div>
	</div>

	<div class="seek book">
		<div class="within">
			<h2><L_>取消订单</L_></h2>
			<div class="con">
				<div class="img">
					<img src="images/tct_03.jpg">
				</div>
				<div class="tit">
					<p class="on"><L_>重要提示</L_></p>
					<p><L_>确定取消预订之前，请及时联系顾客哦！</L_></p>
				</div>
				<div class="button">
					<div class="clr p20">
						<input type="hidden" id="order_id" />
						<div class="fl close shut"><L_>关闭</L_></div>
						<div class="fr ensure shut"><L_>确定取消</L_></div>
					</div>
				</div>
			</div>
		</div>
		<div class="del shut"></div>
	</div>

	<div class="seek prints">
		<div class="within">
			<h2><L_>打印菜单</L_></h2>
			<div class="con">
				<div class="img">
					<img src="images/tct_04.jpg">
				</div>
				<div class="tit">
					<p>
						打印订单，只会打印订单中的已点菜品。而且只会使用主打印机进行打印，一般适用于用户买单确定，<span class="red"><L_>确定打印？</L_></span>
					</p>
				</div>
				<div class="button">
					<div class="clr p20">
						<div class="fl close shut"><L_>关闭</L_></div>
						<div class="fr ensure shut"><L_>确定打印</L_></div>
					</div>
				</div>
			</div>
		</div>
		<div class="del shut"></div>
	</div>

	<div class="mask"></div>
	<div class="Mask"></div>

	<div class="time_content" style="position: fixed;top: 0;left: 0;bottom: 0;right: 0;background: rgba(0, 0, 0, .6);z-index: 1000;display: none;">
		<section class="elastic" style="height: 667px; overflow: hidden;">
		<div class="swiper-container swiper-container2 swiper-container-horizontal">
			<div class="swiper-wrapper">
			</div>
			<div class="swiper-button-prev"></div> 
			<div class="swiper-button-next"></div> 
		</div>
		<div class="Switch" style="height: 557px;">
		</div>
		<div class="Resersub" style=""><input type="submit" value="确认选择" class=""></div>
		</section>
	</div>

	<script src="scripts/jquery-1.8.3.min.js"></script>
	<script src="scripts/fastclick.js"></script>
	<script src="scripts/layer/layer.m.js"></script>
	<script src="scripts/common.js"></script>
	<script src="scripts/JRoll.js"></script>
	<script src="scripts/weui/weui.min.js"></script>
	<script src="scripts/work/foodshop_create.js"></script>
	<script src="scripts/work/foodshop_order_list.js"></script>
	<script src="scripts/work/storestaffAppoint.js"></script>
	<!--  canc check  -->
	<script id="listTpl" type="text/html">
	{{# for (var i = 0, len = d.length; i < len; i++){ }}
	<li id="li_{{ d[i].order_id }}">
		{{# if(d[i].status == 3 || d[i].status == 4) { }}
		<div class="top check clr">
           {{# if(d[i].account_type == 2) { }}
              <div class="fr cancel quxiao_btn"  data-order_id="{{ d[i].order_id }}" data-account_type="{{ d[i].account_type }}">{{ L_('取消订单') }}</div> 
           {{# } }}
		{{# }else if(d[i].status == 5) { }}
		<div class="top canc clr">
		{{# }else { }}
		<div class="top pitch clr">
		{{# } }}
			<div class="fl">{{ L_('预订时间') }}：{{ d[i].book_time_packapp }}</div>
			{{# if(d[i].status < 2 && status != 2) { }}
			<div class="fr cancel" data-order_id="{{ d[i].order_id }}">{{ L_('取消订单') }}</div>
			{{# } }}
		</div>
		<div class="con">
			<div class="con_top">
				<h2>{{ L_('预订人') }}：{{ d[i].name }} {{ d[i].phone }}</h2>
				{{# if(d[i].fetch_number>0) { }}
					<p>
						{{ L_('取单号') }}：<span class="red">{{ d[i].fetch_number }}</span>
					</p>
				{{# } }} 
				<p>
					{{ L_('已付定金') }}：<span class="red">{{ currency_symbol }}{{ d[i].book_price }}</span>
				</p>
				{{# if(d[i].table_type_name || d[i].table_name || d[i].min_max){ }}
					<p>{{ L_('预定餐位') }}：{{ d[i].table_type_name }} {{ d[i].table_name }} {{ d[i].min_max }}</p>
				{{# } }} 
				{{# if(d[i].book_num > 0) { }}
					<p>{{ L_('就餐人数') }}：{{ d[i].book_num }}</p>
				{{# } }}
				<p>{{ L_('下单时间') }}：{{ d[i].date }}</p>
				{{# if (d[i].order_from == 0) { }}
				<p>{{ L_('订单来源：在线预订') }}</p>
				{{# } else if (d[i].order_from == 1) { }}
				<p>{{ L_('订单来源：扫桌台码预订') }}</p>
				{{# } else if (d[i].order_from == 2) { }}
				<p>{{ L_('订单来源：店员下单') }}</p>
				{{# } }}
				{{# if (d[i].pay_time > 0) { }}
				<p>{{ L_('支付时间') }}：{{ d[i].pay_time_str }}</p>
				{{# } }}
				{{# if(d[i].status==5) { }}
					<p>
						{{ L_('取消时间') }}：{{ d[i].cancel_date }}
					</p>
					<p>
						{{ L_('取消原因') }}：{{ d[i].cancel_reason }}
					</p>
				{{# } }} 
			</div>
			<div class="remark">
				<span class="fl">{{ L_('备注') }}：</span>
				<div class="p30 ">{{ d[i].note }}</div>
			</div>
		</div>
		{{# if (d[i].info != null || d[i].info_temp != null) { }}
		<div class="already">
			<div class="pro">
				<h2>{{ L_('已点菜品') }}： <span class="print_menu" data-order_id="{{ d[i].order_id }}" style="display: none;">{{ L_('补打后厨单') }}</span></h2>
				<div class="pro_list">
					<dl>
						{{# var cnt = 0, totalPrice = d[i].totalPrice, loop_cnt = 1, is_sure = 0; }}
						{{# if (d[i].info_temp != null) { }}
						{{# for (var ii = 0, lenI = d[i].info_temp.length; ii < lenI; ii++){ }}
						{{# if (loop_cnt < 3) { }}
						{{# is_sure = 1; }}
						<dd>
							<span class="w4">{{ d[i].info_temp[ii].name }}</span>
							<span class="w1"><em class="stay">{{ L_('待确认') }}</em></span>
							<span class="w2">x{{ d[i].info_temp[ii].num }}</span>
							<span class="w3">{{ currency_symbol }}{{ d[i].info_temp[ii].price }}</span>
						</dd>
						{{# } }}
						{{# loop_cnt ++; }}
						{{# cnt += d[i].info_temp[ii].num; }}
							{{# if(d[i].info_temp[ii].fid == 0){ }}
								{{# totalPrice += d[i].info_temp[ii].num * d[i].info_temp[ii].price; }}
							{{# } }}
						{{# } }}
						{{# } }}
                        {{# if (d[i].info != null) { }}
                        {{# for (var ii = 0, lenI = d[i].info.length; ii < lenI; ii++){ }}
                        {{# if (loop_cnt < 3) { }}
                        <dd>
                            <span class="w4">{{ d[i].info[ii].name }}</span>
                            <span class="w1"><em class="end">{{ L_('已确认') }}</em></span>
                            <span class="w2">x{{ d[i].info[ii].num }}</span>
                            <span class="w3">{{ currency_symbol }}{{ d[i].info[ii].price }}</span>
                        </dd>
                        {{# } }}
                        {{# loop_cnt ++; }}
                        {{# cnt += d[i].info[ii].num; }}
                        {{# } }}
                        {{# } }}
					</dl>
					{{# if (loop_cnt > 2) { }}
						{{# if(d[i].status != 5){ }}
							<div class="more" data-order_id="{{ d[i].order_id }}"></div>
						{{# } }}
					{{# } else if (is_sure == 1) { }}
						{{# if(d[i].status != 5){ }}
							<a class="go" href="foodshop_menu.html?order_id={{ d[i].order_id }}&isShow=1">{{ L_('去确认') }}</a>
						{{# } }}
					{{# } }}
				</div>
				<div class="total clr">
					<div class="fl">共{{ cnt }}份</div>
					<div class="fr">
						{{ L_('总计') }}：<span class="price">{{ currency_symbol }}{{totalPrice.toFixed(2)}}</span>
					</div>
				</div>
				{{# if(d[i].status == 3 || d[i].status == 4) { }}
				<div class="totals clr">
					<div class="fl">{{ d[i].pay_type }}</div>
					<div class="fr">{{ L_('实付金额') }}：<span class="price">{{ currency_symbol }}{{ d[i].price }}</span></div>
				</div>
				{{# } }}
			</div>
		</div>
        {{# } }}
		{{# if(d[i].status < 3) { }} 
		<div class="click">
			<dl>
				<dd class="food link-url" data-url="foodshop_menu.html?order_id={{ d[i].order_id }}&isShow=0">
					<span>{{ L_('点菜') }}</span>
				</dd>
				<dd class="edit" data-order_id="{{ d[i].order_id }}">
					<span>{{ L_('编辑订单') }}</span>
				</dd>
				<dd class="print" data-order_id="{{ d[i].order_id }}">
					<span>{{ L_('打印菜单') }}</span>
				</dd>
				<dd class="sett" data-url="cashier_set.html?business_type=foodshop&business_id={{ d[i].order_id }}">
					<span>{{ L_('结算') }}</span>
				</dd>
			</dl>
		</div>
		{{# } else { }}
			
		<div class="click">
			<dl>
				<dd class="print" data-order_id="{{ d[i].order_id }}">
					<span>{{ L_('打印菜单') }}</span>
				</dd>
			</dl>
		</div>
		{{# } }}
	</li>
	{{# } }}
	</script>
	
	<script id="orderDetailTpl" type="text/html">
	{{# if(d.package_list != null) { }} 
	{{# for (var i in d.package_list){ }}
	<li>
		<div class="flex">
			<div class="w5">
				<h2>{{d.package_list[i].name}}</h2>
			</div>
			<div class="w1">
				<em class="end">{{ L_('已确认') }}</em>
			</div>
			<div class="w3">x{{d.package_list[i].num}}</div>
			<div class="w4">{{ currency_symbol }}{{d.package_list[i].price}}</div>
		</div>
		<div class="sheath">
			<dl>
				{{# for (var ii in d.package_list[i].list){ }}
				<dd>
					<div class="w5">{{d.package_list[i].list[ii].name}}</div>
					<div class="w1"></div>
					<div class="w3">x{{d.package_list[i].list[ii].num}}</div>
					<div class="w4">{{ currency_symbol }}{{d.package_list[i].list[ii].price}}</div>
				</dd>
				{{# } }}
			</dl>
		</div>
	</li>
	{{# } }}
	{{# } }}
	{{# if(d.goods_list != null) { }} 
	{{# for (var i = 0, len = d.goods_list.length; i < len; i++){ }}
	<li>
		<div class="flex">
			<div class="w5">
				<h2>{{d.goods_list[i].name}}</h2>
				{{# if (d.goods_list[i].spec != null) { }}
				<p>{{d.goods_list[i].spec}}</p>
				{{# } }}
			</div>
			<div class="w1">
				<em class="end">{{ L_('已确认') }}</em>
			</div>
			<div class="w3">x{{d.goods_list[i].num}}</div>
			<div class="w4">{{ currency_symbol }}{{d.goods_list[i].price}}</div>
		</div>
	</li>
	{{# } }}
	{{# } }}
	{{# if(d.temp_list != null) { }} 
	{{# for (var i = 0, len = d.temp_list.length; i < len; i++){ }}
	<li>
		<div class="flex">
			<div class="w5">
				<h2>{{d.temp_list[i].name}}</h2>
				{{# if (d.temp_list[i].spec != null) { }}
				<p>{{d.temp_list[i].spec}}</p>
				{{# } }}
			</div>
			<div class="w1">
				<em class="stay">{{ L_('待确认') }}</em>
			</div>
			<div class="w3">x{{d.temp_list[i].num}}</div>
			<div class="w4">{{ currency_symbol }}{{d.temp_list[i].price}}</div>
		</div>
	</li>
	{{# } }}
	{{# } }}
	</script>
</body>
</html>
