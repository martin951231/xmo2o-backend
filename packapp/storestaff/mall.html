<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8"/>
        <title>店员中心</title>
        <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
        <meta http-equiv="pragma" content="no-cache"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta name='apple-touch-fullscreen' content='yes'/>
        <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
        <meta name="format-detection" content="telephone=no"/>
        <meta name="format-detection" content="address=no"/>
        <link href="css/pigcms.css?t=1" rel="stylesheet"/>
        <link href="css/mobiscroll.2.13.2.css" rel="stylesheet"/>
    </head>    
    <body>
        <section class="public pageSliderHide">
            <div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
            <div class="content"><L_>商城订单</L_></div>
            <div class="census" style="display:block;">
                <div class="sus_popup"></div>
                <div class="sus_url">
                    <a href="#" class="retail" data-webview="true"><L_>线下零售</L_></a>
                    <a href="statistics.html?shop_type=2" class="statistics" data-webview="true"><L_>商品销售统计</L_></a>
                </div>
            </div>
        </section>
        <div class="h44"></div>
        <div class="remind" style="display:none">您有部分商品库存小于10，请<span class="rem_see"><L_>点击查看！</L_></span><div class="del"></div></div>
        <section class="h130">
            <div class="cable">
                <form id="searchForm" method="post">
					<div class="cable_n cable_kd">
						<div class="input">
							<input type="search" id="find_value" placeholder="请输入搜索内容"/>
						</div>
						<div class="select">
							<select id="ft" name="ft">
								<option value="oid" class="L_">订单号</option>
								<option value="xm" class="L_">下单人姓名</option>
								<option value="dh" class="L_">手机号</option>
								<option value="mps" class="L_">流水号</option>
								
							</select>
						</div>
					</div>
                </form>
            </div>
            
            <div class="fix">
                <div class="dropdown">
                    <div class="drop_select">
                        <div class="pos status"><select name="st"><option value="-2"><L_>订单状态</L_></option></select></div>
                    </div>
                    <div class="drop_select">
                        <div class="pos pay_type"><select name="pay_type"><option value="-2"><L_>支付方式</L_></option></select></div>
                    </div>
                </div>
                <div class="kd_time clr">
                    <div class="pos fl">
                        <input type="text" placeholder="开始时间" readonly="readonly" id="stime" class='datas'/>
                    </div>
                    <div class="pos fr">
                        <input type="text" placeholder="结束时间" readonly="readonly" id="etime" class='datas'/>
                    </div>
                </div>
            </div>
        </section>
        <section class="store">
            <div class="entry kd_entry"><ul></ul></div>
        </section>

        <section class="amend">
            <div class="alter">
                <h2><L_>修改金额</L_></h2>
                <div class="del"></div>
            </div>
            <div class="correct">
                <ul>
                    <li class="clr">
                        <div class="fl"><L_>修改金额</L_></div>
                        <div class="fr">
                            <input type="number" placeholder="请输入修改金额" id="change_price"/>
                            <input type="hidden" id="order_id" />
                        </div>
                    </li>
                    <li class="clr">
                        <div class="fl"><L_>备注</L_></div>
                        <div class="fr">
                            <input type="text" placeholder="请输入您修改的理由" id="change_price_reason"/>
                        </div>
                    </li>
                    <li class="clr">
                        <div class="fl"><L_>当前值</L_></div>
                        <div class="fr e93" id="now_price"></div>
                    </li>
                </ul>
                <div class="clr button">
                    <div class="fl recovery" data-type="r"><L_>恢复初始价格</L_></div>
                    <div class="fr ensure" data-type="c"><L_>确定修改</L_></div>
                </div>
            </div>
        </section>
        <div class="mask"></div>

        <section class="since"></section>

        <section class="stock"></section>
        <div class="flat roof"></div>
    <script src="scripts/jquery-1.8.3.min.js"></script>
    <script src="scripts/fastclick.js"></script>
    <script src="scripts/layer/layer.m.js"></script>
    <script src="scripts/common.js"></script>
    <!-- <script src="scripts/iscroll.js"></script> -->
    <script src="scripts/mobiscroll.2.13.2.js"></script>
    <script src="scripts/work/shop_order_list.js?t=2"></script>
    <script type="text/javascript">
        console.log(shop_type);
        shop_type=2; 
    </script>
    <!--  canc check  -->
        <script id="pcikTpl" type="text/html">
        <div class="h2">{{ L_('分配自提点') }}</div>
        <div class="ul">
            <ul>
                {{# for (var i in d.pick_list) { }}
                <li data-id="{{d.pick_list[i].pick_addr_id}}">
                    <div class="tit">{{d.pick_list[i].area_info.province}} {{d.pick_list[i].area_info.city}} {{d.pick_list[i].area_info.area}}</div>
                    <div class="p">{{d.pick_list[i].name}} [tel:{{d.pick_list[i].phone}}]</div>
                    <div class="range">{{ L_('距离') }}：{{d.pick_list[i].range}}</div>
                </li>
                {{# } }}
            </ul>
        </div>
        <div class="submit">
            <div class="determine" data-id="{{d.order_id}}">{{ L_('确定') }}</div>
        </div>
        <div class="del"></div>
        </script>
        <script id="expressTpl" type="text/html">
        <div class="peak def">
            <h2>{{ L_('快递信息') }}</h2>
        </div>
        <div class="con">
            <ul>
                <li>
                    <span class="fl">{{ L_('收货地址') }}：</span>
                    <div class="p70">{{d.address}}
                        <p>{{ L_('配送距离') }}：{{d.distance}}km</p>
                    </div>
                </li>
            </ul>
            <ul>
                <li class="indek_li">
                    <div class="indek">
                        <select id="express_id">
                            {{# for (var i in d.express_list) { }}
                            <option value="{{d.express_list[i].id}}" {{# if (d.express_list[i].id == d.express_id) { }}selected{{# } }}>{{d.express_list[i].name}}</option>
                            {{# } }}
                        </select>
                    </div>
                    <input class="inpt_dk" placeholder="请输入快递单号" id="express_number" value="{{d.express_number}}"/>
               </li>
            </ul>
            <div class="sub def express_save" data-id="{{d.order_id}}">{{ L_('保存') }}</div>
        </div>
        <div class="del"></div>
        </script>
        <script id="stockTpl" type="text/html">
        <div class="h2">{{ L_('库存报警商品列表') }}（{{d.count}}）</div>
        <div class="ul">
            <ul>
                {{# for (var i in d.goods_list) { }}
				<li>
					<div class="tit">
					     <span class="fl">{{ L_('商品条形码') }}：</span>
					     <div class="p65">{{# if (d.goods_list[i].number == '') { }}&nbsp{{# } else { }}{{d.goods_list[i].number}}{{# } }}</div>
					</div>
					<div class="bot">
					     <div class="name">
					         <span class="fl">{{ L_('商品名称') }}：</span>
					         <div class="p65">{{d.goods_list[i].name}}</div>
					     </div>
					     <div class="name">
					         <span class="fl">{{ L_('商品价格') }}：</span>
					         <div class="p65 clr">
					             <div class="fl f86">{{ currency_symbol }}{{d.goods_list[i].price}}</div>
					             <div class="fr f86">{{ L_('剩余库存') }}：{{d.goods_list[i].stock_num}}</div>
					         </div>
					     </div>
					</div>
				</li>
				{{# } }}
            </ul>
        </div>
        <div class="del"></div>
        <div class="report">
            <span>{{ L_('如需导出报表，请到电脑版店员中心操作') }}</span>
        </div>
        </script>
