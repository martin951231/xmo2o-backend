<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>店员中心</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
		<link href="css/pigcms.css" rel="stylesheet"/>
        <style>
			.fixedAgreement {
				position: fixed;
				width: 100%;
				bottom: 40px;
				text-align: center;
				font-size: 14px;
				color: #289ffd;
				display: none;
			}
            .p_ban{
                position: fixed;
                bottom: 10px;
                left: 0;
                display: block;
                width: 100%;
                text-align:center;
                color: #666;
            }
			.changeVolume .fr{
			    border: 1px solid #ccc;
			}
			.changeVolume .btn{
				display: inline-block;
				width: 30px;
				text-align: center;
				height: 24px;
				line-height: 24px;
			}
			.changeVolume .btn.num{
				width:50px;
				font-size: 12px;
				border-left: 1px solid #ccc;
				border-right: 1px solid #ccc;
			}
			.changeVolume{
			    line-height: 24px;
			}
        </style>
	</head>
	<body>
		<section id="fixed_top">
			<section class="public pageSliderHide">
				<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
				<div class="content"><L_>设置</L_></div>
				<em class="now_lang" id="now_lang">简体中文</em>
			</section>		
			<div class="h44"></div>
        </section>
		<div class="boat clr openid" style="display:none;">
			<div class="fl"><L_>绑定微信</L_></div>
			<div class="fr enquire"></div>
		</div>
		<div class="boat clr notice">
			<div class="fl"><L_>接收新订单通知</L_></div>
			<div class="fr enquire"></div>
		</div>
        <div class="boat clr changePwd">
        	<div class="fl"><L_>修改密码</L_></div>
        	<div class="fr enquire"></div>
        </div>
		<div class="boat clr contactPhone">
        	<div class="fl"><L_>联系客服</L_></div>
        	<div class="fr enquire"></div>
        </div>
		<div class="boat clr cancellation">
        	<div class="fl"><L_>注销账号</L_></div>
        	<div class="fr">
				<div class="fr enquire"></div>
			</div>
        </div>
		<div class="boat clr changeVolume" style="display:none;">
        	<div class="fl"><L_>调整设备音量</L_></div>
        	<div class="fr">
				<div class="btn min">-</div><div class="btn num"></div><div class="btn plus">+</div>
			</div>
        </div>
		<div class="boat clr checkVersion" style="display:none;">
        	<div class="fl"><L_>检测新版本</L_></div>
        	<div class="fr">
				<div class="fr enquire"></div>
			</div>
        </div>
		<!--<div class="boat clr cache">
			<div class="fl"><L_>清空缓存</L_></div>
			<div class="fr enquire"></div>
		</div>-->
		<div class="logout" id="logout"><L_>退出登录</L_></div>
		
		<!-- 协议和隐私 -->
	    <div class="fixedAgreement"> 
			<span id="goUserAgreement"><L_>用户协议</L_></span>
			<span style="margin: 0 5px;color: #999999">|</span>
			<span id="goAgreement">隐私政策</span>
		</div> 
        <!-- 版本号 -->
          <p class="p_ban"> </p>
        <!-- 版本号 end -->
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js"></script>
		<script src="scripts/work/setting.js?t=8.1.51"></script>
	</body>
</html>
