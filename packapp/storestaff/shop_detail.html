    <body>
        <section class="public">
            <div class="return link-url" data-url-type="openLeftWindow" data-url="back" data-closewebview="true"></div>
            <div class="content"><L_>订单详情</L_></div>
        </section>
        <section class="defrayal" style="top: 44px;">
            <div class="defrayal_n">
            </div>
        </section>
        <section class="g_details p40"></section>
        <section class="amend">
            <div class="alter">
                <h2><L_>修改金额</L_></h2>
                <div class="del"></div>
            </div>
            <div class="correct">
                <ul>
                    <li class="clr">
                        <div class="fl"><L_>修改金额</L_></div>
                        <div class="fr">
                            <input type="number" placeholder="请输入修改金额" id="change_price"/>
                            <input type="hidden" id="order_id" />
                        </div>
                    </li>
                    <li class="clr">
                        <div class="fl"><L_>备注</L_></div>
                        <div class="fr">
                            <input type="text" placeholder="请输入您修改的理由" id="change_price_reason"/>
                        </div>
                    </li>
                    <li class="clr">
                        <div class="fl"><L_>当前值</L_></div>
                        <div class="fr e93" id="now_price">56.66</div>
                    </li>
                </ul>
                <div class="clr button">
                    <div class="fl recovery section_recovery" data-type="r"><L_>恢复初始价格</L_></div>
                    <div class="fr ensure section_ensure" data-type="c"><L_>确定修改</L_></div>
                </div>
            </div>
        </section>
        <div class="mask"></div>

        <!--div class="coping">
            <ul>
                <li class="top">
                    <span><L_>顶部</L_></span>
                </li>

            </ul>
        </div-->

        <div class="seek">
            <div class="within">
                <h2><L_>确认消费</L_></h2>
                <div class="con">
                    <div class="img">
                        <img src="images/tct_05.jpg">   
                    </div>
                    <div class="tit">
                        <p class="on"><L_>重要提示</L_></p>
                        <p><L_>确认消费后，订单将设为已消费且不能恢复，请确认用户收货后再操作！</L_></p>
                    </div>
                    <div class="button">
                        <div class="clr p20">
                            <div class="fl close div_close"><L_>点错了</L_></div>
                            <div class="fr ensure div_ensure" ><L_>确定消费</L_></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="del"></div>
        </div>
        <div class="cancel_confirm" style="display: none;">
            <div class="within">
                <h2><L_>确认取消</L_></h2>
                <div class="con">
                    <div class="img">
                        <img src="images/tct_05.jpg">   
                    </div>
                    <div class="tit">
                        <p class="on"><L_>重要提示</L_></p>
                        <p><L_>取消订单后，将退款给用户，操作后不可恢复</L_></p>
                    </div>
                    <div class="button">
                        <div class="clr p20">
                            <div class="fl close div_close"><L_>点错了</L_></div>
                            <div class="fr ensure div_cancel" ><L_>确定取消</L_></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="del"></div>
        </div>
        <section class="since"></section>
        <div class="flat roof"></div>
        <div class="weidht_goods" style="max-height: 70%;overflow-y: auto"></div>

        <script src="scripts/fastclick.js"></script>
        <script src="scripts/layer/layer.m.js"></script>
        <script src="scripts/common.js"></script>
        <script src="scripts/mobiscroll.2.13.2.js"></script>

        <script id="pcikTpl" type="text/html">
			<div class="h2">{{ L_('分配自提点') }}</div>
			<div class="ul">
				<ul>
					{{# for (var i in d.pick_list) { }}
					<li data-id="{{d.pick_list[i].pick_addr_id}}">
						<div class="tit">{{d.pick_list[i].area_info.province}} {{d.pick_list[i].area_info.city}} {{d.pick_list[i].area_info.area}}</div>
						<div class="p">{{d.pick_list[i].name}} [tel:{{d.pick_list[i].phone}}]</div>
						<div class="range">{{ L_('距离') }}：{{d.pick_list[i].range}}</div>
					</li>
					{{# } }}
				</ul>
			</div>
			<div class="submit">
				<div class="determine" data-id="{{d.order_id}}">{{ L_('确定') }}</div>
			</div>
			<div class="del"></div>
        </script>
        <script id="expressTpl" type="text/html">
			<div class="peak def">
				<h2>{{ L_('快递信息') }}</h2>
			</div>
			<div class="con">
				<ul>
					<li>
						<span class="fl">{{ L_('收货地址') }}<L_>：</L_></span>
						<div class="p70">{{d.address}}
							<p>{{ L_('配送距离') }}：{{d.distance}}km</p>
						</div>
					</li>
				</ul>
				<ul>
					<li class="indek_li">
						<div class="indek">
							<select id="express_id">
								{{# for (var i in d.express_list) { }}
								<option value="{{d.express_list[i].id}}" {{# if (d.express_list[i].id == d.express_id) { }}selected{{# } }}>{{d.express_list[i].name}}</option>
								{{# } }}
							</select>
						</div>
						<input class="inpt_dk" placeholder="请输入快递单号" id="express_number" value="{{d.express_number}}"/>
				   </li>
				</ul>
				<div class="sub def express_save" data-id="{{d.order_id}}">{{ L_('保存') }}</div>
			</div>
			<div class="del"></div>
        </script>
        <script id="deliverTpl" type="text/html">
			<div class="peak">
				{{# if (d.deliver_type == 0 || d.deliver_type ==3) { }}
				<h2>{{ d.deliverName }}</h2>
				{{# } else { }}
				<h2>{{ L_('商家配送') }}</h2>
				{{# } }}
				<p>{{ L_('注意：修改后超出快递费的金额由商家承担！') }}</p>
			</div>
			<div class="con">
				<ul>
					<li>{{ L_('快递配送费') }}：<em>{{ currency_symbol }}{{d.freight_charge}}</em></li>
					<li>{{ L_('配送方式更改为') }}：{{# if (d.deliver_type == 0 || d.deliver_type ==3) { }}<em>{{ d.deliverName }}</em>{{# } else { }}<em>{{ L_('商家配送') }}</em>{{# } }}</li>
					<li>
						<span class="fl">{{ L_('收货地址') }}<L_>：</L_></span>
						<div class="p70">{{d.address}}
							<p>{{ L_('配送距离') }}：{{d.distance}}km</p>
						</div>
					</li>
				</ul>
				<ul>
					<li>[{{d.time_select_1}}]的配送费：<em>{{ currency_symbol }}{{d.delivery_fee}}</em></li>
					{{# if (d.time_select_2 != 0) { }}
					<li>[{{d.time_select_2}}]的配送费：<em>{{ currency_symbol }}{{d.delivery_fee2}}</em></li>
					{{# } }}
					<li class="estimate">{{ L_('预计送达时间') }}：<input readonly="readonly" id="demo" placeholder="请选择送达时间" value="{{d.arrive_datetime}}"/></li>
				</ul>
				<div class="sub deliver_save" data-id="{{d.order_id}}">{{ L_('保存') }}</div>
			</div>
			<div class="del"></div>
        </script>
