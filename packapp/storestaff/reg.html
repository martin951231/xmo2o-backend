<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>店员注册</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
        <link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/pigcms.css" rel="stylesheet"/>
	</head>
	<body style="background: url(images/dlbj_03.jpg) center no-repeat #2ecc71; background-size: 100% 100%;">
		<section class="signin">
			<div class="land_pos">
				<div class="land">
					<div class="logo">
						<img src="images/logo.png"/>
					</div>
					<div class="clerk">
						<div class="clr clerk_input">
							<div class="fl pos number"></div>
							<div class="input">
								<input type="text" placeholder="请输入您的手机号" id="account" autocomplete="off"/>
							</div>
						</div>
						<div class="clr clerk_input">
							<div class="fl pos password"></div>
							<div class="input">
								<input type="password" placeholder="请输入您的密码" id="passwd" autocomplete="off"/>
							</div>
						</div>
					</div>
					<div class="reg_btn"><L_>立即注册</L_></div>
				</div>
			</div>
			 <style>
               .fixedAgreement{
                position: absolute;
                bottom: 20px;
                text-align: center;
                width: 100%;
                left: 0; 
                display: none;
                z-index: 0;
            }
            .fixedAgreement #goAgreement{
                color:red;
                display: inline-block;
                border:none; 
                margin: 0;
                border: none;  
                border-radius: 0px; 
                font-size: 14px;
                width: auto;
            }
            .mark{
                width: 100%;
                height: 100%;
                position: fixed;
                left: 0;
                top:0;
                z-index: 999;
                display: none;
                background-color: rgba(0,0,0,0.7);
            }
            .noAgree{
                width: 70%;
                padding: 10px;
                margin: 60% auto;
                text-align: center;
                background: #fff;
                border-radius: 4px;
                padding: 20px 0 0 0;
            }
            .textP{
                padding: 10px 0;
            }
            .seen{
                color: #1b9dff;
                background: #fff;
                font-size: 16px;
                padding: 20px 0;
            }
            .signin .reg_btn{ background: #14f573; line-height: 45px;  text-align: center; color: #fff; border-radius: 50px;  margin: 55px 0 20px 0; font-size: 16px; }
             </style>
		</section>
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/common.js"></script>
        <script src="scripts/weui/weui.min.js"></script>
		<script src="scripts/work/login.js?t=49"></script>
		<!-- android=appbackmonitor -->
	</body>
</html>
