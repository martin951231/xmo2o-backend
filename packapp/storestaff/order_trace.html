<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <title>店员中心</title>
    <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width,viewport-fit=cover" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name='apple-touch-fullscreen' content='yes' />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="address=no" />
    <link href="css/pigcms.css?t=1" rel="stylesheet" />
    <link href="css/mobiscroll.2.13.2.css" rel="stylesheet" />
    <link href="scripts/weui/weui.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/vant@2.12.47.css" />
</head>

<body>
    <section class="public">
        <div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
        <div class="content">
            <L_>服务轨迹</L_>
        </div>
    </section>
    <div class="nav-height"></div>
    <div id="app">
        <van-steps direction="vertical" v-if="order_trace.length > 0" :active="0">
            <van-step v-for="(item,index) in order_trace" :key="index">
                <div style="display: flex;justify-content: space-between;">
                    <h3>{{item.title}}</h3>
                    <p>{{item.create_time}}</p>
                </div>
                <div v-if="item.content">
                    <div v-for="(item1,index1) in item.content" :key="index1">
                        <div v-if="item1 && item1.type == 'image'">
                            <div>{{item1.title}}:</div>
                            <van-image v-for="(item2,index2) in item1.value" @click="imagePreview(item2)" :key="index2"
                                width="100" height="100" :src="item2" style="margin-right: 5px"></van-image>
                        </div>
                        <div v-else style="margin-bottom: 5px;">
                            <span>{{item1.title}}:</span>
                            <span>{{item1.value}}</span>
                        </div>
                    </div>
                </div>
            </van-step>
        </van-steps>
        <p v-else>暂无记录</p>
    </div>
</body>
<script src="scripts/layer/layer.m.js"></script>
<script src="scripts/jquery-1.8.3.min.js"></script>
<script src="scripts/common.js"></script>

<script src="scripts/vue@2.6.14.min.js" type="text/javascript" charset="utf-8"></script>
<script src="scripts/vant@2.12.14.min.js" type="text/javascript" charset="utf-8"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            order_trace: []
        },
        created() {
            this.getTrace();
        },
        methods: {
            getTrace() {
                let that = this
                common.http('Storestaff&a=order_trace', { 'order_id': urlParam.order_id }, function (res) {
                    that.order_trace = res;
                });
            },
            imagePreview(item2) {
                vant.ImagePreview({
                    images: [item2],
                    startPosition: 0,
                    closeable: true,
                });
            }
        }
    })
</script>

</html>
