        <style>
            .none{display:none}
            .order_list .goods-item:last-child {
                margin-bottom: 0;
            }
            .fr {
                float: right;
                display: inline;
            }
            .color_3 {
                color: #333 !important;
            }
            .font_size14 {
                font-size: 14px !important;
            }
            .font_size16 {
                font-size: 16px !important;
            }
            .color_9 {
                color: #999;
            }
            .font_size12 {
                font-size: 12px !important;
            }
            .menu_list .goods-item strong {
                display: block;
                font-size: 20px;
                color: #ff510c;
                margin-bottom: 6px;
                white-space: nowrap;
            }
            .menu_list .goods-item {
                display: table;
                width: 100%;
                padding: 0 6px;
                border-width: 0 0 1px;
                -webkit-box-sizing: border-box;
            }
            .order_list .goods-item {
                background: #f8f8f8;
                margin-bottom: 10px;
                padding: 10px;
            }
            .order_list .goods-item>div:first-child {
                width: 95px;
                padding-right: 10px;
            }
            .order_list .goods-item>div {
                padding: 0;
            }
            .menu_list .goods-item > div {
                display: table-cell;
                padding: 10px 4px;
                vertical-align: middle;
            }
            .order_list .goods-item>div:first-child img {
                border-radius: 0;
                width: 85px;
                height: 85px;
            }
            .menu_list .goods-item > div {
                display: table-cell;
                padding: 10px 4px;
                vertical-align: middle;
            }
            .order_list .goods-item>div {
                padding: 0;
            }
            .order_list .goods-item>div:last-child {
                vertical-align: top;
                position: relative;
                height: 85px;
            }
            .order_list .goods-item>div:last-child>h3 {
                line-height: 1.4;
                font-size: 12px;
            }

            .menu_list .goods-item h3 {
                font-weight: normal;
                line-height: 1.8;
                overflow: hidden;
            }
            .ellipsis {
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
            }
            .order_list .count {
                display: none;
            }
            .order_list .goods-item>div:last-child strong {
                position: absolute;
                bottom: 0;
                left: 0;
                margin-bottom: 0;
                width: 100%;
                display: block;

                white-space: nowrap;
            }
            .seckill_tag {
                background: #ff510c;
                color: #fff;
                font-size: 12px;
                padding: 4px 5px;
                border-radius: 2px;
            }
        </style>
    </head>

        <script id="pcikTpl" type="text/html">
			<div class="h2">{{ L_('分配自提点') }}</div>
			<div class="ul">
				<ul>
					{{# for (var i in d.pick_list) { }}
					<li data-id="{{d.pick_list[i].pick_addr_id}}">
						<div class="tit">{{d.pick_list[i].area_info.province}} {{d.pick_list[i].area_info.city}} {{d.pick_list[i].area_info.area}}</div>

        <script id="expressTpl" type="text/html">
			<div class="peak def">
				<h2>{{ L_('快递信息') }}</h2>
			</div>
			<div class="con">
				<ul>
					<li>
						<span class="fl">{{ L_('收货地址') }}<L_>：</L_></span>
						<div class="p70">{{d.address}}
							<p>{{ L_('配送距离') }}：{{d.distance}}km</p>
						</div>
					</li>
				</ul>
				<ul>
					<li class="indek_li">
						<div class="indek">
							<select id="express_id">
								{{# for (var i in d.express_list) { }}
								<option value="{{d.express_list[i].id}}" {{# if (d.express_list[i].id == d.express_id) { }}selected{{# } }}>{{d.express_list[i].name}}</option>
								{{# } }}
							</select>
						</div>

				   </li>
				</ul>
				<div class="sub def express_save" data-id="{{d.order_id}}">{{ L_('保存') }}</div>
			</div>
			<div class="del"></div>
        </script>
        <script id="deliverTpl" type="text/html">
