<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>店员中心</title>
<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width" />
<meta http-equiv="pragma" content="no-cache" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name='apple-touch-fullscreen' content='yes' />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="format-detection" content="telephone=no" />
<meta name="format-detection" content="address=no" />
<link href="css/pigcms.css" rel="stylesheet" />
<link rel="stylesheet" type="text/css" href="css/css_whir.css">
<style>
	.elastic .Switch li.on {
	    background: #2ecc71;
	}
	.Resersub input{
	    background: #2ecc71;
	}
	.elastic .swiper-wrapper .on {
	    border-bottom: #2ecc71 1px solid;
	    color: #2ecc71;
	}
</style>
</head>
<body style="background: #2ecc71">
	<section class="public pageSliderHide">
		<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
		<div class="content"><L_>订单列表</L_></div>
		<div class="found"><L_>创建订单</L_></div>
	</section>
	<section class="menu p40">
		<ul class="clr ul_list">
			<li class="fl f27">
			<a href="foodshop_order_list.html?status=1" data-webview="true">
			<div class="li_n">
				<h2 id="book_count">0</h2>
				<p><L_>预订中</L_></p>
			</div>
			</a>
			</li>
			<li class="fl a66">
			<a href="foodshop_order_list.html?status=4" data-webview="true">
			<div class="li_n">
				<h2 id="confirm_count">0</h2>
				<p><L_>待确认菜品</L_></p>
			</div>
			</a>
			</li>
			<li class="fl bcf">
			<a href="foodshop_order_list.html?status=2" data-webview="true">
			<div class="li_n">
				<h2 id="eating_count">0</h2>
				<p><L_>就餐中</L_></p>
			</div>
			</a>
			</li>
			<li class="fl ff6">
			<a href="foodshop_order_list.html?status=3" data-webview="true">
			<div class="li_n">
				<h2 id="pay_count">0</h2>
				<p><L_>已买单</L_></p>
			</div>
			</a>
			</li>
			<li class="fl aab">
			<a href="foodshop_order_list.html?status=5" data-webview="true">
			<div class="li_n">
				<h2 id="cancel_count">0</h2>
				<p><L_>已取消</L_></p>
			</div>
			</a>
			</li>
			<li class="fl f62">
			<a href="foodshop_order_list.html?status=0" data-webview="true">
			<div class="li_n">
				<h2 id="all_count">0</h2>
				<p><L_>全部</L_></p>
			</div>
			</a>
			</li>
		</ul>
	</section>
	
	<div class="Mask"></div>

	<div class="time_content" style="position: fixed;top: 0;left: 0;bottom: 0;right: 0;background: rgba(0, 0, 0, .6);z-index: 1000;display: none;">
		<section class="elastic" style="height: 667px; overflow: hidden;">
		<div class="swiper-container swiper-container2 swiper-container-horizontal">
			<div class="swiper-wrapper">
			</div>
			<div class="swiper-button-prev"></div> 
			<div class="swiper-button-next"></div> 
		</div>
		<div class="Switch" style="height: 557px;">
		</div>
		<div class="Resersub" style=""><input type="submit" value="确认选择" class=""></div>
		</section>
	</div>

	<script src="scripts/jquery-1.8.3.min.js"></script>
	<script src="scripts/fastclick.js"></script>
	<script src="scripts/layer/layer.m.js"></script>
	<script src="scripts/common.js"></script>
	<script src="scripts/JRoll.js"></script>
	<script src="scripts/swiper-3.3.1.jquery.min.js"></script>
	<script src="scripts/work/foodshop_create.js"></script>
	<script src="scripts/work/storestaffAppoint.js"></script>
	<script>
		$(document).ready(function(){
		    getData();
		    setInterval('getData()', 2000);
	        $(".ul_list li").each(function() {
	            $(this).height($(this).width() * 0.85)
	        });
		});
		function getData()
		{
		    common.http('Storestaff&a=foodshop', {'noTip':true}, function(data){
				$('#cancel_count').html(data.cancel_count);
				$('#all_count').html(data.all_count);
				$('#pay_count').html(data.pay_count);
				$('#eating_count').html(data.eating_count);
				$('#book_count').html(data.book_count);
				$('#confirm_count').html(data.confirm_count);
				$(".ul_list li").each(function() {
					$(this).height($(this).width() * 0.85);
				});
			});
		}
	</script>
	<script src="scripts/work/foodshop_calll.js"></script>
</body>
</html>
