<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8"/>
		<title>等级分记录</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>
		<link href="css/swiper.min.css" rel="stylesheet"/>
		<link href="css/deliver.css" rel="stylesheet"/>
	</head>
	<body> 
		<section class="myGradeBox" id="myGradeBox">   
				<!-- 暂无记录 -->
				<section class="no_jilu">
					<img src="images/nojlu.png">
				</section> 
		</section>
		<script id="replyListBoxTpl" type="text/html">
			{{# for(var i in d){ }} 
			<div class="gradeListBlock">
				<div class="gradeListFl">
					<p class="p1"> {{ d[i].desc }}</p>
					<p class="p2"> {{ d[i].time }}</p>
				</div>
				<div class="gradeListFr"> 

						{{# if (d[i].type == 1) { }}
						<label class="jia">+</label>
						{{# } else {}}
						<label class="jian">-</label>
						{{# }}}

						 {{ d[i].score }}</div>
			</div>
			{{# } }}
		</script> 
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/layer/layer.m.js"></script>
		<script src="scripts/work/common.js"></script>
		<script src="scripts/work/myGradeLog.js"></script>
		<script src="scripts/common.js"></script> 
	</body>
</html>
