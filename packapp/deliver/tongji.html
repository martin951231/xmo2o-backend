		.flex {
			display: flex;
			align-items: center;
			padding: 6px 10px;
			text-align: center;
		}
		.flex div {
			flex: 1;
			padding: 5px 0px;
			background: #fff;
			border: 1px solid #ddd;
		}
		.flexActive {
			background: #2999f1 !important;
			color: #fff !important;
		}
		.deliverStoreList {
			height: 35px;
			margin-bottom: 20px;
			display: none;
		}
		.deliverStoreList label {
			padding: 15px;
			width: 28%;
			line-height: 35px;
		}
		.deliverStoreList select {
			width: 70%;
			line-height: 35px;
		}
