<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
    	<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>我的评分</title>
		<link rel="stylesheet" type="text/css" href="css/reply.css"/>
		<link href="css/deliver.css" rel="stylesheet"/>
	</head>
	<style>
		.zanwu{
			margin: auto;
			width: 100%;
			text-align: center;
		}
		.zanwu li:first-child{
			margin-top: 20px;
			display: inline-block;
			width: 60px;
			height: 60px;
			background: url(img/pqs.png) center no-repeat;
			background-size: contain;
		}
		.zanwu li:last-child{
			color: #999;
		}
	</style>
	<body>
		<section id="fixed_top">
			<section class="public pageSliderHide">
				<div class="return link-url" data-url-type="openLeftWindow" data-url="back"></div>
				<div class="content"><L_>我的评分</L_></div>
			</section>		
			<div class="h44"></div>
        </section>
		<div class="content">
			<div class="showUser">
				<div class="leftUser">
					<div class="ziLeft"><L_>综合评分</L_></div>
					<div class="ziRight"></div>
				</div>
				<div class="rightUser">
					<ul>
						<li style='position:relative'>
							<i>	<b style='z-index:100'></b></i>
						
						</li>
						<li>共<span id="total"></span><L_>人点评</L_></li>
					</ul>
				</div>
			</div>
			<!--评论列表-->
			<div class="rating">
				<div class="rating_header">
					<ul class="clear classRating">
						<li class="ft active" data-status="0"><span>全部<i id="all"></i></span></li>
						<li class="ft" data-status="1"><span>好评<i id="good"></i></span></li>
						<li class="ft" data-status="2"><span>中评<i id="middle"></i></span></li>
						<li class="ft" data-status="3"><span>差评<i id="bad"></i></span></li>
					</ul>
				</div>
				<div class="nav_end clr" id="container">
					<div class="scroller Dgrab" id="scroller">
						<div class="rating_content" id="pick_list"></div>
					</div>
				</div>
			</div>
		</div>
        <script id="replyListBoxTpl" type="text/html">
        {{# for(var i in d){ }}
        <div class="ratings">
            <div class="rating_left"><img src="{{ d[i].avatar }}"/></div>
            <div class="rating_right">
                <div class="rating_ul">
                    <ul>
                        <li>{{ d[i].name }}</li>
                        <li>
							{{# 
								for(var tmpI=0;tmpI<5;tmpI++){
									if(d[i].score >= tmpI+1){
							}}
										<i class="active"></i>
									{{# }else{ }}
										<i></i>
									{{# } }}
							{{# 
								}
							}}
                        </li>
                        <li>{{ d[i].comment }}</li>
                    </ul>
                </div>
                <div class="rating_time">{{ d[i].comment_time }}</div>
            </div>
        </div>
        {{# } }}
        </script>
        <script src="scripts/jquery-1.8.3.min.js"></script>
        <script src="scripts/fastclick.js"></script>
        <script src="scripts/layer/layer.m.js"></script>
        <script src="scripts/work/common.js"></script>
        <script src="scripts/common.js?t=01"></script>
        <script src="scripts/work/reply.js"></script>
</html>
