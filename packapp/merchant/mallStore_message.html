<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>商城信息</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link href="css/mui.poppicker.css" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="css/app.css" />

<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	    <h1 class="mui-title"><span class="amall"><L_>商城</L_></span><L_>信息</L_></h1>
	</header>
	<div class="mui-content">
	    <!--基本信息-->
	    <div class="essential_message">
	    	<div class="mui-card">
				<!--页眉，放置标题-->
				<h5 class="left_style"><L_>基本信息</L_></h5>
				<div class="mui-card-header">
					<span class="left_style open_floor" style="width: 32%;">是否开启商城 <i></i></span>
					<div class="mui-switch shop_swich store_theme">
						<div class="mui-switch-handle"></div>
					</div>
				</div>
				<!--内容区-->
				<div class="mui-card-content">
					<div class="mui-row">
					    <div class="mui-col-sm-3 left_style"><L_>商城店铺背景</L_></div>
					    <div class="mui-col-sm-9 ">
					    	<ul >
					    		<li class="up_img">
							    	<img src="images/12-8_03.png" alt="" />
							    	<input type="file" accept="image/*" id="fileImage" name="file"/>
					    		</li>
					    		<li class="store_bg"><span>商城店铺背景建议上传尺寸640*420</span></li>
					    	</ul>
					    	
					    </div>
					</div>
				</div>
				<div class="mui-card-footer">
					<span class="left_style gonggao"><L_>店铺公告</L_></span>
					<textarea name="" class="store_notice input" rows="2" cols="2" placeholder="请输入店铺公告"></textarea>
				</div>
				<div class="mui-card-footer bagging">
					<span class="left_style bagging_style"><L_>运费别名</L_></span>
					<ul>
						<li><input type="text" name="" class="freight_alias input" value="配送费用"   placeholder="请输入运费别名" /></li>
						<li> <span>* 把商品从商家送到用户手上所产生的运费的费用名称 (如：配送费用,运费...)</span></li>
					</ul>
				</div>

				<!--分类-->
				<div class="mui-card-footer dispatching_class">
					<span class="left_style peishi">配送方式 <i></i></span>
					<b id="deliver_types"><span id="deliver_text"><L_>请选择配送方式</L_></span> <sub class="mui-pull-right"></sub></b>
					
				</div>
				<!---->	
			</div>
	    </div>
	   	<!--店铺折扣设置-->
	   	 <h5 class="special"><L_>店铺折扣设置</L_></h5>
	   	 <div class="mui-card">
	   	 	<div class="mui-card-footer fa_input">
					<span class="left_style bagging_style"><L_>店铺折扣</L_></span>
					<ul>
						<li><p style="margin:10px 0 0 0;padding: 0;"><input type="number" name="" class="store_discount" placeholder="请输入折扣"/><span style="color:#FFA200;"></span></p></li>
						<li> <span>* 0-10之间的数字，支持一位小数! 8代表8折，8.5代表85折，0和10代表无折扣</span></li>
					</ul>
			</div>
			<div class="mui-card-footer radio_style discount_type">
				<div class="mui-row">
					<div class="mui-col-sm-3 left_style youshi">优惠方式 <i></i></div>
					<div class="mui-col-sm-4 ">
					    <div class="mui-input-row mui-radio mui-left">
							<label for=""><input name="radio_discount" type="radio" checked/> 折上折</label>
						</div>
					</div>
					<div class="mui-col-sm-5">
						<div class="mui-input-row mui-radio mui-left">
							<label for=""><input name="radio_discount" type="radio"/> 折扣最优</label>
						</div>
					</div>
					</div>
			</div>
	   	 </div>
	   	 <!--会员优惠功能-->
	   	 <span class="left_style plus_alert" style="width: 32%;">会员优惠功能 <i></i></span>
	   	 <div class="mui-card plus_discont">
			<!-- <div class="mui-card-content dispatching_class border_dis">
				<span class="left_style"><L_>白银级</L_></span>
	   	 		<b id="showUserPicker3"><span id="change3"><L_>请选择优惠类型</L_></span> <sub class="mui-pull-right"></sub></b>
				
				<p><input type="number" name="" id="" value="" placeholder="请填写一个优惠值数字"/> <span>折</span></p>
			</div>
			<div class="mui-card-content dispatching_class border_dis">
				<span class="left_style"><L_>尊贵级</L_></span>
	   	 		<b id="showUserPicker4"><span id="change4"><L_>请选择优惠类型</L_></span> <sub class="mui-pull-right"></sub></b>
				
				<p><input type="number" name="" id="" value="" placeholder="请填写一个优惠值数字"/> <span>折</span></p>
			</div>
			<div class="mui-card-content dispatching_class border_dis">
				<span class="left_style"><L_>专业级</L_></span>
	   	 		<b id="showUserPicker5"><span id="change5"><L_>请选择优惠类型</L_></span> <sub class="mui-pull-right"></sub></b>
				
				<p><input type="number" name="" id="" value="" placeholder="请填写一个优惠值数字"/> <span>折</span></p>
			</div> -->
	   	 </div>
	   	 <!--保存按钮-->
	   	 <button type="button" class="btn_keep"><L_>保存</L_></button>
	</div>
	<div id="middlePopover" class="mui-popover"> 
			<div class="mui-card">
				<!--页眉，放置标题-->
				<div class="mui-card-header">
					<span><L_>是否开启商城</L_></span>
					<b class="mui-pull-right"><i></i></b>
				</div>
				<!--内容区-->
				<div class="mui-card-content">
					<ul>
						<li>开启：<span class="ashop"><L_>快店</L_></span><L_>中的商品显示为侧重图片模板，店铺中的商品设置了商城属性后，商品就会进入商城中；</L_></li>
						<li>关闭：<span class="ashop"><L_>快店</L_></span><L_>中的商品显示为侧重文字模板，商品在商城中不显示。</L_></li>
					</ul>
					<button type="button" class="know"><L_>知道了</L_></button>
				</div>
				<!--页脚，放置补充信息或支持的操作-->
				<!--<div class="mui-card-footer"><L_>页脚</L_></div>-->
			</div>
	</div>
	
	
	<div class="deliver_time_box hidden">
		<div class="mask"></div>
		<div class="timer">
			<div class="header"><span style="margin-left: 17%;"><L_>选择分类</L_></span>  <i class="mui-pull-right"><L_>完成</L_></i></div>
			<div class="content">
				<div class="day" style="height: 346.6px;">
				
				</div>
				<div class="time" style="height: 346.6px;">
							
				</div>
			</div>
		</div>
