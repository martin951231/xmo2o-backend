<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>在线签署合同</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/app.css" />
    <link href="css/mui.picker.css" rel="stylesheet" />
    <link href="css/mui.poppicker.css" rel="stylesheet" />
</head>
<style type="text/css">
    .white{
        background: #FFFFFF;
    }
    .white p{
        color: #000000;
        word-wrap: break-word;
        word-break: normal;
    }
    .gray{
        background: #808080;
    }
    .yellow{
        background: #FFA200;
    }
    .sign_btn{
        font-weight:bold;
        color:#FFFFFF;
        position: fixed;
        height: 2.5rem;
        bottom: 10px;
        line-height: 2.5rem;
        width: 40%;
        border-radius: 30px;
        margin-left: 30%;
        text-align: center
    }
</style>
<body class="white">
<header class="mui-bar mui-bar-nav">
    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" style="color:black;"></div>
    <h1 class="mui-title"></h1>
</header>
<div id="contract_box" class="mui-content white" style="padding-left: 10px;padding-right: 10px;padding-bottom: 5rem;">


</div>
<div class="sign_btn gray" style="display: none;">
    <L_>去签字<L_>（30s）
</div>

<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/mui.picker.js"></script>
<script src="js/mui.poppicker.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<script src="js/work/contract.js?t=12347" type="text/javascript" charset="utf-8"></script>


<script id="contractTpl" type="text/html">
    <div>
        <h4 style="text-align: center;margin-top: 1rem">{{ L_('商家入驻协议') }}</h4>
        <p style="text-align: right">{{ L_('协议编号') }}:<font style="text-decoration: underline">{{d.contract_number}}</font></p>
        <p>{{ L_('合同期限') }}：{{d.date_info}}</p>
        <p>{{ L_('甲方') }}：{{d.partner_a.name}}</p>
        <p>{{ L_('乙方') }}：{{d.partner_b.name}}</p>
        <p style="text-indent: 2rem;margin-top: 1rem;margin-bottom: 1px">
            {{d.contract_content}}
        </p>
        <hr style="border:1px dashed #DDDDDD">
        <div style="position: relative">
            <p>{{ L_('扣点百分比') }}：{{d.rate}}%</p>
            <p>{{ L_('乙方') }}：{{d.partner_b.name}}</p>
            <p>{{ L_('代表') }}：{{d.partner_b.represent}}</p>
            <p>{{ L_('电话') }}：{{d.partner_b.phone}}</p>
            <p>{{ L_('地址') }}：{{d.partner_b.address}}</p>
            <p>{{ L_('日期') }}：{{d.partner_b.date}}</p>
            {{# if(d.partner_b.sign_pic != ''){ }}
            <img style="position: absolute;top:0;right: 2px;max-width: 200px" src="{{d.partner_b.sign_pic}}"/>
            {{# } }}
        </div>
        <hr style="border:1px dashed #DDDDDD">
        <div style="position: relative">
            <p>{{ L_('甲方') }}：{{d.partner_a.name}}</p>
            <p>{{ L_('法人') }}：{{d.partner_a.represent}}</p>
            <p>{{ L_('电话') }}：{{d.partner_a.phone}}</p>
            <p>{{ L_('地址') }}：{{d.partner_a.address}}</p>
            <p>{{ L_('日期') }}：{{d.partner_a.date}}</p>
            {{# if(d.partner_a.sign_pic != ''){ }}
            <img style="position: absolute;top:0;right: 2px;max-width: 200px" src="{{d.partner_a.sign_pic}}"/>
            {{# } }}
        </div>
    </div>
</script>
</body>
</html>
