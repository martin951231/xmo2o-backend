		<script>
            mui.init();
            var ticket = common.getCache('ticket');
            var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0);
            var order_id = urlParam.order_id;
            var goods_id = urlParam.goods_id;
            var current_id = urlParam.current_id;
            var pick_id = urlParam.pick_id;
            var is_pick = urlParam.is_pick;
            var shopList = [];
            var mask = mui.createMask();//callback为用户点击蒙版时自动执行的回调；
            var fareTemplet = []; // 快递配送公司信息
			var Currency_txt = '元';
            var is_group = '';
            var team_id = '';
            var is_type = '';
            var h=$(window).height();
            $('#payPopover .mui-card').css({'height': 0.8*h, 'overflow-y': 'auto'});

            var buy_num = common.getCache('buy_num');
            var buy_nums = common.getCache('buy_nums');
            var is_pick_in_store = is_pick;
            if (!is_pick_in_store) {
                is_pick_in_store = 0;
            }
            console.log('buy_num',buy_num);
            console.log('buy_nums',buy_nums);
            console.log('is_pick_in_store',is_pick_in_store);


            // 渲染数据
            common.http('Merchantapp&a=market_buy_detail', {
                'ticket': ticket,
                'client': client,
                'goods_id': goods_id,
                'address_id': current_id,
				'pick_id' : pick_id,
				'is_pick_in_store': is_pick,
				'buy_num': buy_num,
