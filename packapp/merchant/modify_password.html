<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>修改密码</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/mofidy_password.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left go_back" data-url="back" ></div>
	    <h1 class="mui-title"><L_>修改密码</L_></h1>
	</header>
	<div class="mui-content">
	    <div class="phone_num">
	    	<ul>
	    		<li><b></b></li>
	    		<li><span><L_>您当前的手机号为</L_></span>&nbsp;<span id="phoneTxt"></span></li>
	    	</ul>
	    </div>
	    <div class="mui-card">
			<!--页眉，放置标题-->
			<!--<div class="mui-card-header"><L_>页眉</L_></div>-->
			<!--内容区-->
			<div class="mui-card-content">
				<ul>
					<li><input type="tel" id="smsCode" maxlength="4" placeholder="请输入短信验证码"/>
					<button type="button" class="mui-pull-right sendCode" tabindex="-1"><L_>获取验证码</L_></button></li>
					<li><input type="password" id="newPwd" placeholder="请输入6位以上的新密码"/></li>
					<li><input type="password" id="confirmPwd" placeholder="请再次输入新密码"/></li>
				</ul>
			</div>
			<!--页脚，放置补充信息或支持的操作-->
			<!--<div class="mui-card-footer"><L_>页脚</L_></div>-->
		</div>
		<a href="javascript:;" class="confirm_modify modify_password"><L_>确定修改</L_></a>
		<div style="font-size:12px;padding-left:5%;margin-top:20px;"><L_>若手机号无法接收短信，请联系管理员修改密码</L_></div>
	</div>
	<script src="js/fastclick.js"></script>
	<script src="js/mui.min.js"></script>
	<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/work/modify_password.js" type="text/javascript" charset="utf-8"></script>
</body>
</html>
