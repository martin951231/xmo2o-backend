<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
		<title>订单列表</title>
		<link href="css/mui.css" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="css/common.css" />
		<link rel="stylesheet" type="text/css" href="css/newMarketing_orderList.css" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
			<h1 class="mui-title"><L_>订单列表</L_></h1>
		</header>
		<div class="mui-content">
			<div class="list"></div>
            <div class="empty" style="display:none;"><L_>暂无数据</L_></div>
			<div class="pullup1" style="display:none;"><L_>上拉加载更多</L_>...</div>
			<div class="loading1" style="display:none;"><img src="images/xubox_loading2.gif" alt=""><L_>正在加载</L_></div>
		</div>
		<script src="js/fastclick.js"></script>
		<script src="js/mui.min.js"></script>
		<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
        <script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
		<script id="cardlist" type="text/html">
            {{# for(var i = 0, len = d.length; i < len; i++){  }}
               {{# var item = d[i]; }} 
                <div class="item" data-id="{{item.order_id}}" data-type="{{item.order_type}}">
                    <div class="flex justify-between align-center">
                        <div class="flex-1">
                            <div class="order-type"><L_>{{item.order_type == '1'?'续费订单':'新订单'}}</L_></div>
                            <div class="orderid cr-gray"><span class="mr-4"><L_>订单编号</L_></span><span class="text-wrap">{{item.orderid || '-'}}</span></div>
                        </div>
                        <div class="btn text-nowrap"><L_>详情</L_></div>
                    </div>
                    <ul class="content">
                        <li>
                            <span class="label text-wrap"><L_>订单店铺</L_></span>   
                            <span class="value text-wrap flex-1"><L_>{{item.store_name || '-'}}</L_></span>  
                        </li>
                        <li>
                            <span class="label text-wrap"><L_>购买数量</L_></span>   
                            <span class="value text-wrap flex-1">{{item.buy_num || '0'}}</span>  
                        </li>
                        <li>
                            <span class="label text-wrap"><L_>店铺总量</L_></span>   
                            <span class="value text-wrap flex-1">{{item.store_num || '0'}}</span>  
                        </li>
                        <li>
                            <span class="label text-wrap"><L_>下单时间</L_></span>   
                            <span class="value text-wrap flex-1">{{item.add_time || '-'}}</span>  
                        </li>
                        <li>
                            <span class="label text-wrap"><L_>订单金额</L_></span>   
                            <span class="value text-wrap flex-1 cr-red">￥{{item.total_price || '0'}}</span>  
                        </li>
                    </ul>
                </div>
            {{# } }}
        </script>
		<script type="text/javascript" charset="utf-8">
			mui.init();
			var page=1;
            var list = [];
            var hasMore = true;
            var pageSize = 10;
			function getList(page){
                $('.loading1').show();
                var params = {
                    page: page,
                    pageSize: pageSize
                }
                var success = function(data) {
                    $('.loading1').hide();
                    list = data.list;
					if(list.length == 0 && page == 1){
                        $('.empty').show();
                        hasMore = false;
					} else {
						if(list.length < pageSize){
							$('.pullup1').html(L_('没有更多数据啦')); 
                            hasMore = false;
						}  
						$('.pullup1').show();
						laytpl(document.getElementById('cardlist').innerHTML).render(list, function(html){
							$('.list').append(html);
						});
					}
                }
				common.http('StoreMarketingOrder&a=getOrderList',params,success);
			}
            getList(1)
            $(window).scroll(function(e) {
                e.stopPropagation();
                if(!hasMore){
                    return false;
                }
                if ($(document).scrollTop() <= 0) {
                    return false;
                }
                
                //上拉加载
                if ($(document).scrollTop() > $(document).height() - $(window).height() -20) {
                    $('.pullup1').hide();
                    $('.loading1').show();
                    page++;
                    getList(page);
                }
            });

            // 详情
            mui('.mui-content').on('tap','.item',function(e){
				var order_id=$(this).data('id');
                var order_type=$(this).data('type');
                openWindow({
					url:'newMarketing_orderDetail.html?order_id='+order_id + '&order_type='+ order_type,
					id:'newMarketing_orderDetail'
				});
			});
		</script>
	</body>
</html>
