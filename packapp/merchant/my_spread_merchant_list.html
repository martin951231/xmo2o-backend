						{{# } else{ }}

						{{# } }}
					</ul>
	    		</a>
	    	</div>
	    </div>
	{{# } }}

<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);

var pindex=1;
var searchtype='name';
var seachVal='';
function addGoods(page,key,type){
	common.http('Merchantapp&a=spread_merchant_list',{'ticket':ticket,'client':client,'pindex':page,'keyword':key,'searchtype':type},function(data){
		console.log('data', data);
		if (data.merchant_list.length!=0) {
			data.merchant_list.length<=9&&$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
			laytpl(document.getElementById('pluscardLists').innerHTML).render(data.merchant_list, function(html){
				$('.alls').append(html);
			});
			if(data.merchant_list.length>9){
				var flag = false;
				$(window).scroll(function(e) {
				    e.stopPropagation();
				    if(flag){
				      //数据加载中
				      return false;
				    }
				    //上拉加载
				    if ($(document).scrollTop() == $(document).height() - $(window).height()) {
				    	$('.pullup1').hide();
				    	$('.loading1').show();
				    	flag = true;
				        pindex++;
				      addGoods(pindex,seachVal,searchtype);
				    }
				});
			}
		}else{
			$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
		}
	});
}

addGoods(1,'',searchtype);



// 监听input搜索
$('.cable_n input').keyup(function(e){
	seachVal=$(this).val();
	$('.alls').html('');
	if(seachVal!=''){
		pindex=1;
	}
	addGoods(pindex,seachVal,searchtype);
});



console.log(222);
(function($, doc) {
	$.init();
	mui('.cable_n').on('tap','.consumption_password',function(e) {
		//消费密码
		var userPicker = new $.PopPicker();
		userPicker.setData([
		 		{
				value: 'name',
				text: '商户名称'
				},{
				value: 'mer_id',
				text: '商户编号'
				}]);
		var that=this;
		userPicker.show(function(items) {
			that.children[0].innerHTML = items[0].text;
			that.children[0].style.color="#333333";
			searchtype=items[0].value;
			pindex=1;
			document.getElementById('data').innerHTML=" ";
			addGoods(pindex,seachVal,searchtype);
		}, false);

	});

})(mui, document);
</script>
