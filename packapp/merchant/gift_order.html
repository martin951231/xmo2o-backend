<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>积分商城订单记录</title>
    <link href="css/mui.css" rel="stylesheet"/>
     <link rel="stylesheet" type="text/css" href="css/app.css" />
	<link href="css/mui.picker.css" rel="stylesheet" />
	<link href="css/mui.picker.min.css" rel="stylesheet" />
	<link href="css/mui.poppicker.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="css/platform_score_record.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	    <h1 class="mui-title"><L_>积分商城订单记录</L_></h1>
	</header>
	<div class="mui-content">
		<!--筛选后内容-->
		<div class="cards" id="cards">
			
			
		</div>
		<!-- 上拉刷新 -->
		<div class="pullup L_" style="display:none;">上拉加载更多...</div>
		<div class="loading" style="display:none;"><img src="images/xubox_loading2.gif" alt=""/><L_>正在加载</L_></div>
	</div>
<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/mui.dtpicker.js"></script>
<script src="js/mui.picker.js"></script>
<script src="js/mui.poppicker.js"></script>
<script src="js/city.data.js" type="text/javascript" charset="utf-8"></script>
<script src="js/city.data-3.js" type="text/javascript" charset="utf-8"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<script id="cardlist" type="text/html">
	{{# for(var i = 0, len = d.length; i < len; i++){ }}
		<div class="mui-card" data-id="{{d[i]['order_id']}}">
				<!--页眉，放置标题-->
				<div class="mui-card-header">
					<span></span>

					<a></a>
					{{# if (d[i]['exchange_type'] == 1) {}}
						<p>{{d[i]['score_name']}}：{{d[i]['total_integral']}},{{ L_('金额') }}：{{ L_('￥') }}{{d[i]['total_price']}}</p>
					{{# } else { }}
						<p>{{d[i]['score_name']}}：{{d[i]['total_integral']}}</p>
					{{# } }}
				</div>
				<!--内容区-->
				<div class="mui-card-content show_content mui-clearfix">
				</div>
				<div class="mui-card-footer show">
			       <span>{{ L_('商品名称') }}:&nbsp;{{d[i]['order_name']}}</span>
			       <i class="mui-pull-right up_down"></i>
				</div>
			</div>
	{{# } }}
</script>
<script id="content_list" type="text/html">
	{{# for(var i = 0, len = d.data.length; i < len; i++){ }}
		{{#  if(d.data[i].name!="描述"){ }}
			{{# if(d.data[i].value!=null){}}
				<div class="mui-pull-left" style="width: 50%;">
					<p>{{d.data[i].name}}:{{d.data[i].value}}</p>
				</div>
			{{# } else { }}
				<div class="mui-pull-left" style="width: 50%;">
					<p>{{d.data[i].name}}:{{ L_('无') }}</p>
				</div>
			{{# } }}
		{{# } }}

	{{# } }}
</script>
<script type="text/javascript" charset="utf-8">
	var ticket = common.getCache('ticket');
	//console.log(ticket);
	var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
	var be_date='';
	var enddate='';
	var stor_list=[];
	var set_state_index='';
	var page=1;
	var zuiShi='';
	var ctuan=common.getCache('ctuan');
	$('.ctuan').text(ctuan);
	function p(s) {
	    return s < 10 ? '0' + s: s;
	}

	//获取当前时间
	var myDate = new Date();
	//获取当前年
	var year=myDate.getFullYear();
	//获取当前月
	var month=myDate.getMonth()+1;
	//获取当前日
	var date=myDate.getDate(); 
	var now=year+'-'+p(month)+"-"+p(date);
	var start=year+'-'+p(month)+"-"+p('1');
	//console.log(now);
	$('#begin_date').text(start);
	$('#end_date').text(now);

	now=replaceAll(now);
	start=replaceAll(start);
	zuiShi=start+'-'+now;
	be_date=start;
	enddate=now;
	console.log(zuiShi)
	function selectChange(lists){
		stor_list=[];
		$.each(lists,function(i,val){
			var goods_id_list ={'value':'','text':''};
			goods_id_list.text=val.name;
			goods_id_list.value=val.store_id;
			stor_list.push(goods_id_list);
		});
	}
	function replaceAll(str){
		if(str!=null)
		str = str.replace(/-/g,"/")
		return str;
	}
	function changeAllshou(){
		common.http('Merchantapp&a=gift_order',{'ticket':ticket,'client':client,'page':page},function(data){

			console.log( data.list.totalPage)
			if(data.list.order_list.length==0 || data.list.totalPage < page){
				$('.pullup').html(L_('没有更多数据啦'));
				$('.loading').hide();
				$('.pullup').show();

			}else{
				data.list.order_list.length<10&&$('.pullup').html(L_('没有更多数据啦'));
				$('.loading').hide();
				$('.pullup').show();
				var list = data.list.order_list;
				console.log(list)
				laytpl(document.getElementById('cardlist').innerHTML).render(list, function(html){
					$('.cards').append(html);
					$('.loading').hide();
					$('.pullup').show();
				});
				if(data.list.order_list.length>9){
				 var flag = false;
					 // 上拉加载和下拉刷新
					 $(window).scroll(function(e) {
					 	e.stopPropagation();
		                //上拉加载
		                 if(flag){
					      //数据加载中
					      return false;
					    }
		                if ($(document).scrollTop() == $(document).height() - $(window).height()) {
		                	$('.pullup').hide();
		                	$('.loading').show();
		                	flag = true;
		                    page++;
		                    changeAllshou();
		                    //$('.pullup').show();
		                	//$('.loading').hide();
		                }
		            });
				}
				
			}
			
		});
	}
	// 页面初次加载
	changeAllshou();

      	mui.init();
      	//筛选
      	  	(function($, doc) {
				$.init();
			})(mui, document);

			//控制显示隐藏
			mui('.mui-content').on('click','.show',function(e){
				var id=$(this).parents('.mui-card').data('id');
				var me=this;
				if($(this).is('.active')){
					$(this).removeClass('active');
					$(this).prev('.show_content').hide();
				}else{
					common.http('Merchantapp&a=gift_order_detail',{'ticket':ticket,'client':client,'id':id},function(data){
						console.log(data);
						laytpl(document.getElementById('content_list').innerHTML).render(data, function(html){
							$(me).prev('.show_content').html(html);
						});
					});
					$(this).addClass('active');
					$(this).prev('.show_content').show();
				}
			});
			
            mui('.mui-bar').on('tap','.buy_score', function () {
                openWindow({
                    url:'merchant_buy_score.html',
                    id:'merchant_buy_score'
                });
            });



</script>
</body>
</html>
