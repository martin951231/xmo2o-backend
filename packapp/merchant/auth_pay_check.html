<script>
    mui.init();
    var ticket = common.getCache('ticket');
    var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0);
    var menu_group = urlParam.menu_group;
    var is_try = urlParam.is_try;
    var change_money = urlParam.change_money;
    var mask = mui.createMask();//callback为用户点击蒙版时自动执行的回调；
    var Currency_txt = '元';
    var openid = urlParam.openid;
    let merchantMoneyRemain = 0;//商家余额
    let totalPrice = 0;

    // 渲染数据
    common.http('Merchantapp&a=auth_pay_check', {
        'ticket': ticket,
        'client': client,
        'menu_group': menu_group,
        'is_try' : is_try,
        'change_money' : change_money,
    }, function (data) {
        merchantMoneyRemain = data.merchant.money;
        totalPrice = data.auth_info.price;
        Currency_txt = data.config['Currency_txt'];
        laytpl(document.getElementById('pluscardLists').innerHTML).render(data, function (html) {
            $('.allHtml').html(html);
            setTimeout(function () {
                if (openid) {
                    $('.weixin').attr('checked', true);
                }
            }, 500)
        });
    });
    //            if(!openid && data.config['pay_weixinh5_open'] == '1'){
    //            	location.href = window.location.protocol + '//' + requestDomain + '/wap.php?c=Packapp&a=bind&is_return=1&referer=' + encodeURI(location.href);
    //            }

    // });

    // 确认支付订单
    mui('.plus_class').on('tap','.to_pay',function(){
        var pay_type = $('input[name="pay_type"]:checked').val();
        console.log(pay_type);
        if (pay_type=='weixin' && !openid) {
            layer.open({
                content: L_('微信支付需要先绑定微信？绑定后请重新点击确认支付！')
                ,btn: [L_('前往'), L_('取消')]
                ,yes: function(index){
                    location.href = window.location.protocol + '//' + requestDomain + '/wap.php?c=Packapp&a=bind&is_return=1&referer=' + encodeURI(location.href);
                    layer.close(index);
                }
            });
        } else {
            callpay();
        }
    });

    //微信弹程支付
    function callpay(){
        var pay_type = $('input[name="pay_type"]:checked').val();
        var order_id = $('input[name="order_id"]').val();
        var num = $('input[name="num"]').val();
        var money = totalPrice - merchantMoneyRemain;
        console.log(order_id);
        common.http('Merchantapp&a=auth_pay_success', {
            'ticket': ticket,
            'client': client,
            'order_id':order_id,
            'pay_type':pay_type,
            'total_price' : totalPrice,
            'num' : num,
            'openid': openid
        }, function (data) {
            console.log(data);

            if(pay_type == 'weixin' && !data.error){
                layer.closeAll();
                layer.open({
                    type:1,
                    content:'<div onclick="location.reload()" style="width:250px;top:50%;position:fixed;background:white;padding:20px 0;left:50%;margin-left:-125px;text-align:center;border-radius:10px;margin-top:-27px;">正在唤起微信支付，点击刷新</div>',
                    shadeClose:false,
                    success:function(){

                    }
                });
                param =  data.weixin_param;
                WeixinJSBridge.invoke("getBrandWCPayRequest",param,function(res){
                    WeixinJSBridge.log(res.err_msg);
                    if(res.err_msg=="get_brand_wcpay_request:cancel"){
                        setTimeout(function(){
                            window.location.reload();
                        },200);
                        layer.open({type:2,content:'刷新页面中',shadeClose:false});
                    }else if(res.err_msg=="get_brand_wcpay_request:ok"){
                        setTimeout("window.location.href = '"+data.redirctUrl+"'",200);
                        layer.open({type:2,content:'跳转加载中',shadeClose:false});
                    }else{
                        $("button.mj-submit").removeAttr("disabled");
                        $("button.mj-submit").html("确认支付");
                    }
                    layer.closeAll();
                });
            } else if (data && data.error && data.msg) {
                // mui.toast(data.msg);

                if (data.jump) {
                    var jump = data.jump;
                    setTimeout(function () {
                        if ('buy'==jump){
                            var order_id=data.order_id;
                            var goods_id=data.goods_id;
                            openWindow({
                                url:'market_detail.html?order_id='+order_id+'&goods_id='+goods_id+'&type=buy',
                                id:'market_detail'
                            });
                        } else if ('market_index'==jump) {
                            openWindow({
                                url:'market_index.html',
                                id:'market_index'
                            });
                        } else if ('mweb_url'==jump) {
                            common.setCache('jump_url', data.url);
                            common.setCache('total_money', data.total);
                            common.setCache('h5_name', data.name);
                            if(common.checkApp()){
                                var new_mweb_url = (window.location.protocol == 'http:' ? 'http:' : 'https:' ) + '//'+requestDomain+ "/packapp/merchant/market_weixinh5.html?mweb_url=" + encodeURIComponent(data.url) +"&total_money=" + data.total + "&h5_name=" + encodeURIComponent(data.name);
                                if(common.checkAndroidApp()){
                                    window.pigcmspackapp.openBrowser(new_mweb_url);
                                }else{
                                    var iosHref = window.btoa(new_mweb_url);
                                    iosHref = iosHref.replace('/','&');
                                    common.iosFunction('openBrowser/'+iosHref);
                                }
                            } else {
                                openWindow({
                                    url:'market_weixinh5.html',
                                    id:'market_weixinh5'
                                });
                            }
                        }
                    }, 800);
                } else {
                    var btnArray=[L_('否'),L_('是')];
                    mui.confirm(L_('余额不足，是否前去充值？'), L_('充值提醒'), btnArray, function(e){
                        if(e.index == 1){

                            openWindow({
                                url:'mer_recharge.html?money='+money,
                                id:'mer_recharge'
                            });
                        }
                    });
                }
            } else {
                mui.toast('支付成功');

                setTimeout(function () {
                    openWindow({
                        url:'auth_package_buy_record.html',
                        id:'auth_package_buy_record'
                    });
                }, 1000);
            }
        });
    }

    //点击蒙版
    mui('body').on('tap','.mui-backdrop',function(){
        mui('#middlePopover').popover('hide');
        mui('#payPopover').popover('hide');
        mask.close();
        $('body').css('overflow-y','scroll');
    });

    mui('body').on('tap','.plus a',function(e){
        var index = $(this).data('index');
        if (index) {
            console.log('index',index);
            var input_class = '.buy_index_'+index;
            var plus_class = '.plus_'+index;
            var num = parseInt($(input_class).val());
            var min_num=$(input_class).data('min_num');
            var stock_num = parseInt($(input_class).data('stock_num'));
            var min_unit=$(input_class).data('min_unit');
            console.log('min_unit', min_unit);
            if ($(this).attr('class') == 'jia') {
                var n = Math.ceil(min_num/min_unit);
                if (min_num<=0) {
                    n = 1;
                }
                if (min_unit == 1) {
                    num ++;
                } else if (parseInt(min_unit) > 0 && parseInt(num) == parseInt(min_num) && (min_unit * n>min_num)) {
                    num += min_unit * n - min_num;
                } else if (min_unit > 0) {
                    num += min_unit;
                } else {
                    num ++;
                }
                //限购校验(最多购买数量)
                if(typeof stock_num!='undefined' && !isNaN(stock_num) && stock_num>0){
                    stock_num=parseInt(stock_num);
                    if(num>stock_num){
                        mui.toast('最多购买数为'+stock_num);
                        return false;
                    }
                }
            } else {
                if (min_unit > 0 && num-min_unit < min_num) {
                    num = min_num;
                } else if (min_unit > 0) {
                    num -= min_unit;
                } else {
                    num --;
                }
                //限购校验(最少购买数量)
                if(typeof min_num!='undefined' && !isNaN(min_num) && min_num>0){
                    min_num=parseInt(min_num);
                    if(num<min_num){
                        mui.toast('最少购买数为'+min_num);
                        return false;
                    }
                }
            }
            if (num < 0) {
                num = 0;
            }
            if (num >min_num) {
                $(plus_class+" a.jian").css("color","#333333");
            }else if(num==min_num){
                $(plus_class+" a.jian").css("color","#bfbfbf");
            }else{
                $(plus_class+" a.jian").css("color","#bfbfbf");
                return false;
            }
            $(plus_class+' input').val(num);
            console.log('num',num);
            buy_nums_info();
            return;
        }
        var num = parseInt($('.plus input').val());
        var min_num=$(this).data('min_num');
        var min_unit = $('.plus input').data('min_unit');
        var stock_num = $('.plus input').data('stock_num');
        var currency = $('.total_price').data('currency');
        if ($(this).attr('class') == 'jia') {
            var n = Math.ceil(min_num/min_unit);
            if (min_unit == 1) {
                num ++;
            } else if (min_unit > 0 && num == min_num) {
                num += min_unit * n - min_num;
            } else if (min_unit > 0) {
                num += min_unit;
            } else {
                num ++;
            }
            $('.plus input').val(num)
            // //限购校验(最多购买数量)
            // if(typeof stock_num!='undefined' && !isNaN(stock_num) && stock_num>0){
            //     stock_num=parseInt(stock_num);
            //     if(num>stock_num){
            //         mui.toast('最多购买数为'+stock_num);
            //         return false;
            //     }
            // }
        } else {
            if (min_unit > 0 && num-min_unit < min_num) {
                num = min_num;
            } else if (min_unit > 0) {
                num -= min_unit;
            } else {
                num --;
            }
            //限购校验(最少购买数量)
            if(typeof min_num!='undefined' && !isNaN(min_num) && min_num>0){
                min_num=parseInt(min_num);
                if(num<min_num){
                    mui.toast('最少购买数为'+min_num);
                    return false;
                }
            }
            $('.plus input').val(num)
        }
        var price = $('.total_price').data('price')
        totalPrice = parseFloat(price * num).toFixed(2)
        $('.total_price').text(totalPrice + currency)
        if (num < 1) {
            num = 1;
        }
        console.log('min_num',min_num);
        if (num >min_num) {
            $(".plus a.jian").css("color","#333333");
        }else if(num==min_num){
            $(".plus a.jian").css("color","#bfbfbf");
        }else{
            $(".plus a.jian").css("color","#bfbfbf");
            return false;
        }
        $("input[name='buy_num']").val(num);
    });


    (function ($, doc) {
        $.init();

    })(mui, document);
</script>
