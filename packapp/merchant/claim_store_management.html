<!DOCTYPE html>
<html lang="zh-CN">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
		<title>认领店铺管理</title>
		<link href="css/mui.css" rel="stylesheet" />
		<link rel="stylesheet" type="text/css" href="css/claim_store_management.css" />
	</head>

	<body>
		<header class="mui-bar mui-bar-nav">
			<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
			<h1 class="mui-title"><L_>认领店铺管理</L_></h1>
		</header>
		<div class="mui-content">
			<div id="slider" class="mui-slider">
				<div id="sliderSegmentedControl" class="mui-scroll-wrapper mui-slider-indicator mui-segmented-control mui-segmented-control-inverted">
						<ul class="mui-control-item mui-active allshopAll" href="#item1mobile" data-wid="tab-top-subpage-1.html">
							<li>0</li>
							<li><L_>全部</L_></li>	
						</ul>
						<ul class="mui-control-item claim_normal" href="#item2mobile" data-wid="tab-top-subpage-2.html">
							<li>0</li>
							<li><L_>待认领</L_></li>
						</ul>
						<ul class="mui-control-item claimed_info" href="#item3mobile" data-wid="tab-top-subpage-4.html">
							<li>0</li>
							<li><L_>已认领</L_></li>
						</ul>
				</div>

			</div>
			<div class="all_shop_lists">
		
				

			</div>
			<div class="pullup1" style="display:none;">上拉加载更多...</div>
			<div class="loading1" style="display:none;"><img src="images/xubox_loading2.gif" alt=""><L_>正在加载</L_></div>
			
		</div>
		<script src="js/fastclick.js"></script>
		<script src="js/mui.min.js"></script>
		<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
		<!-- 所有店铺内容模板 -->
		<script id="store_list" type="text/html">
			{{# for(var i = 0, len = d.data.length; i < len; i++){ }}
			
				<div class="mui-card" data-id="{{d.data[i].store_id}}" data-status="{{ d.data[i].status }}">
					<div class="mui-card-header">
						<h4>{{d.data[i].name}}</h4>
						{{# if(d.data[i].claim_status==1){ }}<span class="normal">{{ L_('待认领') }}</span>{{# } }}
						{{# if(d.data[i].claim_status==2){ }}<span class="wait_close">{{ L_('已认领') }}</span>{{# } }}
						{{# if(d.data[i].claim_status==3){ }}<span class="wait_close">{{ L_('我已认领') }}</span>{{# } }}
					</div>
					<div class="mui-card-content">
						<ul>
							<li><i></i><span>{{d.data[i].phone}}</span></li>
							<li><b></b><span>{{d.data[i].adress}}</span></li>
						</ul>
					</div>
					{{# if(d.data[i].status==1){ }}

						<div class="mui-card-footer claim_btn">
							{{# if(d.data[i].claim_status==1){ }}
							<button type="button" data-store_id="{{d.data[i].store_id}}" class="btn_claim claim_info">{{ L_('认领') }}</button>
							{{# } else if(d.data[i].claim_status==2) { }}
							<button type="button" class="btn_claimed">{{ L_('已认领') }}</button>
							{{# } else if(d.data[i].claim_status==3) { }}
							<button type="button" class="btn_claimed">{{ L_('我已认领') }}</button>
							{{# } }}
							
						</div>
					{{# } else { }}
						<div class="mui-card-footer mui-clearfix" style="display:block;border-top:1px solid #f1f1f1;">
							<button type="button" class="btn_penci mui-pull-right">{{ L_('编辑') }}</button>
						</div>
					{{# } }}
				</div>
		
			{{# } }}
		</script>
		
		
		<script type="text/javascript" charset="utf-8">
			mui.init();
			var ticket = common.getCache('ticket');
			var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
			var forms1=common.getCache('forms1');
			var page=1;
			var status1="-1";
			// 渲染所有店铺内容
			// 默认进页面渲染店铺列表

			openShop('-1',1);
			function allshop_list(){
				common.http('Merchantapp&a=claim_store_list',{'ticket':ticket,'client':client},function(data){
					//console.log(data);
					laytpl(document.getElementById('store_list').innerHTML).render(data, function(html){
						$('.all_shop_lists').html(html);
					});
					var all_num=parseFloat(data.claim)+parseFloat(data.is_claimed);
					$('#sliderSegmentedControl ul:eq(0) li:eq(0)').text(data.all);
					$('#sliderSegmentedControl ul:eq(1) li:eq(0)').text(data.claim);
					$('#sliderSegmentedControl ul:eq(2) li:eq(0)').text(data.is_claimed);
				});
			}
			function openShop(status,page){
				console.log(status);
				common.http('Merchantapp&a=claim_store_list',{'ticket':ticket,'client':client,'claim_status':status,'pindex':page},function(data){
					console.log(data);
                    var all_num=parseFloat(data.claim)+parseFloat(data.is_claimed);
                    $('#sliderSegmentedControl ul:eq(0) li:eq(0)').text(data.all);
                    $('#sliderSegmentedControl ul:eq(1) li:eq(0)').text(data.claim);
                    $('#sliderSegmentedControl ul:eq(2) li:eq(0)').text(data.is_claimed);
					
					if(data.data.length==0){
						$('.pullup1').html(L_('没有更多数据啦'));
						$('.loading1').hide();
						$('.pullup1').show();
					}else{
						data.data.length<=9&&$('.pullup1').html(L_('没有更多数据啦'));
						$('.loading1').hide();
						$('.pullup1').show();
						laytpl(document.getElementById('store_list').innerHTML).render(data, function(html){
							$('.all_shop_lists').append(html);
						});
						if(data.data.length>9){
							var flag = false;
							$(window).scroll(function(e) {
							    e.stopPropagation();
							    if(flag){
							      //数据加载中
							      return false;
							    }
							     if ($(document).scrollTop() <= 0) {
							        return false;
							     }
							    
							    //上拉加载
							    if ($(document).scrollTop() == $(document).height() - $(window).height()) {
							    	$('.pullup1').hide();
							    	$('.loading1').show();
							    	flag = true;
							        page++;
							      	openShop(status1,page);
							    }
							});
						}
						
					}
					
					
					
				});
			}
			
			// 全部点击
			mui('.mui-content').on('tap','.allshopAll',function(e){
				// allshop_list();
				page=1;
				$('.all_shop_lists').html('');
				openShop('-1',page);
			});
			// 待认领点击
			mui('.mui-content').on('tap','.claim_normal',function(e){
				page=1;
				$('.all_shop_lists').html('');
				status1=1;
				openShop(status1,page);
			});
			// 已认领点击
			mui('.mui-content').on('tap','.claimed_info',function(e){
				page=1;
				$('.all_shop_lists').html('');
				status1=2;
				openShop(status1,page);

			});

			mui('.mui-content').on('tap','.claim_info',function(e){
				var store_id=$(this).parents('.mui-card').data('id');
				console.log('store_id', store_id);
				openWindow({
					url:'claim_store_add.html?store_id='+store_id,
					id:'claim_store_add'
				});
			});
			function pageShowFunc(){
				location.reload(true);
			}


			
		</script>
	</body>

</html>
