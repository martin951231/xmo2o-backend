var imgHtml=function(){
	laytpl(document.getElementById('image').innerHTML).render({}, function(html){
		$('#file_pic  .mui-content').html(html);
		$("#clipArea").css({
			'width':$(window).width(),
			'height':$(window).height()-45
		})
		
		pic_lens = $('.mui-pull-left.delate_photo').size();
		$('.showImg').width(111*(pic_lens + 1)+105);

		if(common.checkAndroidApp()){
			$("#fileImage").hide().remove()
			androidImg(true)
			$(".show_modal").hide()

		}else if(common.checkIosApp()){
			$("#fileImage").hide().remove()
			androidImg(false)
			$(".show_modal").hide()
		}
		else{
			//cropImg()
			catImg()
			$(".show_modal").hide()
		}

	});
}

var catImg=function(){
	if(common.checkWeixin()){
		$('#fileImage').off('click').on('click',function(e){
			if(pic_lens<5){
				wx.chooseImage({
					count: 1, // 默认9
					success: function (res) {
						var localIds = res.localIds; // 返回选定照片的本地ID列表，localId可以作为img标签的src属性显示图片
						wx.uploadImage({
							localId: localIds[0], // 需要上传的图片的本地ID，由chooseImage接口获得
							isShowProgressTips: 1, // 默认为1，显示进度提示
							success: function (res) {
								var serverId = res.serverId; // 返回图片的服务器端ID
								common.http('WapMerchant&a=ajaxGetWxImg',{'serverId':serverId, 'picType':'foodshop_goods'},function(data){
									var str = '<div class="mui-pull-left delate_photo" data-url=' + data.title+ ' ><img src=' + data.url + ' data-preview-src="" data-preview-group="1"/><i></i></div>';
									$('.showImg').append(str);
									
									pic_lens++;
									$('.showImg').width(111*(pic_lens + 1)+105);
									console.log('pic_lens', pic_lens);
								});
							},
							fail: function(res){
								alert('微信上传组件返回：' + res.errMsg);
							}
						});
					},
					fail: function(res){
						alert('微信选择图片组件返回：' + res.errMsg);
					}
				});
			}else{
				mui.toast('最多只能上传5个图片');
			}
			return false;
		});
	}else{
		// 上传图片
		$('.up_img').off('change','input').on('change','input',function(e){ 
			console.log('开始点击上传图片');
			if(pic_lens<5){
				pic_lens++; 
				var imageFileObj = e.target.files[0]
				var reader = new FileReader();
				reader.readAsDataURL(imageFileObj);
				reader.onload = function () {
					var getRes = reader.result;
					imgUpload(getRes);
				}
				$('.showImg').width(111*(pic_lens)+105);
			}else{
				mui.toast('最多只能上传5张图片');
			}
		});
	}
}

// 上传图片
function androidImg (type){
	$('.up_img').on('click', function (e,d) {
		var length = $('.showImg .delate_photo').length;
		if (pic_lens < 5) { 
			if(type){
				window.pigcmspackapp.uploadpic(2,requestImgUrl+'/appapi.php?c=WapMerchant&a=uploadPicNew','ceshi');

				var iosHref = window.btoa(requestImgUrl+"/appapi.php?c=WapMerchant&a=uploadPicNew");

function ceshi(path,url){
	var str = '<div class="mui-pull-left delate_photo" data-url=' + url+ ' ><img src=' + path + ' data-preview-src="" data-preview-group="1"/><i></i></div>';
	if (pic_lens < 5) {
		pic_lens++;
		$('.showImg').width(111*(pic_lens)+105);

	}
	$('.showImg').append(str);
	$('.motifyShade,.motify').hide();
}

var cropImg=function(){
	var console = window.console || { log: function () {} };
	function CropAvatar($element) {
		this.$container = $element;
		this.$avatarForm = this.$container.parent();
		this.$avatarSrc = this.$container.find('.avatar-src');
		this.$avatarData = this.$container.find('.avatar-data');
		this.$avatarHeight = this.$container.find('.height');
		this.$avatarWidth = this.$container.find('.width');
		this.$avatarY = this.$container.find('.y');
		this.$avatarX = this.$container.find('.x');
		this.$avatarRoute = this.$container.find('.rotate');
		this.$avatarInput = this.$container.siblings("#shop1").find('#fileImage');
		this.$avatarSave = this.$container.find('.avatar-save');
		this.$avatarSubmit = this.$container.find('#clipBtn');
		this.$avatarBtns = this.$container.find('#rotaBtn');
		this.$clone = this.$container.find('#clone');
		this.$zoom=this.$container.find('.zoom');
		this.$avatarWrapper = this.$container.find('#clipArea');
		this.index=0;
		this.init();
	}
	CropAvatar.prototype = {
		constructor: CropAvatar,
		support: {
			fileList: !!$('<input type="file">').prop('files'),
			blobURLs: !!window.URL && URL.createObjectURL,
			formData: !!window.FormData
		},
		init: function () {
			this.support.datauri = this.support.fileList && this.support.blobURLs;

			if (!this.support.formData) {
				this.initIframe();
			}

			this.addListener();
		},
		addListener: function () {
			this.$avatarInput.on('change', $.proxy(this.change, this));
			this.$avatarSubmit.on('click', $.proxy(this.submit, this));
			this.$avatarBtns.on('click', $.proxy(this.rotate, this));
			this.$zoom.on('click', $.proxy(this.zoom, this));

		},
		initIframe: function () {
			var target = 'upload-iframe-' + (new Date()).getTime(),
					$iframe = $('<iframe>').attr({
						name: target,
						src: ''
					}),
					_this = this;

			// Ready ifrmae
			$iframe.one('load', function () {

				// respond response
				$iframe.on('load', function () {
					var data;

					try {
						data = $(this).contents().find('body').text();
					} catch (e) {
						console.log(e.message);
					}

					if (data) {
						try {
							data = $.parseJSON(data);
						} catch (e) {
							console.log(e.message);
						}

						_this.submitDone(data);
					} else {
						_this.submitFail('Image upload failed!');
					}

					_this.submitEnd();

				});
			});

			this.$iframe = $iframe;
			this.$avatarForm.attr('target', target).after($iframe.hide());
		},
		change: function () {
			var files, file;
			var _this=this;
			if (pic_lens < 5) {
				if (this.support.datauri) {

					files = this.$avatarInput.prop('files');

					if (files.length > 0) {
						file = files[0];

						if (this.isImageFile(file)) {
							if (this.url) {
								URL.revokeObjectURL(this.url); // Revoke the old one
							}
							this.url = URL.createObjectURL(file);

							setting.sing_up='#sign_up=1';
							var wh=$(window).width();
							$("#shop1").animate({'left':-wh+'px'},200);
							setting.chackchange=false;
							location.hash=setting.sing_up;
							$('#file_pic').animate({'left':'0px'},200,function(){
								$("#shop1").hide()
								$('#file_pic').show();
								setting.hashchange=1
								setting.chackchange=true;
								_this.startCropper();

							})
						}else{

						}
					}
				} else {
					$("#fileImage").val("")
				}

			} else {
				$("#fileImage").val("")
				mui.toast('最多只能上传5张图片');
			}

		},
		submit: function () {
			/* if (!this.$avatarSrc.val() && !this.$avatarInput.val()) {
			 return false;
			 }*/
			this.$avatarForm.find("input[name=store_id]").val(store_id)
			if (this.support.formData) {
				$(".modeal").show();
				this.index = layer.open({type:2,shade:false,shadeClose:false});
				this.ajaxUpload();
				return false;
			}
		},
		rotate: function (e) {
			var data;

			}

		},
		zoom: function (e) {
			var data;
			data = $(e.target).data();

			if (data.method) {
				this.$img.cropper(data.method, data.option);
			}

		},
		isImageFile: function (file) {
			if (file.type) {
				return /^image\/\w+$/.test(file.type);
			} else {
				return /\.(jpg|jpeg|png|gif)$/.test(file);
			}
		},
		startCropper: function () {
			var _this = this;
			this.$img = $('<img src="' + this.url + '">');

			this.$img.cropper({
				aspectRatio: w/h,
				strict: true,
				zoomOnTouch:true,
				modal:false,
				guides:true,
				background:true,
				autoCrop:true,
				scalable:true,
				zoomable:true,
				wheelZoomRatio:true,
				cropBoxMovable:true,
				cropBoxResizable:true,

				minCropBoxHeight:h*0.8,
				maxCropBoxWidth:w,
				maxCropBoxHeight:h,
				crop: function (data) {
					var json = [
						'{"x":' + data.x,
						'"y":' + data.y,
						'"height":' + data.height,
						'"width":' + data.width,
						'"rotate":' + data.rotate + '}'
					].join();
					console.log(data)

					_this.$avatarHeight.val(data.height)
					_this.$avatarWidth.val(data.width)
					_this.$avatarY.val(data.y)
					_this.$avatarX.val(data.x)
					_this.$avatarRoute.val(data.rotate)

				},

				}
			});
