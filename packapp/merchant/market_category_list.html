<style>
	.mui-card {
		width: 47%;
		float: left;
		min-height: 330px;
	}
	.mui-card img{
		width: 100%;
		object-fit: cover;
	}
	.allGoods .run {
		background: #fff;
	}
	.allGoods .clear:after {
		content: " ";
		display: block;
		clear: both;
	}
	.allGoods .run .runItem {
		width: 49.8%;
		text-align: center;
	}
	.allGoods .add {
		border-right: 1px solid #f1f1f1;
	}
	.allGoods .ft {
		float: left;
	}
	.allGoods .adds .itemTop, .adds .itemBottom {
		padding-bottom: 0;
	}
	.allGoods .itemTop {
		border-bottom: 1px solid #f1f1f1;
	}
	.allGoods .adds ul {
		margin: 0;
	}
	.allGoods .adds ul li img {
		margin: 0!important;
		width: 100%!important;
		height: 100%!important;
	}
	.tip_adver {
		min-height: 26px;
	}
	.tip_adver img{
		width: 100%;
		height: 100%;
	}
	.vip {
		display: inline-block;
		width: 18px;height: 18px;
		background: url(./images/vip.png) center no-repeat;
		background-size: contain;
		vertical-align: middle;
		position: relative;
		top: -3px;
		margin: 0;
	}
	.vip_price {
		color: #FD1946;
		font-weight: 600;
		font-size: 16px;
		line-height: 18px;
	}
	.currency_txt {
		font-size: 10px;
		color: #999c9e;
	}
	.virtual_msg {
		clear: both;
		width: 100%;
		text-align: center;
		padding: 10px;
		position: absolute;
		bottom: 0px;
	}
	.virtual_msg .virtual_push {
		background: #ffa200;
		color: white;
		padding: 5px 15px;
		border-radius: 15px;
	}
</style>

<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
var cat_fid = $.getUrlParam('cat_fid');
var cat_id = $.getUrlParam('cat_id');




var pindex=1;
function market_index(page){
	common.http('Merchantapp&a=market_index',{'ticket':ticket,'client':client,'page':page,'cat_fid':cat_fid,'cat_id':cat_id},function(data){
		console.log('data',data);
		
		if (data.category) {
			var txt = '';
			if (data.category.fid_info) {
				txt += data.category.fid_info.name;
			}
			if (txt) {
				txt += '-'+data.category.name;
			} else {
				txt += data.category.name;
			}
			document.title = txt;
			$('.title_info').html(txt);
		}
			
		if (data.orders.length!=0) {
			data.orders.length<=19&&$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();

			laytpl(document.getElementById('pluscardLists').innerHTML).render(data.orders, function(html){
				$('.alls').append(html);
                setTimeout(function () {
                    if (data.is_integral_mall!=1) {
                        $('.mui-card').css('min-height','340px');
                    }
                },800)
			});

			if(data.orders.length>19){
				var flag = false;
				$(window).scroll(function(e) {
				    e.stopPropagation();
				    if(flag){
				      //数据加载中
				      return false;
				    }
				    //上拉加载
				    if ($(document).scrollTop() == $(document).height() - $(window).height()) {
				    	$('.pullup1').hide();
				    	$('.loading1').show();
				    	flag = true;
				        pindex++;
                        market_index(pindex);
				    }
				});
			}
		}else{
			$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
		}
	});
}

market_index(1);
mui('.mui-content').on('tap','.cli_status',function(e){
	var status=0;
	var me=this;
	var appoint_id=$(this).parents('.mui-card').attr('data-id');
	if($(this).text()=="开启"){
		status=1;
		$(this).text('关闭').removeClass('open').addClass('close');
	}else{
		status=0;
		$(this).text('开启').removeClass('close').addClass('open');
	}
	common.http('Merchantapp&a=appoint_status',{'ticket':ticket,'client':client,'appoint_id':appoint_id,'appoint_status':status},function(data){
		console.log(data);
		if(data.length==0){
			mui.toast('操作成功');
		}
	});

});
// 点击跳转
mui('.header_adver_img').on('tap','.link-url',function(e){
    window.location.href = $(this).data('url');
});

//进入购买详情页面
mui('.mui-content').on('tap','.buy_detail_btn',function(e){

	openWindow({

// 进入虚拟批发页面
mui('.mui-content').on('tap','.virtual_msg .virtual_push',function(e){
    var goods_id=$(this).attr('data-id');
    openWindow({
        url:'market_virtual_push.html?goods_id='+goods_id+'&type=virtual_market',
        id:'market_virtual_push'
    });
});
</script>
