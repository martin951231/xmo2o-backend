<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>我的商家佣金记录</title>
    <link href="css/mui.css" rel="stylesheet"/>
     <link rel="stylesheet" type="text/css" href="css/app.css" />
		<link href="css/mui.picker.css" rel="stylesheet" />
		<link href="css/mui.poppicker.css" rel="stylesheet" />
		<link href="css/pigcms.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/my_spread_merchant_list.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	    <h1 class="mui-title"><L_>我的商家佣金记录</L_></h1>
	</header>
	<div class="mui-content">


		<div class="allGoods" style="padding: 0;">
			<div class="alls" id="data">
				
			</div>
			
			<div class="pullup1" style="display:none;">上拉加载更多...</div>
			<div class="loading1" style="display:none;"><img src="images/xubox_loading2.gif" alt=""><L_>正在加载</L_></div>
		</div>
	  	
	</div>
	 <!-- 上拉刷新 -->
	<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/mui.picker.js"></script> 
<script src="js/mui.dtpicker.js"></script>
<script src="js/mui.poppicker.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<script id="pluscardLists" type="text/html">
	{{# for(var i = 0, len = d.length; i < len; i++){ }}
		<div class="mui-card" data-id="{{ d[i].group_id }}">
	    	<div class="mui-card-content">
	    		<a href="javascript:void(0);" class="group_click">
		    		<ul class="mui-pull-left" style="width: 80%;">
		    			<li><span style="white-space: inherit;">{{ d[i].desc }}</span></li>
						<li><span>{{ d[i].use_time }}</span></li>
		    		</ul>

					<ul class="mui-pull-right spread_info" style="width: 20%;">
						<li style="color: red;">+ {{ L_('￥') }}{{ d[i].money }}</li>
					</ul>
	    		</a>
	    	</div>
	    </div>
	{{# } }}
</script>
<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);

var pindex=1;
var searchtype='name';
var seachVal='';
function addGoods(page,key,type){
	common.http('Merchantapp&a=spread_merchant_money',{'ticket':ticket,'client':client,'pindex':page,'keyword':key,'searchtype':type},function(data){
		console.log('data', data);
		if (data.merchant_list.length!=0) {
			data.merchant_list.length<=9&&$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
			laytpl(document.getElementById('pluscardLists').innerHTML).render(data.merchant_list, function(html){
				$('.alls').append(html);
			});
			if(data.merchant_list.length>9){
				var flag = false;
				$(window).scroll(function(e) {
				    e.stopPropagation();
				    if(flag){
				      //数据加载中
				      return false;
				    }
				    //上拉加载
				    if ($(document).scrollTop() == $(document).height() - $(window).height()) {
				    	$('.pullup1').hide();
				    	$('.loading1').show();
				    	flag = true;
				        pindex++;
				      addGoods(pindex,seachVal,searchtype);
				    }
				});
			}
		}else{
			$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
		}
	});
}

addGoods(1,'',searchtype);


</script>
</body>
</html>
