												<span style="padding: 0;">
													<img src="{{ d.first_cat.son_list[j]['icon_path'] }}" title="{{ d.first_cat.son_list[j]['name'] }}" class="sub_cat_logo" style="width: 70px; height: 70px;">
												</span>
											</div>

											<p class=" pd0 align_center"> {{ d.first_cat.son_list[j]['name'] }}</p>

	<script type="text/javascript" charset="utf-8">
		mui.init();
		var ticket = common.getCache('ticket');
		var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0);
		var type = 0;//根据用户是否点击批量管理按钮修改样式
		var fls = 0;
		var f_class = 0;
		var mr = true;
		//初次加载页面渲染三级分类
		getGoodsList();
		function getGoodsList() {
			let categoryId = window.sessionStorage.getItem('segmentedControlsId') || ''
			common.http('Merchantapp&a=category', { 'ticket': ticket, 'client': client,id: categoryId }, function (data) {
				if (data.category_list.length == 0) {
					mui.toast('还没有分类哦,快去添加吧');
					$('.all_checkbox').hide();
				} else {
					f_class = 1;
				}
				laytpl(document.getElementById('classLists').innerHTML).render(data, function (html) {
					$('.classHtml').html(html);
					$("#segmentedControls dl dd .one").each(function(index,item){
						let id = $(item).parent().attr("data-id")
						if(id && categoryId == id){
							$(item).parent().addClass('active')
							getGoods(id);
						}else{
							$(item).parent().removeClass('active')
							if(index == 0 && !categoryId){
								$(item).parent().addClass('active')
							}
						}
					})
				});
				laytpl(document.getElementById('goodsHtml').innerHTML).render(data, function (html) {
					$('.goods_news').html(html);
				});
				// if(data.category_list.length>0){
				// 	$('.all_change_show>p').text(data.category_list[0].name);
				// }
			});
		}


		//进入购买详情页面
		mui('.mui-content').on('tap', '.buy_list', function (e) {
			e.preventDefault()
			e.stopPropagation()
			var cat_fid = $(this).attr('data-cat_fid');
			var cat_id = $(this).attr('data-cat_id');
			openWindow({
				url: 'market_category_list.html?cat_fid=' + cat_fid + '&cat_id=' + cat_id,
				id: 'market_category_list'
			});
		});




		//一级列表点击
		mui('#segmentedControls').on('tap', 'dl dd .one', function (e) {
			$(this).parent().addClass('active').siblings('dd').removeClass('active');
			$(this).parent().find('ul').removeClass('hidden');
			$(this).parent().siblings('dd').find('ul li').removeClass('active');
			$(this).parent().siblings('dd').find('ul li div p').removeClass('active');
			$(this).parent().siblings('dd').find('ul').addClass('hidden');
			var firstId = $(this).parent().attr('data-id');
			window.sessionStorage.setItem('segmentedControlsId',firstId)
			getGoods(firstId);
		});

		function getGoods(firstId){
			common.http('Merchantapp&a=two_category', { 'ticket': ticket, 'client': client, 'id': firstId }, function (data) {
				console.log('data', data);
				laytpl(document.getElementById('goodsHtml').innerHTML).render(data, function (html) {
					$('.goods_news').html(html);
					if (mr) {
						if ($(".mr38").length > 0) {
							$(".mr38").css("margin-left", '0px')
						}
					} else {
						if ($(".mr38").length > 0) {
							$(".mr38").css("margin-left", '38px')
						}
					}

				});
			});
		}
		var chuHeight = '';
		if (common.checkIosApp()) {
			chuHeight = $(window).height() - 158;

		} else {
			chuHeight = $(window).height() - 138;
		}


		$('.mui-col-xs-3').css('min-height', chuHeight);
		$('.mui-col-xs-3 .classHtml').css('height', chuHeight);
		$('.mui-col-xs-9').css('min-height', chuHeight);






		//点击搜索框
		$('.search').on('tap', function (e) {
			openWindow({
				url: 'market_search.html',
				id: 'search'
			});
		});

		function pageShowFunc() {
			location.reload(true);
		}
	</script>
