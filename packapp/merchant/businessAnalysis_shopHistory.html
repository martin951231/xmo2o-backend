<body style="background: #fff;">
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back"></div>
		<h1 class="mui-title"><L_>历史数据概览</L_></h1>
	</header> 
	<div class="mui-content"> 
		<!-- 外卖 -->
		<div class="shop_analysis">
			<div class="top_xialaSelect" style="margin: 0 20px;"  > 
				<a href="#selectStroe">全部店铺</a>
			</div>
			<h3 class="shishi_til shishi_til_history">外卖历史数据概览</h3>
			<ul class="tab_conEcharts tab_conEchartsHistory">
				<li class="cur" data-type="1"><span>昨天</span></li>
				<li  data-type="2"><span>近7日</span></li> 
				<li  data-type="3"><span>近30天</span></li>
				<li  data-type="4"><span>自定义</span></li>
			</ul>
			
			
			<div>
			   <ul class="select_time">
				   <li style="width: 40%;"> <button id='startTime' data-options='{"type":"date","beginYear":2014}' class="btn mui-btn mui-btn-block">  </button>
			           <div id='startResult' class="ui-alert"> </div></li> 
					<li style="width: 20%;">至</li>
					<li style="width: 40%;"> <button id='endTime' data-options='{"type":"date","beginYear":2014}' class="btn mui-btn mui-btn-block">  </button>
				     <div id='endResult' class="ui-alert"> </div></li>
					<div class="clear"></div> 
			   </ul> 
				<ul class="ul_list_Analysis historyData"> 
					<div class="clear"></div>
				</ul> 
			</div> 
			
		</div>
		<!-- 外卖 end -->
		
		<div id="selectStroe" class="mui-popover mui-popover-action mui-popover-bottom"> 
			<ul class="mui-table-view ul_selectStore"> 
			</ul>  
			<ul class="mui-table-view" style="margin: 0; border-radius: 0;">
				<li class="mui-table-view-cell" >
					<a href="#picture"><b style="color: #999;">确定</b></a>
				</li> 
			</ul>
			
		</div>
