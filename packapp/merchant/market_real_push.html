<script>

    mui('.mui-scroll-wrapper').scroll({
        deceleration: 0.0005 //flick 减速系数，系数越大，滚动速度越慢，滚动距离越小，默认值0.0006
    });
    var pic_lens=0;
    var wap_pic_lens=0;


    function buy_num_keyup(val,obj,stock_num){
        if(parseInt(val) > parseInt(stock_num)){
            $(obj).val(stock_num);
            $(obj).next("span").css("display", "");
        }else{
            $(obj).next("span").css("display", "none");
        }
    }
    //点击选择白名单
    mui('body').on('tap','.give_white_list',function(e){
        openWindow({
            url:'market_capture_merchant.html?goods_id='+goods_id,
            id:'market_capture_merchant'
        });
    });


    // 点击进入详情
    mui('body').on('tap','.market_order',function(){
        console.log('goods_id',goods_id);
        openWindow({
            url:'my_sell_wholesale_order.html?goods_id='+goods_id,
            id:'my_sell_wholesale_order'
        });
    });
    // 点击进入编辑
    mui('body').on('tap','.edit_market_goods',function(){
        var content = $('#content').val();
		$('input[name="goods_content"]').val(content);
        var msg = $('#myform').serialize();
        common.http('Merchantapp&a=integral_mall_goods_save', msg, function (data) {
           if (data) {
               openWindow({
                   url:'integral_mall_index.html',
                   id:'integral_mall_index'
               });
		   }
		})
    });


    // 渲染数据
    common.http('Merchantapp&a=integral_mall_goods_info', {
        'ticket': ticket,
        'client': client,
        'goods_id': goods_id,
        'order_id': order_id,
        'type': type
    }, function (data) {
        console.log('data',data);
        data.ticket = ticket;
        data.client = client;
        data.goods_id = goods_id;
        data['Device-Id'] = common.getDeviceId();
        data.app_version = common.getVersion();
        data.now_lang = now_lang;

        if (data) {
            if (data.now_goods && data.now_goods.pc_pic_list) {
                pic_lens = data.now_goods.pc_pic_list.length;
            }
            if (data.now_goods && data.now_goods.wap_pic_list) {
                wap_pic_lens = data.now_goods.wap_pic_list.length;
            }
            Currency_txt = data.config['Currency_txt'];
            laytpl(document.getElementById('pluscardLists').innerHTML).render(data, function (html) {
                $('.allHtml').html(html);
                setTimeout(function () {
                    reload_msg();
                },500);
            });
            var category_list = data.cate_list_json;
            if (category_list != undefined) {
                var father_category_list = $.parseJSON(category_list);
                var son_category_list = null, cat_fid = parseInt($('#choose_category').attr('cat_fid')), cat_id = parseInt($('#choose_category').attr('cat_id'));
                var area_dom = '<select id="cat_fid" name="cat_fid" class="fr" style="margin-right:10px;">';
                if (cat_fid == 0) {
                    area_dom += '<option value="0" selected="selected" >'+L_("选择分类")+'</option>';
                } else {
                    area_dom += '<option value="0">'+L_("选择分类")+'</option>';
                }
                $.each(father_category_list, function(i, item){
                    if (item.cat_id == cat_fid) {
                        if (item.son_list != undefined) {
                            son_category_list = item.son_list;
                            show_son_category(item.son_list, cat_id)
                        }
                        area_dom += '<option value="'+item.cat_id+'" selected="selected" >'+item.cat_name+'</option>';
                    } else {
                        area_dom += '<option value="'+item.cat_id+'">'+item.cat_name+'</option>';
                    }
                });
                area_dom+= '</select>';
                $('#choose_category').prepend(area_dom);
            }
            $('#cat_fid').change(function(){
                var cat_fid = $(this).val(), father_category_list = $.parseJSON(category_list);
                var this_son_list = null;
                $.each(father_category_list, function(i, item){
                    if (item.cat_id == cat_fid) {
                        if (item.son_list != undefined) {
                            this_son_list = item.son_list;
                            show_son_category(item.son_list, 0);
                        }
                    }
                });
                if (this_son_list == null) {
                    $('.sortproperties').remove();
                    if (document.getElementById('cat_id')) {
                        $('#cat_id').replaceWith('');
                    } else if(document.getElementById('cat_fid')) {
                        $('#cat_fid').after('');
                    } else {
                        $('#choose_category').prepend('');
                    }
                }
            });

        }
    });

    function show_son_category(son_category_list, cat_id)
    {
        var area_dom = '<select id="cat_id" name="cat_id" class="fr" style="margin-right:10px;">', now_cat_id = 0, isFirst = 0;
        $.each(son_category_list, function(i, item){
            if (cat_id == 0) {
                if (isFirst == 0) {
                    now_cat_id = item.cat_id;
                    area_dom += '<option value="'+item.cat_id+'" selected="selected" >'+item.cat_name+'</option>';
                } else {
                    area_dom += '<option value="'+item.cat_id+'">'+item.cat_name+'</option>';
                }
                isFirst ++;
            } else {
                if (item.cat_id == cat_id) {
                    now_cat_id = item.cat_id;
                    area_dom += '<option value="'+item.cat_id+'" selected="selected" >'+item.cat_name+'</option>';
                } else {
                    area_dom += '<option value="'+item.cat_id+'">'+item.cat_name+'</option>';
                }
            }
        });
        area_dom += '</select>';
        if (document.getElementById('cat_id')) {
            $('#cat_id').replaceWith(area_dom);
        } else if(document.getElementById('cat_fid')) {
            $('#cat_fid').after(area_dom);
        } else {
            $('#choose_category').prepend(area_dom);
        }
    }

    function reload_msg() {
        // 切换选择
        mui('body').on('tap','.is_pick_click',function(){
            var is_pick = $(this).val();
            if (is_pick==1) {
                $('.pick_title').css('border-bottom','none');

                $('.pick_title').css('border-bottom','#f1f1f1 1px solid');

            }
        });
        // 切换选择
        mui('body').on('tap','.is_add_white_list_click',function(){
            var is_add_white_list = $(this).val();
            if (is_add_white_list==1) {
                $('.white_list_title').css('border-bottom','none');
                $('.white_list_content').show();
            } else {
                $('.white_list_title').css('border-bottom','#f1f1f1 1px solid');
                $('.white_list_content').hide();
            }
        });
        $('select[name="express_template_id"]').change(function(){
            var val=$(this).val();
            var is_freight=$('.express_template_is_freight_' + val).val();
            var spec=$(this).data('spec');
            console.log('val', val);
            console.log('is_freight', is_freight);
            console.log('spec', spec);
            if (spec) {
                if (is_freight==0) {
                    $('.goods_weight_spec').hide();
                    $('.goods_volume_spec').hide();
                } else if (is_freight==1) {
                    $('.goods_weight_spec').show();
                    $('.goods_volume_spec').hide();
                } else if (is_freight==2) {
                    $('.goods_weight_spec').hide();
                    $('.goods_volume_spec').show();
                } else if (is_freight==3) {
                    $('.goods_weight_spec').show();
                    $('.goods_volume_spec').show();
                } else if (val==0) {
                    $('.goods_weight_spec').hide();
                    $('.goods_volume_spec').hide();
                }
            } else if (is_freight==0) {
                $('.goods_weight').hide();
                $('.goods_volume').hide();
            } else if (is_freight==1) {
                $('.goods_weight').show();
                $('.goods_volume').hide();
            } else if (is_freight==2) {
                $('.goods_weight').hide();
                $('.goods_volume').show();
            } else if (is_freight==3) {
                $('.goods_weight').show();
                $('.goods_volume').show();
            } else if (val==0) {
                $('.goods_weight').hide();
                $('.goods_volume').hide();
            }
        });
        $('select[name="express_template_id"]').change();


        $("#add_properties").click(function(){
            var t = '<div class="question_box properties"><p class="question_info"><span>'+L_("批发满 ")+'</span><input type="text" class="txt properties_name" value="" name="nums[]" style="width:50px"/><span>'+L_(" 件，享受 ")+'</span><input type="text" class="txt properties_num" value="" name="discounts[]" style="width:50px"/>'+L_("折优惠")+
                '<a href="javascript:;" class="box_del">'+L_("删除")+'</a></p></div>';
            $(".add_properties").before(t);
        });



        if(common.checkAndroidApp()){
            $("#fileImage").hide().remove()
            androidImg(true);

        }else if(common.checkIosApp()){
            $("#fileImage").hide().remove();

        }
        else{
            imgUpload();
        }

    function androidImg (type){
        $('.up_img_pc').on('click', function (e,d) {

                if(type){
                    window.pigcmspackapp.uploadpic(upload_pic,requestImgUrl+'/appapi.php?c=Merchantapp&a=upload_market_image&path=goods','ceshi_pc');

                    var iosHref = window.btoa(requestImgUrl+"/appapi.php?c=Merchantapp&a=upload_market_image&path=goods");

                    var datas=upload_pic+'/'+iosHref
                    common.iosFunction('upload_pic/'+datas+'/ceshi_pc', {name:'upload_pic', scale: upload_pic, upload_url:iosHref, callback:'ceshi_pc'});

                }
            } else {
                mui.toast('最多只能上传5张图片');
            }

        });

                    var iosHref = window.btoa(requestImgUrl+"/appapi.php?c=Merchantapp&a=upload_market_image&path=goods");

                    common.iosFunction('upload_pic/'+datas+'/ceshi_wap', {name:'upload_pic', scale: upload_pic, upload_url:iosHref, callback:'ceshi_wap'});

                }
            } else {
                mui.toast('最多只能上传5张图片');
            }

        });
    }

    function ceshi_wap(path,url){
        wap_pic_lens++;

    function imgUpload(){
        $('.up_img_wap').off('change','#wap_fileImage').on('change','#wap_fileImage',function(e){
            console.log('up_img_wap');
            var index = layer.open({type:2,shade:false,shadeClose:false});
            var fullPath=window.document.location.href;
            var pathName=window.document.location.pathname;
            var pos=fullPath.indexOf(pathName);
            var localhostPath=fullPath.substring(0,pos);
            var post_url = localhostPath+'/appapi.php?c=Merchantapp&a=upload_market_image&path=goods';
            $.ajaxFileUpload({
                url:post_url,
                secureuri:false,
                fileElementId:'wap_fileImage',
                dataType: 'json',
                success: function(data){
                    wap_pic_lens++;
                    var str = '<img class="fl" style="width: 24%;height: 57px;margin:0 1% 2px 0;" src="'+data.result.title+'"/><input type="hidden" name="wap_pic[]" value="'+data.result.url+'"/>';
                    $('.wap_photo').append(str);
                    layer.close(index);
                }
            });
        });
        $('.up_img_pc').off('change','#pc_fileImage').on('change','#pc_fileImage',function(e){
            console.log('up_img_pc');
            var index = layer.open({type:2,shade:false,shadeClose:false});
            var fullPath=window.document.location.href;
            var pathName=window.document.location.pathname;
            var pos=fullPath.indexOf(pathName);
            var localhostPath=fullPath.substring(0,pos);
            var post_url = localhostPath+'/appapi.php?c=Merchantapp&a=upload_market_image&path=goods';
            $.ajaxFileUpload({
                url:post_url,
                secureuri:false,
                fileElementId:'pc_fileImage',
                dataType: 'json',
                success: function(data){
					pic_lens++;
                    var str = '<img class="fl" style="width: 24%;height: 57px;margin:0 1% 2px 0;" src="'+data.result.title+'"/><input type="hidden" name="pc_pic[]" value="'+data.result.url+'"/>';
                    $('.pc_photo').append(str);
                    layer.close(index);
                }
            });
        });
    }
