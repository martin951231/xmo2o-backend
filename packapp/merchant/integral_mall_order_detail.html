			top: -3px;
			margin: 0;

			color: #FD1946;
			font-weight: 600;
			font-size: 16px;
			line-height: 18px;

			font-size: 10px;
			color: #999c9e;
		}


		.write_info li#li_delivery {
			margin-top: 10px;
			background: white;
		}

		}
		.write_info li a {

			text-decoration: none;
		}

			color: #666;

		#li_delivery i {
			display: inline-block;
			width: 6px;
			height: 11px;
			background: url(images/33-1_03.png) center no-repeat;
			background-size: contain;
			margin-right: 10px;
		}
		#li_delivery strong, b {
			font-weight: normal;
		}
		.w100 {
			width: 100%;
		}




		.spec_list .flex {
			display: flex;
		}
		.spec_list .flex_grow {
			flex-grow: 1;
			text-align: center
		}

		.spec_list .spec_val_name {
			padding: 1px 0;
		}
		.spec_list .list_spec_name {
			font-size: 14px;
			line-height: 22px;
			border-radius: 5px;
			padding: 2px 5px;
			margin-top: 2px;
			color: #fff;
			background: #f23030;
		}
		.spec_list .spec_val_name div {
			font-size: 14px;
			line-height: 22px;
			color: #fff;
			background: #f23030;
		}
		.spec_list .spec_price {
			color: #ff4d45;
			width: 100%;
		}
		.right {
			float: right;
		}
		.clr {
			zoom: 1;
		}
		.spec_buy_num .wrap .plus a {
			width: 30px;
			float: left;
			height: 28px;
			border: #e5e5e5 1px solid;
			text-align: center;
			color: #333333;
			line-height: 28px;
			font-size: 20px;
			font-family: "Arial";
		}
		.spec_buy_num .wrap .plus input {
			width: 65px;
			text-align: center;
			float: left;
			border: #e5e5e5 1px solid;
			border-left: none;
			border-right: none;
			height: 28px;
			font-size: 14px;
			border-radius: 0px;
		}

		.normal .wrap .plus a {
			width: 30px;
			float: left;
			height: 28px;
			border: #e5e5e5 1px solid;
			text-align: center;
			color: #333333;
			line-height: 28px;
			font-size: 20px;
			font-family: "Arial";
		}
		.normal .wrap .plus input {
			width: 50px;
			text-align: center;
			float: left;
			border: #e5e5e5 1px solid;
			border-left: none;
			border-right: none;
			height: 28px;
			font-size: 14px;
			border-radius: 0px;
		}
		.normal .right {
			float: right;
		}
	</style>
	<body>
		<header class="mui-bar mui-bar-nav">
		    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
		    <h1 class="mui-title"><span class="market"><L_>积分商城</L_></span><L_>订单详情</L_></h1>
		</header>
		<div class="mui-content">
			<section class="g_details allHtml mg_60">

			</section>
		</div>
		<nav class="plus_class">
			<div>
				<a href="javascript:;" class="in_pick_store"><L_>确认自提</L_></a>
				<a href="javascript:;" class="edit_plus"><L_>发货</L_></a>
			</div>

		</nav>

		<!--发货-->
		<div id="middlePopover" class="mui-popover">
			<div class="mui-card">
				<!--页眉，放置标题-->
				<div class="mui-card-header" style="padding-left: 15px;position: fixed;width: 90%;z-index: 1000;">
					<p><L_>请填写快递信息</L_><p> <sub class="mui-pull-right"></sub>
				</div>
				<!--内容区-->
				<div class="mui-scroll-wrapper">
					<div class="mui-scroll">
						<div class="write_info" style="margin-top: 45px;">
							<div class="mui-card-footer mui-clearfix freight mui-card-footers ">
								<p class='mui-input-row'>
									<label class="left_style " style='line-height:inherit;width:24%;padding:15px 0;'><a href='javascript:;' class='express_choose'><L_>快递公司</L_> <i></i></a></label>
									<b id="freight" class="mui-clearfix">
										<span id="" class=''><L_>请选择快递公司</L_></span>
										<i class="mui-pull-right"></i>
										<input type='hidden' id='freight_template' class='freight_template' name='freight_template' value=''/>
									</b>
								</p>
							</div>
							<div class="mui-card-content">
								<span class="left_style"><L_>快递单号</L_></span>
								<input class="L_P express_number" type="text" name="express_number" value="" placeholder="请输入快递单号"/>
							</div>

							<div class="mui-card-content ">
								<span class="left_style"><L_>备注说明</L_></span>
								<textarea name="sell_note" class="sell_note input" rows="5" cols="2" placeholder="请输入备注说明"></textarea>
							</div>
						</div>
						<div class="save_btn">
							<div style="margin-bottom: 0;">
								<button type="button" class="add_save"><i></i> 保存</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!--支付-->
		<div id="payPopover" class="mui-popover">
			<div class="mui-card">
				<!--页眉，放置标题-->
				<div class="mui-card-header" style="padding-left: 15px;position: fixed;width: 90%;z-index: 1000;">
					<p><L_>请填写相关信息</L_><p> <sub class="mui-pull-right"></sub>
				</div>
				<!--内容区-->
				<div class="mui-scroll-wrapper">
					<div class="mui-scroll">
						<div class="write_info" style="margin-top: 45px;">

							<div class="mui-card-content" style="margin-bottom: 20px;">
								<ul>
									<li id="li_delivery">
										<a class="link_a">
											<strong>
												<span class="showAddres address">请点击添加送货/自提地址</span><br>
												<span class="showName username"></span>
												<span class="showTel userphone"></span>
											</strong>
											<div><i class="ico_arrow"></i></div>
										</a>
									</li>
									<div><img class="w100" style="display: block;" src="./images/wxapp_addaddress.png"></div>
								</ul>
							</div>

							<div class="mui-card-content spec_list_info normal" style="padding: 15px 15px 0;">
								<!--<span class="left_style"><L_>本次批发数</L_></span>-->
								<!--<input class="buy_num" type="text" name="buy_num" data-stock_num="" value="" placeholder="请输入本次批发数"/>-->
								<span class="fl cas_left"><L_>数量</L_></span>
								<div class="wrap right" style="padding-right:20px">
									<div class="plus clr" style="position:relative;">
										<a href="javascript:void(0)" class="jian">-</a>
										<input class="buy_num" type="text" name="buy_num"/>
										<a href="javascript:void(0)" class="jia">+</a>
									</div>
								</div>
							</div>
							<div class="mui-card-content" style="clear: both;">
								<span class="left_style"><L_>商品总额</L_></span>
								<div class="totalMoney_info">
									<div class="money_content"></div>&nbsp;&nbsp;
									<div class="discount_content"></div>
								</div>
							</div>
							<div class="mui-card-content express_tip" style="clear: both;padding: 0  0 10px 0;">
								<span class="left_style"><L_>运费总额</L_></span>&nbsp;&nbsp;&nbsp;&nbsp;
								<span class="express_money">
									0&nbsp;&nbsp;
								</span>
							</div>
							<div class="mui-card-content express_tip" style="clear: both;padding: 0  0 15px 0;">
								<span class="express_msg"></span>
							</div>


							<div class="mui-card-content ">
								<span class="left_style"><L_>备注说明</L_></span>
								<textarea name="desc" class="desc input" rows="5" cols="2" placeholder="请输入备注说明"></textarea>
							</div>
						</div>
						<div class="save_btn"  style="padding: 20px 10%;">
							<div style="margin-bottom: 0;">
								<button type="button" class="add_save"><i></i> 保存</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="js/fastclick.js"></script>
		<script src="js/mui.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/mui.picker.js"></script>
		<script src="js/mui.dtpicker.js"></script>
		<script src="js/mui.poppicker.js"></script>
		<script src="js/jquery-1.9.1.min.js"></script>
		<script src="js/fastclick.js"></script>
		<script src="js/jRoll.js"></script>
		<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/common.js"></script>


		<script id="pluscardLists" type="text/html">
			{{# var data=d; }}
			{{# console.log(data); }}
			<div class="commod detail_list">
				<input type="hidden" class="limit_num" data-min_unit="{{d.now_order.min_unit}}" data-min_num="{{d.now_order['min_num']}}" data-stock_num="{{d.now_order.stock_num}}"/>
				<div class="top clr">
					<h2 class="fl">{{L_('商品信息')}}</h2>
				</div>
				<div class="commod_list">
					<div class="img fl" style="width: 100px;height: 100px;">
						<img src="{{ data.now_order.wap_image }}">
					</div>
					<div class="content" style="margin-left: 110px;height: 100px;">
						<h2>
							{{ data.now_order.goods_name }}
						</h2>
						<div class="clr price">
							<div>{{L_('总计积分')}}：{{ data.now_order.total_integral }}
							</div>
						</div>
						<div class="clr">
							<div class="fl total">共计：{{ data.config.Currency_symbol }}{{ data.now_order.total_money }}</div>
							<div class="state fr">
								<span class="ecc">{{ data.now_order.status_str }}</span>
							</div>
						</div>
					</div>
				</div>



				{{# if (data.now_order['spec_list']!='' && data.now_order['spec_value']['spec_list'] && data.choose_spe) { }}
				<div class="spec_info detail_list">
					<div class="top clr">
						<h2 class="fl">{{L_('规格信息')}}</h2>
					</div>
					<div class="user_list spec_list" style="border-bottom: #f1f1f1 1px solid;padding: 15px 10px;">
						{{# var choose_spe=data.choose_spe; }}
						{{# if (choose_spe) { }}
							<div class="flex" >
								<div class="list_spec_name flex spec_val_name" style="background: white;color: #0a0a0a;">
									{{# for(var l in data.now_order['spec_value']['spec_list']) { }}
									{{# if (data.now_order['spec_value']['spec_list'][l]) { }}
									<div style="background: white;color: #0a0a0a;">
										{{# if (l>0) { }}
										/
										{{# } }}
										{{data.now_order['spec_value']['spec_list'][l]['name']}}
									</div>
									{{# } }}
									{{# } }}
								</div>
								<div class="flex flex_grow">
									<div class="spec_price_single"  style="width: 100%;">
										{{L_('积分')}}
									</div>
								</div>

								<div class="flex spec_buy_money">
									<div class="spec_price right" style="color: #0a0a0a;">
										{{L_('数量')}}
									</div>
								</div>
							</div>
							<div class="flex" >
								<div class="list_spec_name flex spec_val_name">
									{{# for(var m in choose_spe['spec']) { }}
									{{# if (choose_spe['spec'][m]) { }}
									<div>
										{{# if (m>0) { }}
										/
										{{# } }}
										{{choose_spe['spec'][m]['spec_val_name']}}
									</div>
									{{# } }}
									{{# } }}
								</div>
								<div class="flex flex_grow">
									<div class="spec_price_single"  style="width: 100%;">
										{{choose_spe['payment_pure_integral']}}
									</div>
								</div>

								<div class="flex spec_buy_money">
									<div class="spec_price right">
										{{choose_spe['num']}}
									</div>
								</div>
							</div>
						{{# } }}
					</div>
				</div>
				{{# } }}




				<div class="buy detail_list">
                    <div class="top clr">
                        <h2 class="fl">{{L_('购买信息')}}</h2>
                    </div>
                    <div class="user_list">
                        <ul>

							{{# if (!data.choose_spe) { }}
								<li class="clr">
									<span class="fl">{{L_('积分')}}</span>
									<span class="fr">
										{{ data.now_order.payment_pure_integral }}
									</span>
								</li>
								<li class="clr">
									<span class="fl">{{L_('兑换数量')}}</span>
									<span class="fr">
										{{ data.now_order.num }}
									</span>
								</li>

							{{# } }}


							<li class="clr">
								<span class="fl">
									{{L_('收货人姓名')}}
								</span>
								<span class="fr">{{  data.now_order.username }}</span>
							</li>
							{{# if (data.now_order.is_pick_in_store>0) { }}
							<li class="clr">
								<span class="fl">
									{{L_('收货人电话')}}
								</span>
								<span class="fr blue callPhone" data-phone="{{ data.now_order.userphone }}">{{ data.now_order.userphone }}</span>
							</li>
							<li class="clr">
									<span class="fl">
										{{L_('收货人地址')}}
									</span>
								<span class="fr">{{ data.now_order.address }}</span>
							</li>
							{{# } else { }}
							<li class="clr">
								<span class="fl">
									{{L_('自提点联系电话')}}
								</span>
								<span class="fr blue callPhone" data-phone="{{ data.now_order.userphone }}">{{ data.now_order.userphone }}</span>
							</li>
							<li class="clr">
								<span class="fl">
									{{L_('自提点地址')}}
								</span>
								<span class="fr">{{ data.now_order.address }}</span>
							</li>
							{{# } }}

							{{# if (data.now_order.is_pick_in_store>0) { }}
								<li class="clr">
									<span class="fl">{{L_('运费')}}</span>
									<span class="fr">
										<span style="line-height: 26px;">&nbsp;&nbsp;&nbsp;&nbsp;
										{{  data.now_order.freight_charge }}({{ data.config.Currency_txt }})
										</span>
										 <span style="font-size: 12px;color: red;">{{# if (data.now_order['freight_charges'] == 1 && data.now_order['freight_charge'] > 0){ }} ({{L_('商户承担')}}) {{# } }}</span>
									</span>
								</li>
							{{# } }}

                        </ul>
                    </div>

					<div class="other_detail detail_list">
						<div class="top clr">
							<h2 class="fl">{{L_('详细信息')}}</h2>
						</div>
						<div class="user_list">
							<ul>
								<li class="clr">
									<span class="fl">
										{{L_('备注')}}
									</span>
									<span class="fr">
										{{# if (data.now_order.desc) { }}
											{{ data.now_order.desc }}
										{{# } else { }}
											{{L_('无')}}
										{{# } }}
									</span>
								</li>
								<li class="clr">
									<span class="fl">
										{{L_('卖家备注')}}
									</span>
									<span class="fr">
										{{# if (data.now_order.sell_note) { }}
											{{ data.now_order.sell_note }}

            function buy_num_info() {

                var username = $('.username').html();
                var userphone = $('.userphone').html();
                var address = $('.address').html();
                var desc = $('.desc').val();
                common.http('Merchantapp&a=getTotalPrice', {
                    'ticket': ticket,
                    'client': client,
                    'order_id': order_id,
                    'goods_id': goods_id,
                    'buy_num': buy_num,
                    'username': username,
                    'userphone': userphone,
                    'address': address,
                    'desc': desc,
                    'is_detail': 1,
                    'province_id': province_id
                }, function (response) {
                    if (response && response.errorCode && response.errorCode>0) {
                        mui.toast(response.errorMsg);
                    } else {
                        var totalMoney = response.totalMoney;
                        totalMoney = totalMoney.toFixed(2);
                        $('#payPopover .totalMoney_info .money_content').html(totalMoney + Currency_txt);
                        console.log('is_group',is_group);
                        if(is_group==1){
                            var group_totalMoney = response.group_totalMoney;
                            group_totalMoney = group_totalMoney.toFixed(2);
                            $('#payPopover  #group_totalMoney').html(group_totalMoney + Currency_txt);
                        }
                        if (response.wholesale_discount > 0) {
                            $('.totalMoney_info .discount_content .wholesale_discount').html(response.wholesale_discount);
                        }
                        if (response.discount_totalMoney > 0) {
                            var discount_totalMoney = response.discount_totalMoney;

                            console.log('discount_totalMoney',discount_totalMoney);
                            $('.totalMoney_info .discount_content .discount_totalMoney').html(discount_totalMoney);
                        }
                        console.log('total_express_fee',response['total_express_fee']);

                        total_express_fee = total_express_fee.toFixed(2);
                        $(".express_money").html(total_express_fee + '('+Currency_txt+')');
                        if (response.express_txt) {
                            $('.express_msg').html(response.express_txt);
                        } else {
                            $('.express_msg').html('');
                        }
                    }
                });
            }

                        if(is_group==1){

                        } else {
                            $('.express_msg').html('');
                        }
                    }
                });

            function clock(t){
                var d=Math.floor(t/(24*3600));
                var h=Math.floor((t-d*24*3600)/3600);
                var m=Math.floor(t%3600/60);
                var s=Math.floor(t%60);
                var time_str='';
                if(d>0){
                    time_str+=d+'天';
                }
                if(time_str || h>0){
                    time_str+=h+'{pigcms{:L_("小时")}';
                }
                if(time_str || m>0){
                    time_str+=m+'{pigcms{:L_("分钟")}';
                }
                if(time_str || s>0){
                    time_str+=s+'秒';
                }
                $('.pin_market_info .time_box').text('{pigcms{:L_("倒计时：")}'+time_str);
            }
