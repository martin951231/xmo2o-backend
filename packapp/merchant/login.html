<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>商家中心</title>
    <link rel="stylesheet" type="text/css" href="css/app.css" />
    <link rel="stylesheet" href="css/vant/vant@2.12.47.css" />
    <link rel="stylesheet" href="css/login.css?t=4" />
    <script src="js/vant/vue@2.6.14.min.js"></script>
    <script src="js/vant/vant@2.12.14.min.js"></script>
</head>

<body>
    <div id="app" style="display: none;">
    <div style="flex: 1;">
        <div class="header">
            <img class="bj" :src="requestStaticDomain + '/static/merchant_index/login-bj.png'" alt="">
            <van-image v-if="config && config.system_admin_logo" round width="60px" height="60px" :src="config.system_admin_logo"></van-image>
            <img v-else src="../merchant/images/23-_03.png" alt="" style="width:60px;height:60px;border-radius: 50%;">
            <div class="title">{{L_('商家中心')}}</div>
        </div>
        <div class="form">
            <van-field v-model="form.phone" clearable style="margin-bottom: 20px;"
                :left-icon="requestStaticDomain + '/static/merchant_index/icon-phone.png'" :placeholder="L_('输入账号')">
            </van-field>
            <div class="form-item">
                <van-field v-model="form.pwd" clearable type="password" id="login_pwd"
                    :left-icon="requestStaticDomain + '/static/merchant_index/icon-code.png'" :placeholder="L_('输入密码')">
                </van-field>
            </div>
        </div>
        <div class="login-buttom">
            <van-button round type="info" size="large" :color="mainColor" @click="loginClick">{{L_('登录')}}</van-button>
        </div>
        <div class="login-action">
            <div class="forgot-password" @click="goUrl('forgot_password.html')">{{L_('忘记密码')}}</div>
            <div class="div-line line" style="display: none;">l</div>
            <div class="settle" id="register" style="display: none;" @click="goUrl('reg.html')">{{L_('我要入驻')}}</div>
        </div>
    </div>
        <div class="privacy">
            <van-checkbox icon-size="16px" v-model="checkedPrivacy" shape="square" style="margin-right: 8px;"
                :checked-color="mainColor"></van-checkbox>
            {{L_('登录代表你已经同意')}}
            <span @click="goUrl('userAgreement.html')">{{L_('用户协议')}}</span>
            {{L_('和')}}
            <span @click="goUrl('agreement.html')">{{L_('隐私政策')}}</span>
        </div>
    </div>
</body>
<script src="js/mui.min.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/weui/weui.min.js"></script>
<script src="js/common.js?t=5" type="text/javascript" charset="utf-8"></script>
<script src="js/work/login.js?t=11"></script>

</html>
