<style>
	.mui-card {
		width: 47%;
		float: left;
		min-height: 330px;
	}
	.mui-card img{
		width: 100%;
		object-fit: cover;
	}
	.allGoods .run {
		background: #fff;
	}
	.allGoods .clear:after {
		content: " ";
		display: block;
		clear: both;
	}
	.allGoods .run .runItem {
		width: 49.8%;
		text-align: center;
	}
	.allGoods .add {
		border-right: 1px solid #f1f1f1;
	}
	.allGoods .ft {
		float: left;
	}
	.allGoods .adds .itemTop, .adds .itemBottom {
		padding-bottom: 0;
	}
	.allGoods .itemTop {
		border-bottom: 1px solid #f1f1f1;
	}
	.allGoods .adds ul {
		margin: 0;
	}
	.allGoods .adds ul li img {
		margin: 0!important;
		width: 100%!important;
		height: 100%!important;
	}
	.tip_adver {
		min-height: 26px;
	}
	.tip_adver img{
		width: 100%;
		height: 100%;
	}
	.vip {
		display: inline-block;
		width: 16px;height: 16px;
		background: url(images/vip.png) center no-repeat;
		background-size: contain;
		vertical-align: middle;
		position: relative;
		top: -3px;
		margin: 0;
	}
	.vip_price {
		color: #FD1946;
		font-weight: 600;
		font-size: 14px;
		line-height: 18px;
	}
	.currency_txt {
		font-size: 10px;
		color: #999c9e;
	}
	.allGoods .ui-list-single>li {
		padding-top: 0;
		padding-bottom: 0;
	}
	.allGoods .ui-list>li {
		position: relative;
		margin-left: 12px;
		display: -webkit-box;
	}
	.allGoods  .ui-list-single .ui-list-info {
		-webkit-box-orient: horizontal;
		-webkit-box-align: center;
		padding-top: 10px;
	}
	.allGoods  .ui-list li h4 {
		font-size: 16px;
		line-height: 24px;
		font-weight: normal;
	}
	.allGoods  .ui-list-single h4 {
		-webkit-box-flex: 1;
	}
	.allGoods  .ui-nowrap {
		max-width: 100%;
		overflow: hidden;
		white-space: nowrap;
		text-overflow: ellipsis;
	}
	.maket_list .commod {
		width: 100%;
		background: #FFA200;
		height: 44px;
	}
	.maket_list .commod .search {
		width: 90%;
		margin: 0 5%;
	}
	.maket_list .commod .search p {
		height: 32px;
		width: 100%;
		background: #fff;
		border-radius: 5px;
		line-height: 32px;
		text-align: left;
		padding-left: 10px;
	}
	.maket_list .commod p {
		list-style: none;
		margin: 0;
		padding: 0;
	}
	.maket_list .commod p {
		font-size: 14px;
		color: #8f8f94;
	}
	.maket_list .commod .search p i {
		display: inline-block;
		width: 14px;
		height: 14px;
		background: url(images/sst_06.png) center no-repeat;
		background-size: contain;
		vertical-align: middle;
	}
	.maket_list .commod .search p span {
		font-size: 15px;
	}
	.allGoods .h100 {
		height: 100%;
	}
	.allGoods .w100 {
		width: 100%;
	}
	.allGoods a:visited {
		text-decoration: none;
		color: #353535;
	}
	.allGoods .block {
		display: block !important;
	}
	.allGoods .ui-border-b:before {
		border-bottom: 1px solid #e9e9e9;
		content: '';
		display: block;
		width: 100%;
		position: absolute;
		left: 0;
		bottom: 0;
	}
	.allGoods .swiper-container {
		margin: 0 auto;
		position: relative;
		overflow: hidden;
		z-index: 1;
	}
	.allGoods .ui-border-b{
		position: relative;
	}
	.allGoods .swiper-wrapper {
		z-index: 1;
		display: -webkit-box;
		display: -moz-box;
		display: -ms-flexbox;
		display: -webkit-flex;
		display: flex;
		-webkit-transition-property: -webkit-transform;
		-moz-transition-property: -moz-transform;
		-o-transition-property: -o-transform;
		-ms-transition-property: -ms-transform;
		transition-property: transform;
		-moz-transform: translate3d(0, 0, 0);
		-o-transform: translate(0, 0);
		-ms-transform: translate3d(0, 0, 0);
		transform: translate3d(0, 0, 0);
		-webkit-box-sizing: content-box;
		-moz-box-sizing: content-box;
		box-sizing: content-box;
	}
	.allGoods .swiper-slide, .swiper-wrapper {
		height: auto;
		position: relative;
		transform-style: preserve-3d;
		width: 100%;
	}
	.allGoods .swiper-slide {
		-webkit-flex-shrink: 0;
		-ms-flex: 0 0 auto;
		flex-shrink: 0;
	}
	.allGoods .menu {
		background-color: #fff;
	}
	.allGoods .mb_10 {
		margin-bottom: 10px !important;
	}
	.allGoods .flex_col {
		flex-direction: column;
	}
	.allGoods .flex {
		display: flex !important;
		display: -webkit-box;
		display: -moz-box;
		display: -ms-flexbox;
		display: -webkit-flex;
		align-items: center;
	}
	.allGoods .align_center {
		text-align: center;
	}
	.allGoods .menu a {
		padding-top: 12px;
	}
	.allGoods .overflow_ellipsis2 {
		overflow: hidden;
		text-overflow: ellipsis;
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
	}
	.allGoods .color_9 {
		color: #999;
	}
	.allGoods .font_size12 {
		font-size: 12px !important;
	}
	.allGoods .swiper-pagination9.swiper-pagination {
		width: 100% !important;
		padding-right: 0px !important;
	}
	.allGoods .swiper-container-horizontal>.swiper-pagination .swiper-pagination-bullet {
		margin: 0 5px;
	}
	.allGoods .swiper-container9 .swiper-pagination-bullet-active {
		opacity: 1 !important;
		background: #f23030 !important;
		border-radius: 50% !important;
		width: 5px !important;
		height: 5px !important;
		border: 1px solid #f23030;
	}
	.del-line{
		text-decoration: line-through;
	}
	.virtual_msg {
		clear: both;
		width: 100%;
		text-align: center;
		padding: 10px;
		position: absolute;
		bottom: 0px;
	}
	.virtual_msg .virtual_push {
		background: #ffa200;
		color: white;
		padding: 5px 15px;
		border-radius: 15px;
	}
</style>

}

        length=1;
	}
    var banner_height=wh/320;
    banner_height=Math.ceil(banner_height*119);
    $("#listBanner").css('height',banner_height);
    if(length<2){
        $(".swiper-container1 .swiper-pagination").hide()
    }else{
        $(".swiper-container1 .swiper-pagination").show()
    }
	console.log('length',length);
    myswiper = new Swiper('.swiper-container1', {
        pagination: {
            el: '.swiper-container1 .swiper-pagination',
            clickable: true,
            type:'bullets'
        },
        autoplay:length>1?3000:false,
        autoplayDisableOnInteraction : false,
        loop: true,
        preventClicks : true,
        preventLinksPropagation:true
    });
    this_preventDefault();
}
function this_preventDefault() {
    $(".swiper-container .swiper-slide  a").click(function(e){
        if(myswiper!=null && myswiper.animating==true){
            e.stopPropagation();
            e.preventDefault();
        }
    });
}

function swiper2_reload(length) {
    if (!length) {
        length=1;
    }
    mySwiper9=new Swiper('.swiper-container9', {
        pagination: {
            el: '.swiper-container9 .swiper-pagination',
            clickable: true,
            type:'bullets'
        },
        autoplay:false,
        autoplayDisableOnInteraction : false,
        preventClicks : true,
        preventLinksPropagation:true,
        noSwiping: length > 1 ? false : true
    });
    $(".swiper-container9").css("padding",'20px 0px 10px');
    this_preventDefault()
}

var pindex=1;
var top_img=false;
var banner=false;
var advert=false;
var slider=false;

function market_index(page){
	common.http('Merchantapp&a=market_index',{'ticket':ticket,'client':client,'page':page,'cat_fid':cat_fid,'cat_id':cat_id},function(data){
		console.log('data',data);
		if (data.orders.length!=0) {
			data.orders.length<=19&&$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();

            if ((data.wholesale_top_tip_img || data.wholesale_middle_tip_img) && !top_img) {
                laytpl(document.getElementById('adver_info').innerHTML).render(data, function(html){
                    $('.header_adver_img').append(html);
                    setTimeout(function () {
                        img_auto();
                    },10)
                });
                top_img = true;
            }
			laytpl(document.getElementById('pluscardLists').innerHTML).render(data.orders, function(html){
				$('.alls').append(html);
                setTimeout(function () {
                    if (data.is_integral_mall!=1) {
						$('.mui-card').css('min-height','310px');
					}
                },800)
			});
            if (data.banner_list && data.banner_list.length>0 && !banner) {
                var length = data.banner_list.length;
                laytpl(document.getElementById('swiper1').innerHTML).render(data.banner_list, function(html){
                    $('#listBanner .swiper-wrapper').append(html);
                    setTimeout(function () {
                        swiper_reload(length);
                    },10);
                });
                banner = true;
            } else if(!banner) {
                $('#listBanner').hide();
            }
            if (data.adver_middle_img && data.adver_middle_img.length>0 && !advert) {
                var win_w=$(window).width();
                var one_img_h=win_w*0.38;
                laytpl(document.getElementById('one').innerHTML).render(data.adver_middle_img, function(html){
                    $('#one_img .swiper-wrapper').append(html);
                    $("#one_img").css('height',one_img_h+'px');
                    $("#one_img").removeClass('hide');
                });
                advert = true;
            } else if (!advert) {
                $('#one_img').hide();
            }

            if (data.slider_list && data.slider_list.length>0 && !slider) {
                var  result=[];
                for(var i=0,len=data.slider_list.length;i<len;i+=10){
                    result.push(data.slider_list.slice(i,i+10));
                }
                laytpl(document.getElementById('swiper2').innerHTML).render(result, function(html){
                    $('#listSlider .swiper-wrapper').append(html).removeClass('none');
                    $('#listSlider').removeClass('none');
                    if(data.slider_list.length<2){
                        $(".swiper-container9 .swiper-pagination9").hide();
                        $(".swiper-container9 .swiper-slide").addClass('swiper-no-swiping');
                    }else{
                        $(".swiper-container9 .swiper-pagination9").show();
                    }
                    setTimeout(function () {
                        swiper2_reload(data.slider_list.length);
                    },10);
                });
                slider = true;
            } else if (!slider) {
                $('#listSlider').hide();
                slider = true;
            }


            if(data['orders'].length>19){
				var flag = false;
				$(window).scroll(function(e) {
				    e.stopPropagation();
				    if(flag){
				      //数据加载中
				      return false;
				    }
				    //上拉加载
				    if ($(document).scrollTop() >= $(document).height() - $(window).height() - 1) {
				    	$('.pullup1').hide();
				    	$('.loading1').show();
				    	flag = true;
				        pindex++;
                        market_index(pindex);
				    }
				});
			}

			// 重新计算下图片，使其高度余宽度一致
			var height = $('.buy_detail img').width();
            console.log('height', height);
			$('.buy_detail img.but_img').css('height', height);
		}else{
			$('.pullup1').html(L_('没有更多数据啦'));
			$('.loading1').hide();
			$('.pullup1').show();
		}
	});
}

market_index(1);
