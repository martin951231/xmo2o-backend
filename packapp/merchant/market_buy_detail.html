    function show_select_txt(index)
    {
        var choose = false;
        spec_ids = '';
        spec_indexs = '';
        $('.cations ul').find('li.on').each(function(){
            if (!spec_ids) {
                spec_ids = $(this).data('id');
            } else {
                spec_ids += '_' + $(this).data('id');
            }
            if (!spec_indexs) {
                spec_indexs = 'id_'+$(this).data('id');
            } else {
                spec_indexs += '_id_' + $(this).data('id');
            }
        });
        var index_msg = $('.index_'+spec_ids).val();
        var price_old = $('.price_'+spec_ids).val();
        var stock_num_old = $('.stock_num_'+spec_ids).val();
        var min_num_old = $('.min_num_'+spec_ids).val();
        if (parseInt(min_num_old)>parseInt(stock_num_old)) {
            $(index).removeClass("on");
            is_choose = false;
            mui.toast('当前关联规格库存不足，请选择其他规格');
            return false;
		}

        console.log('spec_ids', spec_ids);
        console.log('price_old', price_old);
        console.log('stock_num_old', stock_num_old);
        console.log('min_num_old', min_num_old);
        if (parseInt(min_num_old)>0) {
            spec_min_num = min_num_old;
            $('#check_info_title_spec .showMin').html(spec_min_num);
            $('.buy_nums_input').val(spec_min_num);
        }

        if (spec_ids) {
            spec_price = price_old;
            if (!price_old) {
                spec_price = 0;
            }
            $('#check_info_title_spec .show_format_price').html(spec_price);
            choose = true;
        }
        if (stock_num_old) {
            spec_stock_num = stock_num_old;
            if (spec_stock_num>0) {
                $('#check_info_title_spec .show_stock_num').html('剩余' + spec_stock_num + '份')
            } else if (spec_stock_num==0) {
                $('#check_info_title_spec .show_stock_num').html('库存不足')
            }else if (spec_stock_num==-1) {
                $('#check_info_title_spec .show_stock_num').html('库存充足')
            }
            choose = true;
        }
        if (choose && index_msg) {
            is_choose = true;
        } else {
            is_choose = false;
        }
        console.log('is_choose', is_choose);
    }


    mui('body').on('tap','.plus a',function(e){
        if (is_spec) {
            if (is_spec && (!is_choose || !spec_ids)) {
                mui.toast('请先选择对应规格属性');
                return false;
            }
            var num = parseInt($('.buy_nums_input').val());
            spec_min_num = parseInt(spec_min_num);
            spec_min_unit = parseInt(spec_min_unit);
            spec_stock_num = parseInt(spec_stock_num);
            console.log('spec_min_unit', spec_min_unit);
            console.log('spec_min_num', spec_min_num);
            console.log('num', num);
            console.log('spec_stock_num', spec_stock_num);
            if ($(this).attr('class') == 'jia') {
                var n = Math.ceil(spec_min_num/spec_min_unit);
                if (spec_min_num<=0) {
                    n = 1;
				}
				if (spec_min_unit == 1) {
                    num ++;
				} else if (spec_min_unit > 0 && num == spec_min_num) {
                    num += spec_min_unit * n - spec_min_num;
                } else if (spec_min_unit > 0) {
                    num += spec_min_unit;
                } else {
                    num ++;
                }
                //限购校验(最多购买数量)
                if(typeof spec_stock_num!='undefined' && !isNaN(spec_stock_num) && spec_stock_num>0){
                    if(num>spec_stock_num){
                        mui.toast('最多购买数为'+spec_stock_num);
                        return false;
                    }
                }
            } else {
                console.log('爬起那', num-spec_min_unit < spec_min_num);
                if (spec_min_unit > 0 && num-spec_min_unit < spec_min_num) {
                    num = spec_min_num;
                } else if (spec_min_unit > 0) {
                    num -= spec_min_unit;
                } else {
                    num --;
                }
                //限购校验(最少购买数量)
                if(typeof spec_min_num!='undefined' && !isNaN(spec_min_num) && spec_min_num>0){
                    if(num<spec_min_num){
                        mui.toast('最少购买数为'+spec_min_num);
                        return false;
                    }
                }
            }
            if (num < 0) {
                num = 0;
            }
            if (num >spec_min_num) {
                $("#check_info_title_spec a.jian").css("color","#333333");
            }else if(num==spec_min_num){
                $("#check_info_title_spec a.jian").css("color","#bfbfbf");
            }else{
                $("#check_info_title_spec a.jian").css("color","#bfbfbf");
                return false;
            }
            $('.buy_nums_input').val(num);
            console.log('num',num);
            return;
        } else {
            var num = parseInt($('.plus input').val());
            var min_num = $('.plus input').data('min_num');
            var min_unit = $('.plus input').data('min_unit');
            console.log('min_unit1', min_unit);
            if ($(this).attr('class') == 'jia') {
                var n = Math.ceil(min_num/min_unit);
                if (min_unit == 1) {
                    num ++;
                } else if (parseInt(min_unit) > 0 && parseInt(num) == parseInt(min_num) && (min_unit * n>min_num)) {
                    num += min_unit * n - min_num;
                } else if (min_unit > 0) {
                    num += min_unit;
                } else {
                    num ++;
                }
            } else {
                if (min_unit > 0 && num-min_unit < min_num) {
                    num = min_num;
                } else if (min_unit > 0) {
                    num -= min_unit;
                } else {
                    num --;
                }
                //限购校验(最少购买数量)
                var minNum=$('#showMin').text();
                if(typeof minNum!='undefined' && !isNaN(minNum) && minNum>0){
                    minNum=parseInt(minNum);
                    if(num<minNum){
                        mui.toast('最少购买数为'+minNum);
                        return false;
                    }
                }
            }
            if (num < 1) {
                num = 1;
            }
            var min_num=$('.title_data').data('min_num');
            if (num >min_num) {
                $(".plus a.jian").css("color","#333333");
            }else if(num==min_num){
                $(".plus a.jian").css("color","#bfbfbf");
            }else{
                $(".plus a.jian").css("color","#bfbfbf");
                return false;
            }
            $('.plus input').val(num);
        }
    });

    function reload_msg() {
        $('.buy_nums_pay').blur(function () {
            // 输入值，离开后判断
            spec_min_num = parseInt(spec_min_num);
            spec_min_unit = parseInt(spec_min_unit);

                var msg = '批量批发请填写' + spec_min_unit + '的整数倍';

                $(this).val(spec_min_num);
                return false;

            if (!val || parseInt(val)<parseInt(spec_min_num)) {
                mui.toast('购买份数不能小于'+spec_min_num);
                $(this).val(spec_min_num);
                return false;

            if (parseInt(val)>parseInt(spec_stock_num)) {
                mui.toast('购买份数不能大于'+spec_stock_num);
                $(this).val(spec_stock_num);
            }

                return false;

                mui.toast('购买份数不能大于'+spec_stock_num);
                $(this).val(spec_stock_num);
            }
        });

        $('.buy_num').blur(function () {
            // 输入值，离开后判断
            var min_num = $.trim($(this).data('min_num'));
            var stock_num = $.trim($(this).data('stock_num'));
            var min_unit = $.trim($(this).data('min_unit'));
            if (min_num<=0) {
                min_num = 1;
            }
            console.log('buy_num_blur',stock_num);
            var val = $.trim($(this).val());
            if (parseInt(val)%parseInt(min_unit) != 0 && val != min_num) {
                var msg = '批量批发请填写' + min_unit + '的整数倍';
                mui.toast(msg);
                $(this).val(min_num);
                return false;
            }
            if (!val || parseInt(val)<parseInt(min_num)) {
                mui.toast('购买份数不能小于'+min_num);
                $(this).val(min_num);
            }
            if (parseInt(val)>parseInt(stock_num)) {
                mui.toast('购买份数不能大于'+stock_num);
                $(this).val(stock_num);
            }
        });
    }

    function clock(t){
        var d=Math.floor(t/(24*3600));
        var h=Math.floor((t-d*24*3600)/3600);
        var m=Math.floor(t%3600/60);
        var s=Math.floor(t%60);
        var time_str='';
        if(d>0){
            time_str+=d+'天';
        }
        if(time_str || h>0){
            time_str+=h+'{pigcms{:L_("小时")}';
        }
        if(time_str || m>0){
            time_str+=m+'{pigcms{:L_("分钟")}';
        }
        if(time_str || s>0){
            time_str+=s+'秒';
        }
        $('.pin_market_info .time_box').text('{pigcms{:L_("倒计时：")}'+time_str);
    }
