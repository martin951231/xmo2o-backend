<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>商家中心</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>  
		<link href="js/weui/weui.min.css" rel="stylesheet"/>
	</head>
	<body>
		<script src="js/jquery-1.9.1.min.js"></script>
		<script src="js/layer/layer.m.js"></script>
		<script src="js/weui/weui.min.js"></script>
		<script src="js/common.js"></script> 
		<script type="text/javascript">
			var urlFix = '';
			if(urlParam.from && urlParam.ticket && urlParam.store_device){
				urlFix = '?from=' + urlParam.from + '&ticket=' + urlParam.ticket +'&store_device=' + urlParam.store_device;
			}
			
			// var loading = weui.loading('loading')
			var is_call = false 

			var app_version = common.getVersion()
			var is_app = common.checkApp()
			
			if (!is_app || (is_app && app_version<1300)) {

				redirect_self('./index.html' + urlFix);
			}else{
				common.appFunction({name:"html_version", pack_type:visitWork, complete:'getPackVersionAfter'});
				setTimeout(function(){
					if (!is_call) {
						redirect_self('./index.html' + urlFix);
					}
				}, 5000)
			}

			function getPackVersionAfter (pack_version, file_path) {
				is_call = true
				common.http('Packapp&a=index', {noTip:true, 'pack_type':visitWork, 'pack_version':pack_version}, function(data){
					if (data && data.status == 'download') {
						downloadApp(data.url)
					} else {
						checkFilePath(file_path)
					}
				}, function(){
					checkFilePath(file_path)
				})
			}

			function downloadApp (url) {
				common.appFunction({name:"html_download", pack_type:visitWork, url:url, complete:'getPackCodeAfter', progress:'getPackCodeProgress'});
			}

			function getPackCodeAfter (file_path) {
				checkFilePath(file_path)
			}

			function getPackCodeProgress (percent) {
				weui.toast('下载进度='+percent, 3000);
				console.log('下载进度=', percent)
			}

			function checkFilePath (file_path) {
				if (file_path){
					common.appFunction({name:"redirectwebview",url:file_path + '/index.html' + urlFix});
				}else{
					redirect_self('./index.html' + urlFix);
				}
			}
		</script>
	</body>
</html>
