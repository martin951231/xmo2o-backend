<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
	<title>我的批发进货订单</title>
	<link href="css/mui.css" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="css/my_buy_wholesale_order.css" />
	<style>
		.flex {
			display: flex !important;
			display: -webkit-box;
			display: -moz-box;
			display: -ms-flexbox;
			display: -webkit-flex;
			align-items: center;
		}
		.flex_grow {
			flex-grow: 1;
			text-align: center
		}
		.cal_wid {
			width: calc(100% - 145px);
		}
		.mui-card .mui-card-header .wait_close_offline {
			display: inline-block;
			width: 75px;
			height: 25px;
			background: url(images/6-_24.png) center no-repeat;
			background-size: 75px 19px;
			font-size: 12px;
			text-align: center;
			line-height: 26px;
			color: #FFFFFF;
		}
		.mui-card .mui-card-header .normal_offline {
			display: inline-block;
			width: 75px;
			height: 25px;
			background: url(images/6-_07.png) center no-repeat;
			background-size: 75px 19px;
			font-size: 12px;
			text-align: center;
			line-height: 26px;
			color: #FFFFFF;
		}
	</style>
</head>

<body>
<header class="mui-bar mui-bar-nav">
	<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	<h1 class="mui-title"><L_>批发进货订单</L_><h1>
</header>
<div class="mui-content">
	<div id="slider" class="mui-slider">
		<div id="sliderSegmentedControl" class="mui-scroll-wrapper mui-slider-indicator mui-segmented-control mui-segmented-control-inverted">
			<ul class="mui-control-item mui-active all_market" href="#item1mobile" data-wid="tab-top-subpage-1.html">
				<li>0</li>
				<li><L_>全部</L_><li>
			</ul>
			<ul class="mui-control-item no_pay" href="#item2mobile" data-wid="tab-top-subpage-2.html">
				<li>0</li>
				<li><L_>待付款</L_><li>
			</ul>
			<ul class="mui-control-item no_send" href="#item3mobile" data-wid="tab-top-subpage-4.html">
				<li>0</li>
				<li><L_>待发货</L_><li>
			</ul>
			<ul class="mui-control-item no_get" href="#item4mobile" data-wid="tab-top-subpage-4.html">
				<li>0</li>
				<li><L_>待收货</L_><li>
			</ul>

		</div>

	</div>
	<div class="all_shop_lists">



	</div>
	<div class="pullup1" style="display:none;">上拉加载更多...</div>
	<div class="loading1" style="display:none;"><img src="images/xubox_loading2.gif" alt=""><L_>正在加载</L_><div>

	</div>
		<div id="middlePopover" class="mui-popover">
			<div class="mui-card">
				<!--页眉，放置标题-->
				<div class="mui-card-header" style="margin-left: 0px;">
					<p style="margin-left: 15px;"><L_>选择将将要进行的操作</L_><p> <sub class="mui-pull-right"></sub>
				</div>
				<!--内容区-->
				<div class="mui-card-content">
					<div class="mui-scroll-wrapper">
						<div class="mui-scroll" style="text-align: center;padding: 38px 20px;">
							<div style="margin-bottom: 20px;">
								<button style="width: 68%;" type="button" class="add_shop_direct"><i></i> 直接添加店铺</button>
							</div>
							<div>
								<button style="width: 68%;" type="button" class="claim_store_info"><i></i> 前往认领店铺</button>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>
		<script src="js/fastclick.js"></script>
		<script src="js/mui.min.js"></script>
		<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
		<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
		<!-- 所有店铺内容模板 -->
		<script id="cardlist" type="text/html">
			{{# for(var i = 0, len = d.data.length; i < len; i++){ }}


			<div class="mui-card flex" data-goods_id="{{d.data[i].goods_id}}" data-order_id="{{ d.data[i].order_id }}">
				<div class="mui-card-content flex_grow">
					<a href="javascript:void(0);" class="group_click flex">
						<img src="{{ d.data[i].pic }}" class="mui-pull-left"/>
						<ul class="mui-pull-left flex_grow cal_wid">
							<li><span>{{ d.data[i].name }}</span></li>
							<li>{{L_('总价')}}:{{ d.data[i].money }}{{ d.config.Currency_txt }}<li>
							<li>{{L_('数量')}}：{{ d.data[i].num }}</li>
						</ul>
					</a>
				</div>
				<div class="mui-card-header" style="text-align: right;">
						{{# if(d.data[i].status==10){ }}<span class="wait_close">{{L_('待支付')}}<span>{{# } }}
						{{# if(d.data[i].status==1 && d.data[i].pay_type=='offline' && d.data[i].offline_status==0){ }}
					       <span class="wait_close_offline">{{L_('线下未支付')}}<span>
					    {{# } else if(d.data[i].status==1 && d.data[i].pay_type=='offline' && d.data[i].offline_status==1)  { }}
					       <span class="normal_offline">{{L_('线下已支付')}}<span>
					    {{# } else if(d.data[i].status==1 && d.data[i].is_pick_in_store==0 && d.data[i].pick_id) { }}
					       <span class="normal">{{L_('待自提')}}<span>
					    {{# } else if(d.data[i].status==1) { }}
					       <span class="normal">{{L_('待发货')}}<span>
					    {{# } }}
						{{# if(d.data[i].status==2){ }}<span class="normal">{{L_('待收货')}}<span>{{# } }}
						{{# if(d.data[i].status==3 && d.data[i].is_pick_in_store==0 && d.data[i].pick_id){ }}
							   <span class="normal">{{L_('已自提')}}<span>
					    {{# } else if(d.data[i].status==3) {  }}
							   <span class="normal">{{L_('已收货')}}<span>
					    {{# } }}
						{{# if(d.data[i].status==4){ }}<span class="wait_examine">{{L_('已退款')}}<span>{{# } }}
				</div>
			</div>


			{{# } }}
		</script>

		<script type="text/javascript" charset="utf-8">
            mui.init();
            var ticket = common.getCache('ticket');
            var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
            var page=0;
            var status1="-1";
            var mask = mui.createMask();//callback为用户点击蒙版时自动执行的回调；
            openShop('-1',1);
            function openShop(status,page){
                console.log('status',status);
                console.log('page',page);
                common.http('Merchantapp&a=my_buy_wholesale_order',{'ticket':ticket,'client':client,'status':status,'page':page},function(result){
                    var data = {};
                    data.data = result.orders;
                    data.config = result.config;
                    console.log('data', data);
                    $('#sliderSegmentedControl ul:eq(0) li:eq(0)').text(result.all_num);
                    $('#sliderSegmentedControl ul:eq(1) li:eq(0)').text(result.no_pay_num);
                    $('#sliderSegmentedControl ul:eq(2) li:eq(0)').text(result.no_send_num);
                    $('#sliderSegmentedControl ul:eq(3) li:eq(0)').text(result.send_num);

                    if(data.data.length==0){
                        $('.pullup1').html(L_('没有更多数据啦'));
                        $('.loading1').hide();
                        $('.pullup1').show();
                    }else{
                        data.data.length<=9&&$('.pullup1').html(L_('没有更多数据啦'));
                        $('.loading1').hide();
                        $('.pullup1').show();
                        laytpl(document.getElementById('cardlist').innerHTML).render(data, function(html){
                            $('.all_shop_lists').append(html);
                        });
                        if(data.data.length>9){
                            var flag = false;
                            $(window).scroll(function(e) {
                                e.stopPropagation();
                                if(flag){
                                    //数据加载中
                                    return false;
                                }
                                if ($(document).scrollTop() <= 0) {
                                    return false;
                                }

                                //上拉加载
                                if ($(document).scrollTop() >= $(document).height() - $(window).height() -1) {
                                    $('.pullup1').hide();
                                    $('.loading1').show();
                                    flag = true;
                                    page++;
                                    openShop(status1,page);
                                }
                            });
                        }

                    }



                });
            }

            // 全部点击
            mui('.mui-content').on('tap','.all_market',function(e){
                page=1;
                $('.all_shop_lists').html('');
                openShop('-1',page);
            });
            // 待付款点击
            mui('.mui-content').on('tap','.no_pay',function(e){
                page=1;
                $('.all_shop_lists').html('');
                status1=-2;
                openShop(status1,page);
            });
            // 待发货点击
            mui('.mui-content').on('tap','.no_send',function(e){
                page=1;
                $('.all_shop_lists').html('');
                status1=1;
                openShop(status1,page);

            });
            // 待收货点击
            mui('.mui-content').on('tap','.no_get',function(e){
                page=1;
                $('.all_shop_lists').html('');
                status1=2;
                openShop(status1,page);
            });
            function pageShowFunc(){
                location.reload(true);
            }

            //点击蒙版
            mui('body').on('tap','.mui-backdrop',function(){
                mui('#middlePopover').popover('hide');
                mask.close();
                $('body').css('overflow-y','scroll');
            });

            // 点击进入详情
            mui('body').on('tap','.mui-card',function(){
                var order_id=$(this).data('order_id');
                var goods_id=$(this).data('goods_id');
                openWindow({
                    url:'market_detail.html?order_id='+order_id+'&goods_id='+goods_id+'&type=buy',
                    id:'market_detail'
                });
            });

		</script>
</body>

</html>
