<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>添加打印机</title>
    <link href="css/mui.css" rel="stylesheet"/>
     <link href="css/mui.poppicker.css" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="css/app.css" /> 
    <link rel="stylesheet" type="text/css" href="css/mui.picker.css" /> 
    <link rel="stylesheet" type="text/css" href="css/printer_add.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	    <h1 class="mui-title"><L_>添加打印机</L_></h1>
	</header>
	<div class="mui-content">
		<div class="content_style">
			<div class="mui-card">
				<div class="mui-card-content">
					<span class="left_style"><L_>打印机名称</L_></span>
					<input type="text" id="name" placeholder="请输入打印机名称"/>
				</div>
				<div class="classP">
					<p>
						<span class="left_style"><L_>打印机类型</L_></span>
						<b id="printerClass"><span id="printerClass_text"><L_>易联云打印机</L_></span><i class="mui-pull-right"></i></b>	
					</p>
				</div>
				<div class="mui-card-content clearfix" id="bettly" style="display: none;">
					<span class="left_style"><L_>选取蓝牙设备</L_></span>
					<input type="tel" readonly placeholder="请选取设备"/>
					<span class="checked1 mui-pull-right"><L_>选取</L_></span>
				</div>
				<div id="alls">
					<div id="items1">
						<div class="mui-card-content">
							<span class="left_style phone_ti"><L_>绑定手机号</L_> <em></em></span>
							<input type="tel" id="mp" placeholder="请输入绑定手机号"/>
						</div>
						<div class="mui-card-content">
							<span class="left_style bang_ti" ><L_>绑定账号</L_> <em></em></span>
							<input type="text" id="username" placeholder="请输入绑定账号"/>
						</div>
					</div>
					<div id="items4" style="display: none;">
						<div class="mui-card-content">
							<span class="left_style user_ti"><L_>USER</L_></span>
							<input type="text" id="feie_user" placeholder="请输入USER"/>
						</div>
						<div class="mui-card-content">
							<span class="left_style ukey_ti" ><L_>UKEY</L_></span>
							<input type="text" id="feie_ukey" placeholder="请输入UKEY"/>
						</div>
						<div class="language_change">
							<p>
								<span class="left_style"><L_>语言</L_></span>
								<b id="showLanguagePicker"><span id="language_text"><L_>通用</L_> </span><i class="mui-pull-right"></i></b>
							</p>
						</div>
					</div>
					<div id="items6" style="display: none;">
						<div class="mui-card-content">
							<span class="left_style ban_ti"><L_>版本号</L_></span>
							<input type="text" id="version" placeholder="请输入版本号"/>
						</div>
					</div>
					<div class="mui-card-content">
						<span class="left_style zhong_ti" ><L_>终端号</L_> <em></em></span>
						<input type="text" id="mcode" placeholder="请输入终端号"/>
					</div>
					<div class="mui-card-content">
						<span class="left_style mi_ti" ><L_>密钥</L_> <em></em></span>
						<input type="text" id="mkey" placeholder="请输入密钥"/>
					</div>
				</div>
				
				

				<div class="mui-card-content">
					<span class="left_style nums1" ><L_>打印份数</L_> <em></em></span>
					<input type="tel" id="count" placeholder="请输入打印份数" />
				</div>
				<div class="change" style="display: none;">
					<p>
						<span class="left_style"><L_>选择店铺</L_></span>
						<b id="showUserPicker"><span id="shop_text"><L_>请选择店铺</L_> </span><i class="mui-pull-right"></i></b>	
					</p>
				</div>
				<div class="mui-card-footer ling">
					<span class="left_style"><L_>纸张类型</L_></span>
					<div class="mui-input-row mui-radio mui-left">
							<label for=""><input name="paper" type="radio" checked="checked" value="0"/>58mm</label>
						</div>
						<div class="mui-input-row mui-radio mui-left">
							<label for=""><input name="paper" type="radio" value="1"/>80mm</label>
						</div>
					
				</div>
				<div class="mui-card-footer ling">
					<span class="left_style"><L_>字体大小</L_></span>
					<div class="mui-input-row mui-radio mui-left">
							<label for=""><input name="font_size" type="radio" checked="checked" value="0"/><L_>默认</L_></label>
					</div>
					<div class="mui-input-row mui-radio mui-left">
						<label for=""><input name="font_size" type="radio" value="1"/><L_>中等</L_></label>
					</div>
					<div class="mui-input-row mui-radio mui-left">
						<label for=""><input name="font_size" type="radio" value="2"/><L_>最大</L_></label>
					</div>
				</div>
				<div class="mui-card-footer ling">
					<span class="left_style"><L_>支持图片</L_></span>
					<div class="mui-input-row mui-radio mui-left">
						<label for=""><input name="pic" type="radio" checked="checked" value="0"/><L_>不支持</L_></label>
					</div>
					<div class="mui-input-row mui-radio mui-left">
						<label for=""><input name="pic" type="radio" value="1"/><L_>支持</L_></label>
					</div>
				</div>
				<div class="mui-card-footer">
					<span class="left_style"><L_>打印类型</L_></span>
					<ul>
						<li class="mui-pull-left checkbox_change" data-paid="0"><b></b><L_>下单成功后打印</L_></li>
						<li class="mui-pull-left checkbox_change" data-paid="1"><b></b><L_>支付成功后打印</L_></li>
						<li class="mui-pull-left checkbox_change" data-paid="5"><b></b><L_>接单成功后打印（外卖）</L_></li>
						<li class="mui-pull-left checkbox_change" data-paid="2"><b></b><L_>验证成功后打印</L_></li>
						<li class="mui-pull-left checkbox_change" data-paid="3"><b></b><L_>退款成功后打印</L_></li>
						<li class="mui-pull-left checkbox_change" data-paid="4"><b></b><L_>打印总单</L_></li>
					</ul>
				</div>
				<div class="mui-card-footer">
					<span class="left_style" style="width: 50%"><L_>外卖预订单打印类型</L_></span>
					<ul>
						<li class="mui-pull-left booking_order_print_change" data-paid="1"><b></b><L_>接单时打印 </L_></li>
						<li class="mui-pull-left booking_order_print_change" data-paid="2"><b></b><L_>订单提醒时打印</L_></li>
					</ul>
				</div>
				<div class="mui-card-footer">
					<span class="left_style" style="width: 50%"><L_>新版商城打印类型</L_></span>
					<ul>
						<li class="mui-pull-left mall_print_change" data-paid="1"><b></b><L_>接单成功后打印</L_></li>
						<li class="mui-pull-left mall_print_change" data-paid="2"><b></b><L_>支付成功后打印</L_></li>
						<li class="mui-pull-left mall_print_change" data-paid="3"><b></b><L_>退款成功后打印</L_></li>
					</ul>
				</div>
				<div class="mui-card-footer">
					<span class="left_style" style="width: 50%"><L_>快速买单打印类型</L_></span>
					<ul>
						<li class="mui-pull-left store_print_change" data-paid="1"><b></b><L_>支付成功时打印 </L_></li>
					</ul>
				</div>
				<div class="mui-card-footer" >
					<span class="left_style change_add" data-tip_content="发起打印时都会触发主打印机，不设置时、商品设置归属打印机时才打印该商品信息。若打印机都不设置，默认第一台为主打印机。"><L_>主打印机</L_> <em></em></span>
					<div class="mui-input-row mui-pull-right">
	   				    <div class="mui-switch is_main">
	   				        <div class="mui-switch-handle"></div>
	   				    </div>
	   				</div>
				</div>
			</div>
		</div>
		<a href="javascript:;" class="add" id="add_button"><L_>添加</L_></a>
		<input type="hidden" id="store_id" value="0"/>
	</div>
	<script src="js/fastclick.js"></script>
	<script src="js/mui.min.js"></script>
	<!--筛选用到js-->
	<script src="js/mui.picker.js"></script> 
	<script src="js/mui.dtpicker.js"></script>
	<script src="js/mui.poppicker.js"></script>
	<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/work/printer_add.js?t=2" type="text/javascript" charset="utf-8"></script>
</body>
</html>
