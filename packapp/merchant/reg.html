							<ul id="up_img">
								<li class="up_img" >
									<img src="images/17-8_03.png" alt="" />

							<ul id="up_img">
								<li class="up_img" >
									<img src="images/17-8_03.png" alt="" />

							</ul>
						</div>

			<div class="mui-card-header area">

			<div class="mui-card-content area">

	<script id="formTpl" type="text/html">
		{{# for (var i in d) { }}
			{{# if(d[i].type == '0'){ }}
				<!--单行文本-->
				<div class="van-cell van-field">
					<div class="van-cell__title van-field__label">
						<span>{{d[i].name}}</span>
					</div>
					<div class="van-cell__value van-field__value">
						<div class="van-field__body">
							<input diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" type="text" name="{{d[i].name}}" placeholder="请输入{{d[i].name}}" class="van-field__control L_N" />
						</div>
					</div>
				</div>
			{{# } else if (d[i].type == '1') { }}
				<!--多行文本-->
				<div class="van-cell van-field">
					<div class="van-cell__title van-field__label">
						<span>{{d[i].name}}</span>
					</div>
					<div class="van-cell__value van-field__value">
						<div class="van-field__body">
							<textarea diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" rows="3" name="{{d[i].name}}" placeholder="请输入{{d[i].name}}" class="van-field__control L_N" style="height: 72px;"></textarea>
						</div>
					</div>
				</div>
			{{# } else if (d[i].type == '2') { }}
				<!--上传图片-->
				<div class="van-cell van-field">
					<div class="van-cell__title van-field__label">
						<span>{{d[i].name}}</span>
					</div>
					<div class="van-cell__value van-field__value">
						<div class="van-field__body">
							<div class="van-field__control van-field__control--custom">
								<div class="van-uploader">
									<div class="van-uploader__wrapper">

										<div class="van-uploader__upload">
											<img src="" style="display: none" class="img{{d[i].id}}"/>
											<i class="van-icon van-icon-photograph van-uploader__upload-icon icon{{d[i].id}}"></i>
											<input multiple="multiple" type="file" accept="image/*" class="van-uploader__input fileImage" id="{{d[i].id}}" name="imgFile"/>
											<input diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" type="hidden" name="{{d[i].name}}" placeholder="请上传{{d[i].name}}" class="hidden{{d[i].id}}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			{{# } else if (d[i].type == '3') { }}
			<!--下拉选择框-->
				<div role="button" tabindex="0" class="van-cell van-cell--clickable  van-field">
					<div class="van-cell__title van-field__label">
						<span>{{d[i].name}}</span>
					</div>
					<div class="van-cell__value van-field__value">
						<div class="van-field__body">
							<input diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" data-val='{{d[i].use_field_json}}' type="text" name="{{d[i].name}}" readonly="readonly" placeholder="请选择{{d[i].name}}" class="select_key van-field__control L_N" style="width: 100%"/>
							<div class="van-field__right-icon">
								<i class="van-icon van-icon-arrow-down"></i>
							</div>
						</div>
					</div>
				</div>
			{{# } else if (d[i].type == '4') { }}
			<!--身份证正反面-->
				<div class="van-cell van-field">
					<div class="van-cell__title van-field__label">
						<span>{{d[i].name}}</span>
					</div>
				</div>
				<div class="ic-img">
					<div class="van-uploader">
						<div class="van-uploader__wrapper">
							<div class="van-uploader__input-wrapper">
								<div class="upload" style="width: 182px; height: 182px;">
									<div class="img-con box-corner ">
										<div class="img-box">
											<img src="./images/auth_camera_icon.png" class="up-img img{{d[i].id}}_1" />
										</div>
									</div>
									<div class="upload-tip">
										<span class="color-orange">点击</span>上传身份证
										<span class="color-orange">正面</span>照片
									</div>
								</div>
								<input type="file" accept="image/*" class="van-uploader__input fileImage" id="{{d[i].id}}_1" name="imgFile"/>
								<input diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" placeholder="请上传身份证正面" type="hidden" name="{{d[i].name}}" class="hidden{{d[i].id}}_1"/>
							</div>
						</div>
					</div>
					<div class="upload" style="width: 182px; height: 182px;">
						<div class="img-con">
							<div class="img-box">
								<img src="./images/auth_face_icon.png" class="eg-img" />
							</div>
						</div>
						<div class="upload-tip">
							正确示例：身份证正面
						</div>
					</div>
				</div>
				<div class="ic-img" style="margin-top: 10px;">
					<div class="van-uploader">
						<div class="van-uploader__wrapper">
							<div class="van-uploader__input-wrapper">
								<div class="upload" style="width: 182px; height: 182px;">
									<div class="img-con box-corner ">
										<div class="img-box">
											<img src="./images/auth_camera_icon.png" class="up-img img{{d[i].id}}_2" />
										</div>
									</div>
									<div class="upload-tip">
										<span class="color-orange">点击</span>上传身份证
										<span class="color-orange">背面</span>照片
									</div>
								</div>
								<input type="file" accept="image/*" class="van-uploader__input fileImage" id="{{d[i].id}}_2" name="imgFile"/>
								<input diy_type="{{d[i].type}}" is_require="{{d[i].iswrite}}" placeholder="请上传身份证背面" type="hidden" name="{{d[i].name}}" class="hidden{{d[i].id}}_2"/>
							</div>
						</div>
					</div>
					<div class="upload" style="width: 182px; height: 182px;">
						<div class="img-con">
							<div class="img-box">
								<img src="./images/auth_back_icon.png" class="eg-img" />
							</div>
						</div>
						<div class="upload-tip">
							正确示例：身份证背面
						</div>
					</div>
				</div>
			{{# } else if (d[i].type == '5') { }}
			<!--日期格式-->
			<div role="button" tabindex="0" class="van-cell van-cell--clickable van-field">
				<div class="van-cell__title van-field__label">
					<span>{{d[i].name}}</span>
				</div>
				<div class="van-cell__value van-field__value">
					<div class="van-field__body">
						<input diy_type="{{d[i].type}}" type="text" is_require="{{d[i].iswrite}}" name="{{d[i].name}}" readonly="readonly" placeholder="请选择{{d[i].name}}" class="date_key van-field__control L_N" style="width: 100%"/>
						<div class="van-field__right-icon">
							<i class="van-icon van-icon-arrow-down">
								<!----></i>
						</div>
					</div>
				</div>
			</div>
			{{# } else if (d[i].type == '6') { }}
			<!--时间格式-->
			<div role="button" tabindex="0" class="van-cell van-cell--clickable  van-field">
				<div class="van-cell__title van-field__label">
					<span>{{d[i].name}}</span>
				</div>
				<div class="van-cell__value van-field__value">
					<div class="van-field__body">
						<input diy_type="{{d[i].type}}" type="text" is_require="{{d[i].iswrite}}" name="{{d[i].name}}" readonly="readonly" placeholder="请选择{{d[i].name}}" class="time_key van-field__control L_N" style="width: 100%"/>
						<div class="van-field__right-icon">
							<i class="van-icon van-icon-arrow-down">
								<!----></i>
						</div>
					</div>
				</div>
			</div>
			{{# } else if (d[i].type == '7') { }}
			<!--日期+时间格式-->
			<div role="button" tabindex="0" class="van-cell van-cell--clickable  van-field">
				<div class="van-cell__title van-field__label">
					<span>{{d[i].name}}</span>
				</div>
				<div class="van-cell__value van-field__value">
					<div class="van-field__body">
						<input diy_type="{{d[i].type}}" type="text" is_require="{{d[i].iswrite}}" name="{{d[i].name}}" readonly="readonly" placeholder="请选择{{d[i].name}}" class="date_time_key van-field__control L_N" style="width: 100%"/>
						<div class="van-field__right-icon">
							<i class="van-icon van-icon-arrow-down">
								<!----></i>
						</div>
					</div>
				</div>
			</div>
			{{# } else { }}
			{{# } }}
		{{# } }}
	</script>

	<script>

	<script>
		$(document).ready(function(){
			var newmarket_code = GetQueryString('code');
			console.log('aaa',newmarket_code);
			if (newmarket_code != null) {
				$("#invit_code").val(newmarket_code);
			}
		});

		function GetQueryString(name) {
			var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
			var r = window.location.search.substr(1).match(reg);
			if (r != null) return unescape(r[2]);
			return null;
		}
	</script>
