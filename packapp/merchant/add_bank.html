<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover " />
    <title>银行卡</title>
    <link href="css/mui.css" rel="stylesheet"/>
	<link href="css/mui.picker.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="css/add_bank.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back"></div>
		<h1 class="mui-title"><L_>添加银行卡</L_></h1>
	</header>
	<div class="mui-content">
		<div class="mui-card">
			<div class="mui-card-header">
				<span class="left_style"><L_>开户账号</L_></span>
				<input type="tel" class="L_P" name="" id="account" value="" placeholder="请输入开户账号" />
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>开户名</L_></span>
				<input type="text" class="L_P" name="" id="name" value="" placeholder="请输入开户名" />
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>所在银行</L_></span>
				<input type="text" class="L_P" name="" id="bank" value="" placeholder="请输入所在银行" />
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>开户省市</L_></span>
				<span id="storeAddress" style="color: #C7C7CD;font-size: 15px;width: 72%;margin-left: -13%;padding:5px 0;"><span style="width: 89%" id="change_address"><L_>请选择开户省市</L_></span><i class="mui-pull-right"></i></span>
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>开户网点</L_></span>
				<input type="text" class="L_P" name="" id="branch" value="" placeholder="请输入开户网点" />
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>是否默认</L_></span>
				<div class="mui-input-row">
   				    <div class="mui-switch mui-active is_default">
   				        <div class="mui-switch-handle"></div>
   				    </div>
   				</div>
			</div>
		</div>
		<div class="sign"><L_>提交</L_></div>
	</div>
	<input type="hidden" id="province_id" value=""/>
	<input type="hidden" id="city_id" value=""/>
<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/mui.picker.js"></script>
<script src="js/mui.poppicker.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<script src="js/footer.js?12" type="text/javascript" charset="utf-8"></script>
<!-- android=appbackmonitor -->
<script type="text/javascript" charset="utf-8">
var cityList=[];
var sheng,shi,quan;
var j=1;
var moren_area_name="";

    mui.init();
    var client=common.getCache('client');
    var bank_id='';//银行卡ID
    var status=$.getUrlParam('status');
    if(status==0){
    	$('.mui-title').text(L_('添加银行卡'));
    	bank_id='';
    }else{
    	bank_id=$.getUrlParam('bank_id');
    	$('.mui-title').text(L_('修改银行卡'));
    	common.http('Merchantapp&a=bank_account_info',{'client':client,'bank_id':bank_id},function(data){
    		console.log(data);
    		$('#name').val(data.bank.account_name);
	    	$('#account').val(data.bank.account);
	    	$('#bank').val(data.bank.remark);
	    	$('#province_id').val(data.bank.province_id);
	    	$('#city_id').val(data.bank.city_id);
	    	$('#branch').val(data.bank.branch);
			
			document.getElementById('change_address').innerText = data.bank.city_name;
			document.getElementById('change_address').style.color="#333";
			
			sheng = data.bank.province_id;
			shi = data.bank.city_id;
	    	data.bank.is_default==1?$('.is_default').addClass('mui-active'):$('.is_default').removeClass('mui-active');
    	});
    }
    $('input').val('');
    $('#account').blur(function(e){
    	var nums=$(this).val();
    	if(nums==''){
    		mui.toast(L_('请填写开户账号'));
    	}else{
    		common.http('WapMerchant&a=get_bank_name',{'client':client,'card_number':nums},function(data){
	    		console.log(data);
	    		$('#bank').val(data.bank_name);
	    	});
    	}
    	
    });
    $('.sign').click(function(e){
    	var name=$('#name').val();
    	var province_id=$('#province_id').val();
    	var city_id=$('#city_id').val();
    	var branch=$('#branch').val();
    	var account=$('#account').val();
    	var remark=$('#bank').val();
    	var is_default=$('.is_default').is('.mui-active')?1:0;
    	if(account==''){
    		mui.toast(L_('请填写开户账号'));
    	}else{
    		if(name==''){
	    		mui.toast(L_('请填写开户名'));
	    	}else{
	    		if(remark==''){
	    			mui.toast(L_('请填写开户账号所在银行'));
	    		}else{
	    			common.http('Merchantapp&a=create_bank_account',{'client':client,'account_name':name,'account':account,'remark':remark,'is_default':is_default,'bank_id':bank_id,'province_id':province_id,'city_id':city_id,'branch':branch},function(data){
	    				console.log(data);
	    				mui.toast(data.msg);
						if(common.checkApp()){
							setTimeout(function(){
								if(common.checkAndroidApp()){
									window.pigcmspackapp.closewebview(2);
								}else{
									common.iosFunction('closewebview/2', {name:'closewebview', type: '2'});
								}
							},2000);
						}else{
							setTimeout(function(){
								history.go(-1);
								document.execCommand('Refresh');
							},2000); 
						}	
	    			});
	    		}
	    	}
    	}
    });

common.http('Merchantapp&a=cityList',{}, function(data){
    cityList=data;
});

//开户所在地
(function($, doc) {
    $.init();
    mui('.mui-content').on('tap','#storeAddress',function(e) {
        e.stopPropagation();
        e.preventDefault();
        document.activeElement.blur();
        //普通示例
        var cityPicker3 = new $.PopPicker({
            layer: 2
        });
        cityPicker3.setData(cityList);
        cityPicker3.pickers[0].setSelectedValue(sheng);
        cityPicker3.pickers[1].setSelectedValue(shi);
        j++;
        if(moren_area_name!=""&&j==2){
            var mui_body= document.getElementsByClassName('mui-poppicker-body')[0].lastElementChild.lastElementChild.children[1];
            var a=document.getElementsByClassName('mui-poppicker-body')[0].children[2].children[0].children[1].children;
            for(var i=0;i<a.length;i++){
                if(a[i].innerText==moren_area_name){
                    a[0].classList.remove('highlight');
                    a[i].classList.add('highlight');
                    mui_body.style.webkitTransform = "perspective(1000px) rotateY(0deg) rotateX(" +(20*i)+ "deg)";
                }
            }

        }
        cityPicker3.show(function(items){
			sheng = items[0].value;
			shi = items[1].value;
            document.getElementById('province_id').value = items[0].value;
            document.getElementById('city_id').value = items[1].value;
            document.getElementById('change_address').innerText =  items[0].text + " " + items[1].text;
            document.getElementById('change_address').style.color="#333";
        });
		replace_html_lang();

    });

})(mui, document);
</script>
</body>
</html>
