      	<style>
            .none{display:none}
            .order_list .goods-item:last-child {
                margin-bottom: 0;
            }
            .fr {
                float: right;
                display: inline;
            }
            .color_3 {
                color: #333 !important;
            }
            .font_size14 {
                font-size: 14px !important;
            }
            .font_size16 {
                font-size: 16px !important;
            }
            .color_9 {
                color: #999;
            }
            .font_size12 {
                font-size: 12px !important;
            }
            .menu_list .goods-item strong {
                display: block;
                font-size: 20px;
                color: #ff510c;
                margin-bottom: 6px;
                white-space: nowrap;
            }
            .menu_list .goods-item {
                display: table;
                width: 100%;
                padding: 0 6px;
                border-width: 0 0 1px;
                -webkit-box-sizing: border-box;
            }
            .order_list .goods-item {
                background: #f8f8f8;
                margin-bottom: 10px;
                padding: 10px;
            }
            .order_list .goods-item>div:first-child {
                width: 95px;
                padding-right: 10px;
            }
            .order_list .goods-item>div {
                padding: 0;
            }
            .menu_list .goods-item > div {
                display: table-cell;
                padding: 10px 4px;
                vertical-align: middle;
            }
            .order_list .goods-item>div:first-child img {
                border-radius: 0;
                width: 85px;
                height: 85px;
            }
            .menu_list .goods-item > div {
                display: table-cell;
                padding: 10px 4px;
                vertical-align: middle;
            }
            .order_list .goods-item>div {
                padding: 0;
            }
            .order_list .goods-item>div:last-child {
                vertical-align: top;
                position: relative;
                height: 85px;
            }
            .order_list .goods-item>div:last-child>h3 {
                line-height: 1.4;
                font-size: 12px;
            }

            .menu_list .goods-item h3 {
                font-weight: normal;
                line-height: 1.8;
                overflow: hidden;
            }
            .ellipsis {
                overflow: hidden;
                text-overflow: ellipsis;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
            }
            .order_list .count {
                display: none;
            }
            .order_list .goods-item>div:last-child strong {
                position: absolute;
                bottom: 0;
                left: 0;
                margin-bottom: 0;
                width: 100%;
                display: block;

                white-space: nowrap;
            }
            .seckill_tag {
                background: #ff510c;
                color: #fff;
                font-size: 12px;
                padding: 4px 5px;
                border-radius: 2px;
            }
        </style>
