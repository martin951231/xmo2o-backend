<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>店铺优惠管理</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/shop_discount.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
		<h1 class="mui-title"><L_>店铺优惠管理</L_></h1>
		<a class="mui-pull-right" href="javascript:;"><i></i><L_>新建优惠</L_></a>
	</header>
	<div class="mui-content">

	   
	</div>
<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<script id="discountHtml" type="text/html">
	{{# for(var i = 0, len = d.length; i < len; i++){ }}
		{{# if(d[i].type==0){ }}
			<div class="mui-card new_pay" data-id="{{ d[i].id }}">
				<div class="mui-card-header">
					<span><span>{{ L_('类别') }}</span> {{ L_('新单') }}</span>
					<p><i></i></p>
				</div>
				<div class="mui-card-content">
					<div class="mui-row">
					    <div class="mui-col-sm-4">
					    	<ul>
					    		<li><span class="pay_money">{{ L_('￥') }}{{ d[i].full_money }}</span></li>
					    		<li>{{ L_('满足金额') }}</li>
					    	</ul>
					    </div>
					    <div class="mui-col-sm-4">
					    	<ul>
					    		<li><span class="delate_money">-{{ L_('￥') }}{{ d[i].reduce_money }}</span></li>
					    		<li>{{ L_('优惠金额') }}</li>
					    	</ul>
					    </div>
					    <div class="mui-col-sm-4">
					    	<ul>
								{{# if(d[i].status==0){ }}
					    			<li><span class="pay_money">{{ L_('停用') }}</span></li>
								{{# } else { }}
									<li><span class="delate_money">{{ L_('启用') }}</span></li>
								{{# } }}
					    		<li>{{ L_('使用状态') }}<li>
					    	</ul>
					    </div>
					</div>
				</div>
			</div>
		{{# } else { }}
			<div class="mui-card full_cat" data-id="{{ d[i].id }}">
				<div class="mui-card-header">
					<span><span>{{ L_('类别') }}</span> {{ L_('满减') }}</span>
					<p><i></i></p>
				</div>
				<div class="mui-card-content">
					<div class="mui-row">
					    <div class="mui-col-sm-4">
					    	<ul>
					    		<li><span class="pay_money">{{ L_('￥') }}{{ d[i].full_money }}</span></li>
					    		<li>{{ L_('满足金额') }}</li>
					    	</ul>
					    </div>
					    <div class="mui-col-sm-4">
					    	<ul>
					    		<li><span class="delate_money">-{{ L_('￥') }}{{ d[i].reduce_money }}</span></li>
					    		<li>{{ L_('优惠金额') }}</li>
					    	</ul>
					    </div>
					    <div class="mui-col-sm-4">
					    	<ul>
								{{# if(d[i].status==0){ }}
					    			<li><span class="pay_money">{{ L_('停用') }}</span></li>
								{{# } else { }}
									<li><span class="delate_money">{{ L_('启用') }}</span></li>
								{{# } }}
					    		<li>{{ L_('使用状态') }}</li>
					    	</ul>
					    </div>
					</div>
				</div>
			</div>
		{{# } }}
		
	{{# } }}
</script>
<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
var store_id=$.getUrlParam('data');
var shop_type=$.getUrlParam('shop_type');
shop_type=shop_type || 1;
function pageShowFunc(){
	location.reload(true);
}
setTimeout(function(e){
	window.addEventListener('pageshow', function(event) {
	  	pageShowFunc();
	});
},1000);

//页面 初次加载页面渲染数据
common.http('WapMerchant&a=discount',{'ticket':ticket,'client':client,'store_id':store_id,'shop_type':shop_type},function(data){
	console.log(data);
	if(data!=null&&data.length!=0){
		laytpl(document.getElementById('discountHtml').innerHTML).render(data, function(html){
				$('.mui-content').html(html);
		});
	}else{
		mui.toast(L_('该店铺下还没有优惠哦,赶紧创建吧!'));
	}
	
});




mui('.mui-bar-nav').on('tap','.mui-pull-right',function(e){
	e.stopPropagation();
	e.preventDefault(); 
	openWindow({
		url:'new_discount.html?discountId=0&store_id='+store_id+'&shop_type='+shop_type,
		id:'new_discount'
	});
});

//编辑优惠
mui('.mui-content').on('tap','.mui-card-header p i',function(e){
	e.stopPropagation();
	e.preventDefault(); 
	var discountId=$(this).parents('.mui-card').attr('data-id');
	//window.location.href='new_discount.html?discountId='+discountId+'&store_id='+store_id;
	openWindow({
		url:'new_discount.html?discountId='+discountId+'&store_id='+store_id+'&shop_type='+shop_type,
		id:'new_discount'
	});
});
function pageShowFunc(){
	location.reload(true);
}
      	
</script>
</body>
</html>
