<!DOCTYPE html>

	<title>营业分析</title>

<body style="background: #fff;">
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back"></div>
		<h1 class="mui-title">
			<L_>营业分析</L_>
		</h1>
	</header>
	<div class="mui-content">
		<div class="tab_fen">
			<a href="businessAnalysis_shop.html?tabType=shop" data-url-type="self" data-type="shop">
				<L_>外卖</L_>
			</a>
			<a href="businessAnalysis_mall.html?tabType=mall" data-url-type="self" data-type="mall">
				<L_>商城</L_>
			</a>
			<a href="businessAnalysis_market.html?tabType=market" data-url-type="self" class="cur" data-type="market">
				<L_>营销</L_>
			</a>
			<a href="businessAnalysis_pro.html" data-url-type="self">
				<L_>商品</L_>
			</a>
		</div>

		<!-- 外卖 -->
		<div class="tabCon tab1">
			<div class="borderBt">
				<div class="shishi_til">
					<span class="fl">
						<L_>今日实时看板</L_>
					</span>
					<a href="businessAnalysis_marketToday.html?tabType=market&time=today" class="fr lookMore">
						<L_>详情</L_>
					</a>
					<div class="clear"></div>
				</div>
				<ul class="ul_list_Analysis todayData">
					<div class="clear"></div>
				</ul>

				<ul class="tab_conEcharts tab_conEchartChange">
					<li class="cur" data-data_type='0'><span>
							<L_>活动总营业额趋势</L_>
						</span></li>
					<li data-data_type='1'><span>
							<L_>带动订单趋势</L_>
						</span></li>
				</ul>

				<ul class="ul_changeFen">
					<span class="cur" data-is_add_up='1'>
						<L_>分时</L_>
					</span> <span data-is_add_up='0'>
						<L_>累计</L_>
					</span>
				</ul>

				<div id="container" style="height: 300px"></div>

			</div>
			<div>
				<div class="shishi_til">
					<span class="fl">
						<L_>历史数据概览</L_>
					</span>
					<a href="businessAnalysis_marketHistory.html?tabType=market&time=history" class="fr lookMore">
						<L_>详情</L_>
					</a>
					<div class="clear"></div>
				</div>
				<ul class="tab_conEcharts tab_conEchartsHistory">
					<li class="cur" data-type="1"><span>
							<L_>昨天</L_>
						</span></li>
					<li data-type="2"><span>
							<L_>近7日</L_>
						</span></li>
					<li data-type="3"><span>
							<L_>近30天</L_>
						</span></li>
					<li data-type="4"><span>
							<L_>自定义</L_>
						</span></li>
				</ul>

				<div>
					<ul class="select_time">
						<li style="width: 40%;"> <button id='startTime' data-options='{"type":"date","beginYear":2014}'
								class="btn mui-btn mui-btn-block"> </button>
							<div id='startResult' class="ui-alert"> </div>
						</li>
						<li style="width: 20%;">
							<L_>至</L_>
						</li>
						<li style="width: 40%;"> <button id='endTime' data-options='{"type":"date","beginYear":2014}'
								class="btn mui-btn mui-btn-block"> </button>
							<div id='endResult' class="ui-alert"> </div>
						</li>
						<div class="clear"></div>
					</ul>
					<ul class="ul_list_Analysis historyData">
						<div class="clear"></div>
					</ul>
				</div>
			</div>
			<!--  -->
		</div>
		<!-- 外卖 end -->

	</div>

	<script id="todayData" type="text/html">

	    {{# } else { }} 
	    	<label class="goDown">{{ d.mer_total_money_text.diff }}<L_>元</L_></label>

	    </div>

</script>
