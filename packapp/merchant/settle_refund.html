<div class="mui-content" style="padding-bottom: 60px;background-color: #fff;float: left;width: 100%;">
    
    <div class="commod detail_list">
        <input type="hidden" value="{{ data.order_id }}" name="order_id">
        <div class="buy detail_list">
             
            <div>
                <div class="tab" onclick="location.href='./settle.html'">充值</div>
                <div class="tab active">退款</div>
            </div>
            <div>
                <span style="padding-left: 10px;">您的金额为：￥<span class="now_money">0</span></span>
            </div>
            <div class="user_list" style="padding:0 10px;margin-top: 20px;">
                <span class="fl" style="display: inline-block; line-height:40px;vertical-align: middle; width: 40%;">退款金额</span>
                <span class="fr" style="width: 60%;">
<!--                    <input type="text" class="col-sm-2" name="money" id="money" value="{{ data.moneyShouldPay }}" onkeyup="clearNoNum(this)"/>-->
                    <input type="text" class="col-sm-2" name="money" id="money" value="" onkeyup="clearNoNum(this)"/>
                </span>
            </div>

            <div class="user_list" style="padding:0 10px;margin-top: 20px;">
                <span class="fl" style="display: inline-block; line-height:40px;vertical-align: middle;width: 40%;">备注</span>
                <span class="fr" style="width: 60%;">
<!--                    <input type="text" class="col-sm-2" name="money" id="money" value="{{ data.moneyShouldPay }}" onkeyup="clearNoNum(this)"/>-->

                </span>
            </div>
            
           
 


        </div>

    </div>
</div>
<nav class="plus_class">
    <div>
        <a href="javascript:;" class="to_pay"><L_>确定提交</L_></a>
    </div>

<script src="js/common.js?t=001"></script> 
    

 

<script> 
    mui.init();
    var ticket = common.getCache('ticket'); 
    var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0);
    $(document).ready(function(){
        // alert(123)
        $.post('/appapi.php?c=Merchantapp&a=getDataAjax',{
            'ticket': ticket,
            'client': client,
        }, function(res){
            if(res.errorCode == 0){
                $('.now_money').text(res.result.settle_in_money);
            }
        }, 'json')

        $('.to_pay').click(function(){
            var money = $.trim($('input[name="money"]').val());
            var remark = $.trim($('#remark').val());
            $.post('/appapi.php?c=Merchantapp&a=settleinRefund',{
                'ticket': ticket,
                'client': client,
                'money': money,
                'remark': remark
            }, function(res){
                console.log(res)
                if(res.errorCode != 0){
                     alert(res.errorMsg);
                }else{
                    alert('提交成功！');
                    location.href = './settle.html'
                }
            }, 'json')
        })
       
    });
</script>
