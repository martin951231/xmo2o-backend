<script type="text/javascript" charset="utf-8">
	mui.init();
	var ticket = common.getCache('ticket');
	var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
	var shopId=urlParam.store_id;//店铺ID
	var sort_id='';//默认渲染商品ID
	var type=0;//根据用户是否点击批量管理按钮修改样式
	//初次加载页面渲染三级分类
	common.http('WapMerchant&a=foodshopGoods',{'ticket':ticket,'client':client,'store_id':shopId,'sort_id':sort_id},function(data){
		console.log(data);
		if (data != null && data.length > 0) {
			$('.all_change_show>p').text(data[0].sort_name);
			var str='',sum='';
			$.each(data,function(i,val){	
				if(i==0){
					str+='<dd  class="first_list active"><i><b class="mui-pull-left"></b><span>'+data[i].sort_name+'</span><sub class="mui-pull-right"></sub></i></dd>';
					sum+='<ul class="goods_news">'
				}else{
					str+='<dd  class="first_list"><i><b class="mui-pull-left"></b><span>'+data[i].sort_name+'</span><sub class="mui-pull-right"></sub></i></dd>';
					sum+='<ul  class="goods_news" style="display:none;">'
				}

				if(val.goodsList!=[]){
					$.each(val.goodsList,function(j,text){
						sum+='<li class="mui-clearfix" data-goodid='+text.goods_id+'><i data-goodid='+text.goods_id+' class=" mui-pull-left check_tiggle" style="display: none;"></i><img class="mui-pull-left" src="'+((text.pic_arr && text.pic_arr!=null && text.pic_arr.length>0) ? text.pic_arr[0].url : '/static/images/empty.png')+'"/>';
						if(text.status==0){
							sum+='<sub class="floor">'+L_('已下架')+'</sub>';
						}else{
							sum+='<sub class="floor" style="display:none;">'+L_('已下架')+'</sub>';
						}
						sum+=' <ul class="mui-pull-left"><li>'+text.name+'</li><li>';
						if(text.stock_num=="-1"){
							sum+='<span>'+L_('月售')+'：'+text.sell_count+'</span></li>';
						}else{
							sum+='<sapn>'+L_('原始库存')+'：'+text.stock_num+'</sapn><span>'+L_('月售')+'：'+text.sell_count+'</span></li>';
						}
						sum+='<li><b>￥'+text.price+'</b></li></ul><div class="mui-media-body hide_btn">      <button data-goodid='+text.goods_id+' type="button" class="goods_modify">'+L_('修改')+'</button> ';
						if(text.status==0){
							sum+='<button data-goodid='+text.goods_id+' type="button" class="goods_off">'+L_('上架')+'</button>';
						}else{
							sum+='<button data-goodid='+text.goods_id+' type="button" class="goods_off">'+L_('下架')+'</button>';
						}
						sum+=' <button data-goodid='+text.goods_id+' type="button" class="goods_size">'+L_('规格')+'</button></div></li>';
						
					});
				}
				sum+='</ul>';
				
			});//遍历结束
			$('.classHtml').html(str);
			$('.all_fenlei').html(sum);
		}else{
			mui.toast(L_('还没有分类哦,快去添加吧'));
		}
		
		var chuHeight='';
		if(common.checkIosApp()){
			chuHeight=$(window).height()-158;

		}else{
			 chuHeight=$(window).height()-138;
		}
		$('.mui-col-xs-3').css('height',chuHeight);
		$('.mui-col-xs-9').css('height',chuHeight);
	});

	//一级列表点击
	mui('#segmentedControls').on('tap','dl dd',function(e){
		$(this).addClass('active').siblings('dd').removeClass('active');
		var text=$(this).find('span').text();
		$('.all_change_show>p').text(text);
		var index=$(this).index();
		$('.all_fenlei>ul:eq('+index+')').show().siblings('ul').hide();
	});
	

	//商品上下架点击
	$('.mui-content').unbind('click','.goods_off').on('click','.goods_off',function(e){
		e.stopPropagation();
		var goods_ids=$(this).attr('data-goodid');
		var me=this;
		if($(this).text()=="上架"){
			common.http('WapMerchant&a=updateFoodStatus ',{'ticket':ticket,'client':client,'store_id':shopId,'goods_ids':goods_ids,'status':1},function(data){
				mui.toast(L_('上架成功'));
				$(me).parents('li.mui-clearfix').find('.floor').hide();
				$(me).text(L_('下架'));
			});
		}else{
			common.http('WapMerchant&a=updateFoodStatus ',{'ticket':ticket,'client':client,'store_id':shopId,'goods_ids':goods_ids,'status':0},function(data){
				mui.toast(L_('下架成功'));
				$(me).parents('li.mui-clearfix').find('.floor').show();
				$(me).text(L_('上架'));
			});
		}
	});

var chuHeight='';
if(common.checkIosApp()){
	chuHeight=$(window).height()-158;

}else{
	 chuHeight=$(window).height()-138;
}
$('.mui-col-xs-3').css('height',chuHeight);
$('.mui-col-xs-9').css('height',chuHeight);
	
//批量管理点击
mui('.mui-content').on('tap','.batch_management',function(e){
	type=1;//按钮隐藏 选择框显示
	$('.mui-bar-nav span').removeClass('hidden');
	$('.goods_news li i').show();
	$('.commod').hide();
	$('.all_checkbox').show();
	$('.all_change_show').addClass('active');
	$('.shop_guan1').addClass('hidden').next('nav').removeClass('hidden');
	$('.hide_btn').hide();
	$('.floor').addClass('active');
	$('.mui-col-xs-3').css('height',chuHeight+44);
	$('.mui-col-xs-9').css('height',chuHeight+44);
	var lengths=$('.goods_news>li>i.active').length;
	$('.all_change_show>p').hide();
	$('.goods_news>li i.check_tiggle').removeClass('active');
	$('.yiselect').text(L_('已选0件'));
	$('.all_checkbox').removeClass('active');
	$('.bottom_bg').show();
	$('.goods_news li img').css('margin-left','0');
	$('.bottom_bg').click(function(e){
		mui.toast(L_('请先选择商品后操作'));
	});
	//下架点击
	mui('.shop_change').on('tap','.goods_downshelves',function(e){
		
		var goods_id=[];
		$.each($('.goods_news>li.mui-clearfix'),function(i,val){
			if($(this).find('.check_tiggle').is('.active')){
				goods_id.push($(this).attr('data-goodid'));
				$(this).find('.floor').show();
				$(this).find('.goods_off').text(L_('上架'));
			}
		});
		common.http('WapMerchant&a=updateFoodStatus',{'ticket':ticket,'client':client,'store_id':shopId,'goods_ids':goods_id,'status':0},function(data){
			mui.toast(L_('下架成功'));
		});
	});
	//上架点击
	mui('.shop_change').on('tap','.goods_upshelves',function(e){
		var goods_id=[];
		$.each($('.goods_news>li.mui-clearfix'),function(i,val){
			if($(this).find('.check_tiggle').is('.active')){
				goods_id.push($(this).attr('data-goodid'));
				$(this).find('.floor').hide();
				$(this).find('.goods_off').text(L_('下架'));
			}
		});
		// $('.bottom_bg').show();
		common.http('WapMerchant&a=updateFoodStatus',{'ticket':ticket,'client':client,'store_id':shopId,'goods_ids':goods_id,'status':1},function(data){
			// if(data.lengths==0){
				mui.toast('上架成功');
			// }
		});
	});
	//复选框点击事件check_tiggle
	$('.goods_news').off('click','.check_tiggle').on('click','.check_tiggle',function(e){
		e.stopPropagation();
		if($(this).is('.active')){
			$(this).removeClass('active')
		}else{
			$(this).addClass('active');
		}
		var lengths=$('.goods_news>li>i.active').length;
		$('.all_checkbox').find('i').html('(已选'+lengths+'件)');
		if(lengths==$('.goods_news>li').length){
			$('.all_checkbox').addClass('active');
		}else{
			$('.all_checkbox').removeClass('active');
		}
  		if(lengths>0){
  			$('.bottom_bg').hide();
  		}else{
  			$('.bottom_bg').show();
  			$('.all_checkbox').removeClass('active');
  		}
	});
	//全选点击all_checkbox
	$('.all_checkbox').unbind('click').click(function(e){
		if($(this).is('.active')){
			$(this).removeClass('active');
			$('.goods_news>li>i').removeClass('active');
			var len=$('.goods_news>li i.active').length;
   			$(this).find('i').html('(已选'+len+'件)');
		}else{
			$(this).addClass('active');
			$('.goods_news>li>i').addClass('active');
			var len=$('.goods_news>li i.active').length;
   			$(this).find('i').html('(已选'+len+'件)');
		}
		var lengths=$('.goods_news>li>i.active').length;
  		if(lengths>0){
  			$('.bottom_bg').hide();
  		}else{
  			$('.bottom_bg').show();
  			
  		}
	});

	//删除按钮点击  delate_goods  cancel
	$('#more_list').off('click','#delate_goods').on('click','#delate_goods',function(e){
		e.stopPropagation();
		mui('#more_list').popover('toggle');
		mui.confirm('你确认删除这些商品吗？',/* btnArray, */function(e) {
			if (e.index == 1) {
				var goods_id=[];
				$.each($('.goods_news>li.mui-clearfix'),function(i,val){
					if($(this).find('.check_tiggle').is('.active')){
						goods_id.push($(this).attr('data-goodid'));
						$(this).remove();
					}
				});
				$('.bottom_bg').show();
				$('.all_checkbox .yiselect').text(L_('已选0件'));
				$('.all_checkbox').removeClass('active');
				common.http('WapMerchant&a=foodDel',{'ticket':ticket,'client':client,'store_id':shopId,'goods_ids':goods_id},function(data){
					console.log(data);
					mui.toast(L_('删除成功'));
				});
			}
		})
	});

	//完成按钮点击
	mui('.mui-bar-nav').on('tap','#cancel',function(e){
		type=0;//按钮显示 选择框隐藏
		$('.mui-bar-nav span').addClass('hidden');
		$('.goods_news li i').hide();
		$('.goods_news li img').css('margin-left','5%');
		$('.goods_news>li i.check_tiggle').removeClass('active');
		$('.all_checkbox').hide();
		$('.bottom_bg').hide();
		$('.hide_btn').show();
		$('.shop_change').addClass('hidden').prev('nav').removeClass('hidden');
		$('.floor').removeClass('active');
		$('.commod').show();
		$('.all_change_show').removeClass('active');
		$('.mui-col-xs-3').css('height',chuHeight);
		$('.mui-col-xs-9').css('height',chuHeight);
		$('.all_checkbox').hide();
		$('.all_change_show').removeClass('active');
		$('.bottom_bg').hide();
	});
});

// 自定义修改库存
mui('body').on('tap', '.mui-popover-action li>a.custom', function(e) {
	mui('#forward').popover('toggle');
	$('.custom_content').show();
	$('.custom_header').show();
	$('.bottom_bg').show();
	$('.now_custom input').val('');
	//保存按钮点击
	mui('body').on('tap','.custom_header p a',function(e){
		$('.bottom_bg').hide();
		$('.custom_content').hide();
		$('.custom_header').hide();
		var stock_num=Number($('[name="now_custom1"]').val());
		var original_stock=Number($('[name="now_custom2"]').val());
		if(stock_num!=''&&original_stock!=''){
			batch_edit({type:3,stock_num:stock_num,original_stock:original_stock},1,1);
		}else{
			mui.toast(L_('请先填写具体的库存数量'));
		}
	});
});
$('.now_custom input').click(function(e){
	$(this).focus();
});

// 修改分类
mui('body').on('tap', '.mui-popover-action li>a.edit_sort_id', function(e) {
	mui('#more_list').popover('toggle');
	$('.custom_content').show();
	$('.sort_id_content').show();

mui('body').on('tap','#showUserPicker',function(e){
	document.activeElement.blur();
	/**
	 * 获取对象属性的值
	 * 主要用于过滤三级联动中，可能出现的最低级的数据不存在的情况，实际开发中需要注意这一点；
	 * @param {Object} obj 对象
	 * @param {String} param 属性名
	 */
	var _getParam = function(obj, param) {
		return obj[param] || '';
	};
	var userPicker = new mui.PopPicker();
	userPicker.setData(goodsClass);
	userPicker.pickers[0].setSelectedValue(goods_index);
	userPicker.show(function(items) {
        document.getElementById('goods_class').setAttribute('data-id', items[0].value);
		document.getElementById('goods_class').innerHTML = items[0].text;
		document.getElementById('goods_class').style.color='#535353';
		goods_index=items[0].value;
	});
});

var flag = 1;
function  batch_edit(param,type,is_reload){
	if (!flag) {
		return false;
	}
	flag = 0;
	var goods_ids=[];
	$.each($('.goods_news>li.mui-clearfix'),function(i,val){
		if($(this).find('.check_tiggle').is('.active')){
			goods_ids.push($(this).attr('data-goodid'));
		}
	});
	param.goods_ids = goods_ids;
	common.http('WapMerchant&a=reset_foodgoods_info_batch',param,function(data){
		flag = 1;
		mui.toast(data);
		if (is_reload) {
			setTimeout(function(){
				location.reload(true);
			},2000);
		}	
		$('#'+type+'content').hide();
	});	
}
