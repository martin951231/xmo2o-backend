		<script>
            mui.init();
            var ticket = common.getCache('ticket');
            var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0);
            var order_id = urlParam.order_id;
            var mask = mui.createMask();//callback为用户点击蒙版时自动执行的回调；
			var Currency_txt = '元';
            var is_group = '';
            var team_id = '';
            var openid = urlParam.openid;
            console.log('order_id',order_id);
            // 渲染数据
            common.http('Merchantapp&a=market_pay', {
                'ticket': ticket,
                'client': client,
                'order_id': order_id,
            }, function (data) {
                console.log('data',data);
                if (data && data.now_order) {
                    is_group=data.now_order.is_group;
                    team_id=data.now_order.team_id;
                }
                Currency_txt = data.config['Currency_txt'];
                laytpl(document.getElementById('pluscardLists').innerHTML).render(data, function (html) {
                    $('.allHtml').html(html);
					setTimeout(function () {
                        if (openid) {
                            $('.weixin').attr('checked', true);
                        }
                    }, 500)
                });
            });
//            if(!openid && data.config['pay_weixinh5_open'] == '1'){
//            	location.href = window.location.protocol + '//' + requestDomain + '/wap.php?c=Packapp&a=bind&is_return=1&referer=' + encodeURI(location.href);
//            }


            // 确认支付订单
            mui('.plus_class').on('tap','.to_pay',function(){
                var pay_type = $('input[name="pay_type"]:checked').val();
				if (pay_type=='weixin' && !openid) {
                    layer.open({
                        content: L_('微信支付需要先绑定微信？绑定后请重新点击确认支付！')
                        ,btn: [L_('前往'), L_('取消')]
                        ,yes: function(index){
                            location.href = window.location.protocol + '//' + requestDomain + '/wap.php?c=Packapp&a=bind&is_return=1&referer=' + encodeURI(location.href);
                            layer.close(index);
                        }
                    });
                } else {
                    callpay();
				}
            });

            //微信弹程支付
            function callpay(){
                var pay_type = $('input[name="pay_type"]:checked').val();
                common.http('Merchantapp&a=market_pay_success', {
                    'ticket': ticket,
                    'client': client,
                    'order_id':order_id,
                    'pay_type':pay_type,
					'openid': openid
                }, function (data) {
                    console.log('market_buy',data);

                    if(pay_type == 'weixin' && !data.error){
                        layer.closeAll();
                        layer.open({
                            type:1,
                            content:'<div onclick="location.reload()" style="width:250px;top:50%;position:fixed;background:white;padding:20px 0;left:50%;margin-left:-125px;text-align:center;border-radius:10px;margin-top:-27px;">正在唤起微信支付，点击刷新</div>',
                            shadeClose:false,
                            success:function(){

                            }
                        });
                        param =  data.weixin_param;
                        WeixinJSBridge.invoke("getBrandWCPayRequest",param,function(res){
                            WeixinJSBridge.log(res.err_msg);
                            if(res.err_msg=="get_brand_wcpay_request:cancel"){
                                setTimeout(function(){
                                    window.location.reload();
                                },200);
                                layer.open({type:2,content:'刷新页面中',shadeClose:false});
                            }else if(res.err_msg=="get_brand_wcpay_request:ok"){
                                setTimeout("window.location.href = '"+data.redirctUrl+"'",200);
                                layer.open({type:2,content:'跳转加载中',shadeClose:false});
                            }else{
                                $("button.mj-submit").removeAttr("disabled");
                                $("button.mj-submit").html("确认支付");
                            }
                            layer.closeAll();
                        });
					} else if (data && data.error && data.msg) {
                        mui.toast(data.msg);
                        if (data.jump) {
                            var jump = data.jump;
                            setTimeout(function () {
                                if ('buy'==jump){
                                    var order_id=data.order_id;
                                    var goods_id=data.goods_id;
                                    openWindow({
                                        url:'market_detail.html?order_id='+order_id+'&goods_id='+goods_id+'&type=buy',
                                        id:'market_detail'
                                    });
                                } else if ('market_index'==jump) {
                                    openWindow({
                                        url:'market_index.html',
                                        id:'market_index'
                                    });
                                } else if ('mweb_url'==jump) {
                                    common.setCache('jump_url', data.url);

                            }, 800);
