<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
var adress_id = $.getUrlParam('adress_id');
var type = $.getUrlParam('type');
var type_info = $.getUrlParam('type_info');
var goods_id = $.getUrlParam('goods_id');
var order_id = $.getUrlParam('order_id');
var is_pick = $.getUrlParam('is_pick');

function address_index(){
	common.http('Merchantapp&a=edit_address_info',{'ticket':ticket,'adress_id':adress_id,'type':type,'goods_id':goods_id,'order_id':order_id},function(data){
		console.log('edit_address_info',data);
        if (adress_id>0 && data) {
            $('.add_address_btn').hide();
            $('.save_address_btn').show();
            $('.address_del').show();
        }
        if (data.name) {
            $('input[name="name"]').val(data.name);
        }
        if (data.default && 1==data.default) {
            $('input[name="default"]').attr('checked', true);
        }
        if (data.detail) {
            $('input[name="detail"]').val(data.detail);
        }
        if (data.zipcode) {
            $('input[name="zipcode"]').val(data.zipcode);
        }
        if (data.phone) {
