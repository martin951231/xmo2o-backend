<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>修改手机</title>
    <link href="css/mui.css" rel="stylesheet"/>
   	<link href="css/mui.poppicker.css" rel="stylesheet" />
	<link rel="stylesheet" type="text/css" href="css/app.css" /> 
    <link rel="stylesheet" type="text/css" href="css/mui.picker.css" /> 
    <link rel="stylesheet" type="text/css" href="css/mofidy_password.css"/>
    <style>
    	.mui-card-content ul li:nth-child(3){
    		border-bottom:1px solid #f1f1f1;
    	}
    </style>
	 
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
	    <h1 class="mui-title"><L_>修改手机</L_></h1>
	</header>
	<div class="mui-content">
	    <div class="phone_num">
	    	<ul>
	    		<li><b></b></li>
	    		<li><span><L_>您当前的手机号为</L_></span>&nbsp;<span id="phoneTxt"></span></li>
	    	</ul>
	    </div>
	    <div class="mui-card">
			<!--页眉，放置标题-->
			<!--<div class="mui-card-header"><L_>页眉</L_></div>-->
			<!--内容区-->
	
			<div class="mui-card-content">
				<ul>
					<li class="smscode" style="display:none;position:relative;">
						<input type="tel" id="smsCode" maxlength="4" placeholder="请输入短信验证码"/>
						<button type="button" class="mui-pull-right sendCode" tabindex="-1" style="position:absolute;right:0px;top:2px;"><L_>获取验证码</L_></button>
					</li>
					<li class="area phone_country" id="phone_country_type" style="display:none">
						<p>
							<span class="left_style"><L_>手机区号</L_></span>
							<span id="phone_country_type_click"><L_>区号</L_></span> <i class="mui-pull-right"></i>
						</p>
					</li>
					<li class="area" >
						<input type="tel" id="new_phone"  placeholder="请输入新手机" />
					</li>
					<li class="smscode" style="display:none"><input type="tel" id="smsCode2" maxlength="4" placeholder="请输入新手机验证码" style="width: 60%;"/>
						<button type="button" class="mui-pull-right sendCode2 L_" tabindex="-1" style="margin-top: 5px;margin-right: 3%;border: none;background: #FFA200;color: #fff;font-size: 15px;">获取验证码</button>
					</li>
				</ul>
			</div>
		</div>
		<a href="javascript:;" class="confirm_modify modify_phone" ><L_>确定修改</L_></a>
		<div style="font-size:12px;padding-left:5%;margin-top:20px;"><L_>若手机号无法接收短信，请联系管理员手机号码</L_></div>
	</div>
	<script src="js/fastclick.js"></script>
	<script src="js/mui.min.js"></script>
	<script src="js/mui.picker.js"></script>
	<script src="js/mui.poppicker.js"></script>
	<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/work/modify_password.js?t=1" type="text/javascript" charset="utf-8"></script>
	 
</body>
</html>
