<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>购买平台积分</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/merchant_buy_score.css"/>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back"></div>
		<h1 class="mui-title"><L_>购买平台积分</L_></h1>
	</header>
	<div class="mui-content">
		<div class="mui-card">
			<div class="mui-card-header">
				<span class="left_style"><L_>平台积分</L_></span>
				<span>&nbsp;&nbsp;</span>
				<span id="platform_score_price" style="width: 50%;text-align: left;">0</span>
				<span style="width: 50%;text-align: left;font-size: 14px;color: #404040;">( 1元购买积分数 )</span>
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>商家余额</L_></span>
				<span>&nbsp;&nbsp;</span>
				<span id="merchant_money" style="width: 100%;text-align: left;">￥11159.00</span>
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>对应积分数</L_></span>
				<span>&nbsp;&nbsp;</span>
				<span id="merchant_platform_score" style="width: 100%;text-align: left;">0</span>
			</div>
			<div class="mui-card-header">
				<span class="left_style"><L_>购买金额</L_></span>
				<input type="number" name="" id="buy" value="" placeholder="请填写购买金额" />
			</div>
		</div>
		<div class="sign"><L_>提交</L_></div>
	</div>
<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<!-- android=appbackmonitor -->
<script type="text/javascript" charset="utf-8">
    mui.init();
    var client=common.getCache('client');
    var merchant_buy_points = 0;
    var merchant_money = 0;
    $('input').val('');
	common.http('Merchantapp&a=merchant_buy_score_info',{'client':client},function(data){
        merchant_buy_points = data.merchant_buy_points;
        merchant_money = data.mer_info.money;
        var money_info = '￥' + merchant_money;
        $('#platform_score_price').text(merchant_buy_points);
        $('#merchant_money').text(money_info);
	});
    $('#buy').bind('input',function(e){
        var key = $.trim($(this).val());
        console.log('merchant_buy_points', merchant_buy_points);
        console.log('merchant_money', merchant_money);
        console.log('key', key);
    	if(Number(key) < 0 || key == ''){
            $('#merchant_platform_score').text(0);
    		mui.toast('请填写大于0的购买金额');
    	} else if(Number(key) > Number(merchant_money)) {
            $(this).val('');
            $('#merchant_platform_score').text(0);
            mui.toast('填写金额不能大于商家余额');
		} else{
            var score = Number(merchant_buy_points) * Number(key);
            console.log('score', score);
            score = Math.round(score * 100) / 100;
            console.log('score', score);
            $('#merchant_platform_score').text(score);
    	}
    	
    });
    $('.sign').click(function(e){
    	var buy=$('#buy').val();
    	if(Number(buy) <= 0){
    		mui.toast('请填写大于0的购买金额');
    	}else{
            common.http('Merchantapp&a=score_buy',{'client':client,'buy':buy},function(data){
                console.log('data',data);
                var order_id = data.order_id;
                var type = data.type;
                common.setCache('merchant_order_id', order_id);
                common.setCache('merchant_type', type);
                openWindow({
                    url:'merchant_buy_score_order.html',
                    id:'merchant_buy_score_order'
                });
                // mui.toast(data.msg);
                // if(common.checkApp()){
                //     setTimeout(function(){
                //         if(common.checkAndroidApp()){
                //             window.pigcmspackapp.closewebview(2);
                //         }else{
                //             common.iosFunction('closewebview/2', {name:'closewebview', type: '2'});
                //         }
                //     },2000);
                // }else{
                //     setTimeout(function(){
                //         history.go(-1);
                //         document.execCommand('Refresh');
                //     },2000);
                // }
            });
    	}
    });
</script>
</body>
</html>
