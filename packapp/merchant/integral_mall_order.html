    <script id="listTpl" type="text/html">
    {{# for (var i = 0, len = d.length; i < len; i++){ }}
        <li data-id="{{d[i].goods_id}}" data-goods_source_type="{{d[i]['goods_source_type']}}">
           <div class="top clr">
               <div class="fl">{{ L_('下单时间') }}：{{d[i].create_time}}</div>
               <div class="fr cancel" style="width: auto;">
                   {{d[i].status_txt}}
               </div>
           </div>
           <div class="con">
               <div class="con_top">
                   <h2>{{ L_('编号') }}：{{d[i].order_id}}</h2>
                   <p>{{L_('积分')}}：{{d[i]['payment_pure_integral']}}</p>
                   <p>{{L_('兑换数量')}}：{{d[i]['num']}}</p>
                   <p>{{L_('总计积分')}}：{{d[i]['payment_pure_integral']}}</p>
                   <p>{{L_('运费')}}：
                       {{# if(d[i].is_pick_in_store == 1){ }}
                       {{ d[i]['Currency_symbol']}}{{ d[i]['freight_charge']}}
                           {{# if(d[i].freight_charges == 1 && d[i].freight_charge>0){ }}
                                <span style="font-size: 12px;color: red;">({{ L_('商户承担') }})</span>
                           {{# } }}
                       {{# } }}
                   </p>

                   <p>{{L_('联系人')}}：{{d[i]['username']}}</p>
                   <p>{{L_('联系电话')}}：{{d[i]['userphone']}}</p>
                   {{# if(d[i].is_pick_in_store == 1){ }}
                        <p>{{L_('收货地址')}}：{{d[i]['address']}}</p>
                   {{# } else{ }}
                        <p>{{L_('自提地址')}}：{{d[i]['address']}}</p>
                   {{# } }}
               </div>
               <div class="remark">
                   {{# if(d[i].is_pick_in_store == 1 && (d[i]['status'] == 1 || d[i]['status'] == 2) && (d[i]['goods_source_type'] != 3 || d[i]['look_mer_id'] == d[i]['virtual_wholesale_mer_id'])){ }}
                   <div class="overtime kd_hair integral_push" data-goods_id="{{d[i]['goods_id']}}" data-order_id="{{d[i]['order_id']}}" style="right: 6rem;width: 2.5rem;">{{ L_('发货') }}</div>
                   {{# } }}
                   {{# if(d[i]['is_pick_in_store'] == 1 && (d[i]['status'] == 1 || d[i]['status'] == 2) && d[i]['goods_source_type'] == 3 && d[i]['look_mer_id'] != d[i]['virtual_wholesale_mer_id']){ }}
                   <div class="overtime kd_hair virtual_wholesale_mer" data-merchant_name="{{d[i]['virtual_merchant']['name']}}" style="right: 6rem;width: 4.5rem;">{{ L_('虚拟批发') }}</div>
                   {{# } }}
                   {{# if(d[i]['is_pick_in_store'] == 0 && d[i]['status'] == 1){ }}
                   <div class="overtime kd_hair integral_self_mention" data-goods_id="{{d[i]['goods_id']}}" data-order_id="{{d[i]['order_id']}}" style="right: 6rem;width: 5.5rem;">{{ L_('用户自提') }}</div>
                   {{# } }}
                   <div class="overtime kd_order integral_order_detail" data-goods_id="{{d[i]['goods_id']}}" data-order_id="{{d[i]['order_id']}}" style="width: 5.5rem">{{ L_('订单详情') }}</div>
               </div>
           </div>
        </li>
    {{# } }}
    </script>
