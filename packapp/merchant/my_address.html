<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>我的地址</title>
    <link href="css/mui.css" rel="stylesheet"/>
</head>
<style>
	/*头部*/
	.mui-bar-nav{
		background: #ffa200;
	}
	.mui-bar-nav a,.mui-bar-nav h1{
		color: #fff;
	}
    .mui-content-padding-bottom {
        padding-bottom: 60px;
        padding-bottom: calc(60px + constant(safe-area-inset-bottom));
        padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }
	.all_address dl.list:first-child {
		margin-top: 10px;
	}
	.all_address dl.list:first-child {
		height: 100%;
	}
	.all_address dl.list:first-child {
		margin: 0;
		border-top: 0;
	}
	dl.list {
		border: none;
	}
	dl.list {
		border: none;
	}
	dl.list {
		background-color: #fff;
	}
	dl.list {
		 margin-top: 10px;
		 margin-bottom: 0;
		 background-color: #fff;
	 }
	dl.list dt:last-child, dl.list dd:last-of-type {
		border-bottom: 0;
	}
	dl.list .dd-padding, dl.list dt, dl.list dd>.react {
		padding: 14px 10px;
	}
	dl.list dt, dl.list dd {
		margin: 0;
		overflow: hidden;
		font-size: inherit;
		font-weight: 400;
	}
	.all_address .address-container {
		font-size: 15px;
		-webkit-box-flex: 1;
	}
	.kv-line {
		display: -webkit-box;
		display: -ms-flexbox;
		margin: 10px 0;
	}
	.kv-line>.kv-v, .kv-line>p {
		display: block;
		-webkit-box-flex: 1;
		-moz-box-flex: 1;
		-ms-flex: 1;
	}
	p, h6 {
		line-height: 1.41;
		text-align: justify;
		margin: -2px 0;
		word-break: break-all;
	}
	.all_address .address-wrapper .edit_bg {
		position: absolute;
		right: 0;
		top: 0;
		width: 45px;
		height: 100%;
		z-index: 99;
	}
	.address-wrapper .edit {
		background: url(images/icon_address_edit.png) no-repeat center;
		background-size: 100%;
		height: 18px;
		width: 18px;
		display: inline-block;
		position: absolute;
		right: 15px;
		top: 50%;
		margin-top: -9px;
		z-index: 98;
	}
	.add_address_info {
		position: fixed;
		width: 100%;
		bottom: 0;
	}
	.add_address_info div {
		width: 100%;
	}
	.add_address_info a.add_address {
		background: #06c1ae;
		display: inline-block;
	}
	.add_address_info a {
		width: 100%;
		height: 40px;
		color: #fff;
		font-size: 16px;
		line-height: 40px;
		text-align: center;
        padding-bottom: constant(safe-area-inset-bottom);
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: content-box;
	}

	.add_edit_address dl.list dd dl {
		padding-left: 10px;
		border: 0;
	}
	.add_edit_address dl.list dt, dl.list dd {
		margin: 0;
		overflow: hidden;
		font-size: inherit;
		font-weight: 400;
	}
	.add_edit_address  .kv-line h6 {
		width: 1.1rem;
	}
	.add_edit_address .kv-line>h6, .kv-line>.kv-k {
		display: block;
		font-size: inherit;
		font-weight: 400;
	}
	.add_edit_address .dl.list-in dd {
		border-bottom: 1px dashed #e5e5e5;
	}
    .address-wrapper a {
        display: -webkit-box;
    }
    .address-select {
        display: -webkit-box;
        display: -moz-box;
        display: -ms-flex-box;
        padding-right: 4px;
        -webkit-box-align: center;
        -webkit-box-pack: center;
        -moz-box-align: center;
        -moz-box-pack: center;
        -ms-box-align: center;
        -ms-flex-pack: justify;
    }
    .address-select input.mt[type=radio], input.mt[type=checkbox] {
         display: none;
     }
    .address-select input.mt[type=radio]:checked, input.mt[type=checkbox]:checked {
        border: 0 !important;
        color: #fff !important;
        background: url(images/icon_jiesuan_mark.png) no-repeat center;
        background-size: 100%;
        height: 22px;
        width: 22px;
        line-height: 22px;
        position: absolute;
        top: 0;
        display: inline-block;
        left: 0;
        margin: 0;
        border-radius: 0;
    }
    .address-select input.mt[type=radio]:checked, input.mt[type=checkbox]:checked {
        /*background-color: #2bb2a3;*/
        border: 0;
        color: #fff;
    }
    .address-select input.mt[type=radio], input.mt[type=checkbox] {
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        margin: -7px 0;
        border-radius: 50%;
        border: 1px solid #ddd8ce;
        text-align: center;
        vertical-align: middle;
        line-height: 22px;
        outline: 0;
    }
    .address-select input.mt[type=radio]:checked:after, input.mt[type=checkbox]:checked:after {
        content: '';
    }
    .address-select input.mt[type=radio]:checked:after, input.mt[type=checkbox]:checked:after {
        /*content: "✓";*/
        font-size: .4rem;
        font-family: base_icon;
    }
</style>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
		<h1 class="mui-title"><L_>我的地址</L_></h1>
	</header>
	<div class="mui-content mui-content-padding-bottom">
	    <div class="all_address">

		</div>
	</div>



	<nav class="add_address_info">
		<div>
			<a href="javascript:;" class="add_address"><L_>新建收货地址</L_></a>
		</div>
	</nav>

	<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>

<script id="address_msg" type="text/html">
	{{# for(var i = 0, len = d.length; i < len; i++){ }}
        <dl class="list">
            <dd class="address-wrapper dd-padding link_choose" data-adress_id="{{d[i]['adress_id']}}" data-type="{{d[i]['select_url']}}"  style="position:relative;">
            {{#if (d[i]['select_url']) {}}
                <a href="javascript:void(0);" class="react "  style="padding:0;">
                    <div class="address-select">
                        {{#if (d[i]['adress_id']==d[i]['current_id']) {}}
                            <input class="mt" type="radio" name="addr" checked="checked"/>
                        {{# }else{ }}
                            <input class="mt" type="radio" name="addr"/>
                        {{# } }}
                    </div>
                </a>
            {{# } }}

                <div class="address-container" style="padding-right:36px;">
                    <div class="kv-line">
                        <p>{{d[i]['name']}}&nbsp;&nbsp;&nbsp;&nbsp;{{d[i]['phone']}}</p>
                        {{# if (d[i]['default']==1) {}}
                            <span style=" color:#06c1bb">【默认】</span>
                        {{# } }}
                    </div>
                    <div class="kv-line">
                        <p>{{d[i]['province_txt']}}&nbsp;&nbsp;{{d[i]['city_txt']}}&nbsp;&nbsp;{{d[i]['area_txt']}}&nbsp;&nbsp;{{d[i]['adress']}}&nbsp;&nbsp;{{d[i]['detail']}}</p>
                    </div>
                </div>
                <div class="edit_bg link_choose_edit" data-adress_id="{{d[i]['adress_id']}}"  data-type="{{d[i]['select_url']}}"></div>
                <i class="edit"></i>
            </dd>
        </dl>
	{{# } }}
</script>
<script type="text/javascript" charset="utf-8">
mui.init();
var ticket = common.getCache('ticket');
var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
var type = urlParam.type;
var type_info = urlParam.type_info;
var goods_id = urlParam.goods_id;
var order_id = urlParam.order_id;
var current_id = urlParam.current_id;
var is_pick = urlParam.is_pick;
var is_click = true;

function market_index(){
	common.http('Merchantapp&a=address',{'ticket':ticket,'client':client,'type':type,'goods_id':goods_id,'order_id':order_id,'current_id':current_id},function(data){
        if (data && data.address_list) {
            laytpl(document.getElementById('address_msg').innerHTML).render(data.address_list, function(html){
                $('.all_address').append(html);
            });
        }
	});
}

market_index();
mui('.add_address_info').on('tap','.add_address',function(e){
    var param = '';
    if (type) {
        param += '&type='+type;
    }
    if (goods_id) {
        param += '&goods_id='+goods_id;
    }
    if (order_id) {
        param += '&order_id='+order_id;
    }
    if (type_info) {
        param += '&type_info='+type_info;
    }
    if (is_pick) {
        param += '&is_pick='+is_pick;
    }
    openWindow({
        url:'edit_address.html?t=1'+param,
        id:'edit_address'
    });

});

mui('body').on('tap','.link_choose_edit',function(e){
    is_click = false;
    var type=$(this).data('type');
    var adress_id=$(this).data('adress_id');
    var param = '';
    if (adress_id>0) {
        param = '&adress_id='+adress_id;
    }
    if (goods_id>0) {
        param += '&goods_id='+goods_id;
    }
    if (order_id>0) {
        param += '&order_id='+order_id;
    }
    if (type) {
        param += '&type='+type;
    }
    if (type_info) {
        param += '&type_info='+type_info;
    }
    if (is_pick) {
        param += '&is_pick='+is_pick;
    }
    openWindow({
        url:'edit_address.html?t=1'+param,
        id:'edit_address'
    });
});

mui('body').on('tap','.link_choose',function(e){
    if (!is_click) {
        return false;
    }
    var type=$(this).data('type');
    var adress_id=$(this).data('adress_id');
    var param = '';
    console.log('type',type);
    if (adress_id>0) {
        param += '&current_id='+adress_id;
    }
    if (type=='market_cart') {
        openWindow({
            url:'market_cart.html?t=1'+param,
            id:'market_cart'
        });
    } else if (type=='market_buy') {
        if (goods_id>0) {
            param += '&goods_id='+goods_id;
        }
        if (is_pick) {
            param += '&is_pick='+is_pick;
        }
        openWindow({
            url:'market_buy.html?t=1'+param,
            id:'market_buy'
        });
    } else if (type=='market_detail') {
        if (goods_id>0) {
            param += '&goods_id='+goods_id;
        }
        if (order_id>0) {
            param += '&order_id='+order_id;
        }
        if (type_info) {
            param += '&type='+type_info;
        }
        if (is_pick) {
            param += '&is_pick='+is_pick;
        }
        openWindow({
            url:'market_detail.html?t=1'+param,
            id:'market_detail'
        });
    } else {
        if (adress_id>0) {
            param = '&adress_id='+adress_id;
        }
        if (is_pick) {
            param += '&is_pick='+is_pick;
        }
        openWindow({
            url:'edit_address.html?t=1'+param,
            id:'edit_address'
        });
    }

});
</script>
</body>
</html>
