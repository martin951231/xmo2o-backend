<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>忘记密码</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link href="css/mui.picker.css" rel="stylesheet" />
    <link href="css/mui.poppicker.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="css/forgot-password.css"/>
    <style>
        .phone_country{
            display: none;
        }
    </style>
</head>
<body>
	<header class="mui-bar mui-bar-nav">
	    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" style="color:black;"></div>
	    <h1 class="mui-title"><L_>忘记密码</L_></h1>
	</header>
	<div class="mui-content">
		<div class="mui-card">
            <div class="mui-card-header area phone_country"  >
            	<p>
            	<span class="left_style"><L_>手机区号</L_></span>
            	<b id="phone_country_type"><span id="phone_country_type_click"><L_>请选择国家</L_></span> <i class="mui-pull-right"></i></b> 
            	
            	</p>
            </div>
			<ul> 
		    	<li><i></i><input class="L_P" type="tel" id="phone" maxlength="11" placeholder="请输入手机号"/></li>
		    	<li class="psfixed"><b></b><input class="L_P" type="text" id="smsCode" maxlength="4" placeholder="请输入短信验证码"/>
		    	<button type="button" class="mui-pull-right sendCode L_" tabindex="-1">获取验证码</button></li>
		    	<li><span></span><input style="width: 90%;" class="L_P" type="text" id="newPwd" placeholder="8~16位且包含字母、数字和特殊符号的新密码"/></li>
		    </ul>
		</div>
	    <a href="javascript:;" class="yes_mofidy"><L_>确认修改</L_></a>
	</div>
	<script src="js/fastclick.js"></script>
	<script src="js/mui.min.js"></script> 
    <script src="js/mui.picker.js"></script>
    <script src="js/mui.poppicker.js"></script>
	<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
   <!-- <script src="js/work/reg.js" type="text/javascript" charset="utf-8"></script> -->
	<script src="js/work/forgot_password.js?t=2" type="text/javascript" charset="utf-8"></script>
    
</body>
</html>
