<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>可用积分</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/app.css" />
    <link href="css/mui.picker.css" rel="stylesheet" />
    <link href="css/mui.picker.min.css" rel="stylesheet" />
    <link href="css/mui.poppicker.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="css/record.css"/>
</head>
<body>
<header class="mui-bar mui-bar-nav">
    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back" ></div>
    <h1 class="mui-title"><L_>可用积分</L_></h1>
</header>
<div class="mui-content">
    <div class="record_money">
        <div class="mui-row mui-clearfix">
            <div class="mui-col-sm-6 left_show" style="width: 90%">
                <p><span id="shai" class="shai" style="display:none;"></span></p>
                <h1 id="total_score">0.00</h1>
            </div>
        </div>
    </div>
    <!--报表统计-->
    <div class="mui-card report" style="margin: 10px 0;">
        <!--页脚，放置补充信息或支持的操作-->
        <div class="mui-card-footer">
            <div class="mui-row" style="width: 100%;">
                <div class="mui-col-sm-6 begin_date">
                    <li class="" >
                        <i></i>
                        <span id="begin_date"><L_>请选择开始日期</L_></span>
                        <b></b>
                    </li>
                </div>
                <div class="mui-col-sm-6 end_date">
                    <li class="" >
                        <i></i>
                        <span id="end_date"><L_>请选择结束日期</L_></span>
                        <b></b>
                    </li>
                </div>
            </div>
        </div>
    </div>
    <!--筛选后内容-->
    <div id="logs">

    </div>
    <!-- 上拉刷新 -->
    <div class="pullup" style="display:none;">上拉加载更多...</div>
    <div class="loading" style="display:none;"><img src="images/xubox_loading2.gif" alt=""><L_>正在加载</L_></div>
</div>
<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script src="js/mui.dtpicker.js"></script>
<script src="js/mui.picker.js"></script>
<script src="js/mui.poppicker.js"></script>
<script src="js/city.data.js" type="text/javascript" charset="utf-8"></script>
<script src="js/city.data-3.js" type="text/javascript" charset="utf-8"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>


<script type="text/javascript" charset="utf-8">
    var ticket = common.getCache('ticket');
    //console.log(ticket);
    var client = common.checkAndroidApp()  ?  2 : (common.checkIosApp() ? 1 : 0);
    var be_date='';
    var enddate='';
    var stor_list=[];
    var type_list=[];
    var type_index='all';
    var store_index='';
    var page=1;
    var zuiShi='';
    var ctuan=common.getCache('ctuan');
    $('.ctuan').text(ctuan);
    function p(s) {
        return s < 10 ? '0' + s: s;
    }

    //获取当前时间
    var myDate = new Date();
    //获取当前年
    var year=myDate.getFullYear()|| 2099;
    //获取当前月
    var month=myDate.getMonth()+1;
    //获取当前日
    var date=myDate.getDate();
    var now=year+'-'+p(month)+"-"+p(date);
    //console.log(now);
    $('#begin_date').text(now);
    $('#end_date').text(now);

    now=replaceAll(now);
    zuiShi=now+'-'+now;
    be_date=now;
    enddate=now;

    function replaceAll(str){
        if(str!=null)
            str = str.replace(/-/g,"/")
        return str;
    }

    function changeAllshou(){
        common.http('Merchantapp&a=score_logs',{'ticket':ticket,'client':client,'page':page,'type':type_index,'store_id':store_index,'period':zuiShi},function(data){
            var _html = '';
            var lists = data.lists;
            var len = lists.length;
            var score = data.score;

            $('#total_score').html(score);

            for (var i = 0; i < len; i++) {
                _html += '<div style="padding: 10px 15px;background: #FFFFFF;margin-bottom: 10px">\n' +
                    '        <div>\n' +
                    '            <p>订单编号:' + lists[i]['real_orderid'] + '</p>\n' +
                    '            <p>订单类型:' + lists[i]['order_type_name'] + '</p>\n' +
                    '            <p>获得积分:' + lists[i]['score'] + '</p>\n' +
                    '            <p>获得时间:' + lists[i]['add_date'] + '</p>\n' +
                    '        </div>\n' +
                    '    </div>';
            }
            $('#logs').append(_html);
        });
    }


    changeAllshou();

    //筛选
    (function($, doc) {
        $.init();

        // 两类时间选择
        $('.begin_date')[0].addEventListener('tap',function(){
            var timeValue=document.getElementById('begin_date').innerText;
            var optionsJson = '{"type":"date","beginYear":2014,"beginMonth":5,"beginDay":1,"endYear":'+year+'}';
            var options = JSON.parse(optionsJson);
            var id = this.getAttribute('id');
            var picker = new $.DtPicker(options);
            picker.setSelectedValue(timeValue);
            picker.show(function(rs) {
                $('#begin_date')[0].innerText = rs.text;
                be_date=replaceAll(rs.text);
                picker.dispose();
                if(enddate==''){
                    mui.toast(L_('请选择结束日期'));
                }else{
                    page=1;
                    zuiShi=be_date+'-'+enddate;
                    console.log(zuiShi);
                    document.getElementById('logs').innerHTML='';
                    changeAllshou();
                    document.getElementById('jin').style.display="none";
                    document.getElementById('shai').style.display="block";
                    document.getElementById('jin1').style.display="none";
                    document.getElementById('shai1').style.display="block";
                }
            });
        });
        $('.end_date')[0].addEventListener('tap',function(){
            var timeValue=document.getElementById('end_date').innerText;
            var optionsJson = '{"type":"date","beginYear":2014,"endYear":'+year+'}';
            var options = JSON.parse(optionsJson);
            var id = this.getAttribute('id');
            var picker = new $.DtPicker(options);
            picker.setSelectedValue(timeValue);
            picker.show(function(rs) {
                $('#end_date')[0].innerText = rs.text;
                picker.dispose();
                enddate=replaceAll(rs.text);
                if(be_date==''){
                    mui.toast(L_('请选择开始日期'));
                }else{
                    page=1;
                    zuiShi=be_date+'-'+enddate;
                    document.getElementById('cards').innerHTML='';
                    changeAllshou();
                    document.getElementById('jin').style.display="none";
                    document.getElementById('shai').style.display="block";
                    document.getElementById('jin1').style.display="none";
                    document.getElementById('shai1').style.display="block";
                }
            });
        });
    })(mui, document);



</script>
</body>
</html>
