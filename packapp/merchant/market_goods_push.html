	<style>
		.spec_list table td {
			text-align: center;
		}
		.spec_list table th {
			text-align: center;
			padding: 1px;
			font-size: 14px;
		}
		.spec_list table tr {
			border-bottom: #f1f1f1 1px solid;
		}
		.spec_list table {
			margin: 12px 3%;
		}
		.plus_class {
			position: fixed;
			height: 60px;
			width: 100%;
			bottom: 0;
			line-height: 60px;
			background: #EFEFF4;
		}
		.mg_60 {
			margin-bottom: 60px;
		}
		.plus_class div {
			margin: 0 5%;
			width: 90%;
			padding: 10px 0;
			display: flex;
		}
		.plus_class a.edit_market_goods {
			background: #ffa200;
			border-radius: 5px;
			margin-left: 1%;
		}
		.plus_class a.market_order {
			background: #06CCAB;
			border-radius: 5px;
			margin-left: 1%;
		}
		.plus_class a {
			margin-left: 5%;
			width: 100%;
			height: 40px;
			color: #fff;
			font-size: 16px;
			line-height: 40px;
			text-align: center;
			display: inline-block;
		}

		.vip {
			display: inline-block;
			width: 18px;height: 18px;
			background: url(./images/vip.png) center no-repeat;
			background-size: contain;
			vertical-align: middle;
			position: relative;
			top: -3px;
			margin: 0;
		}
		.vip_price {
			color: #FD1946;
			font-weight: 600;
			font-size: 16px;
			line-height: 18px;
		}
		.currency_txt {
			font-size: 10px;
			color: #999c9e;
		}


		.write_info li#li_delivery {
			margin-top: 10px;
			background: white;
		}
		.write_info li#li_delivery {
			padding: 10px 15px;
			border-width: 0 0 1px;
			line-height: 24px;
		}
		.write_info li a {
			min-height: 24px;
		}
		.write_info a {
			color: #323232;
			outline-style: none;
			text-decoration: none;
		}
		.write_info #li_delivery a strong {
			width: 100%;
		}
		.write_info #li_delivery a > * {
			display: table-cell;
			vertical-align: middle;
		}
		.showName, .showTel {
			color: #666;
		}
		#li_delivery i {
			display: inline-block;
			width: 6px;
			height: 11px;
			background: url(images/33-1_03.png) center no-repeat;
			background-size: contain;
			margin-right: 10px;
		}
		#li_delivery strong, b {
			font-weight: normal;
		}
		.w100 {
			width: 100%;
		}




		.spec_list .flex {
			display: flex;
		}
		.spec_list .flex_grow {
			flex-grow: 1;
			text-align: center
		}

		.spec_list .spec_val_name {
			padding: 1px 0;
		}
		.spec_list .list_spec_name {
			font-size: 12px;
			line-height: 22px;
			border-radius: 5px;
			padding: 2px 5px;
			margin-top: 2px;
			color: #fff;
			background: #f23030;
			width: 60px;
		}
		.spec_list .spec_price_single{
			width: 40px;
		}
		.spec_list .list_title_name {
			font-size: 12px;
			line-height: 22px;
			padding: 2px 5px 2px 0;
			margin-top: 2px;
			color: #333;
			background: #fff;
			width: 60px;
		}
		.spec_list .spec_title_name {
			padding: 1px 0;
		}
		.spec_list .spec_title_name.title {
			width: 40px;
		}
		.spec_list .spec_title_name div {
			font-size: 12px;
			line-height: 22px;
			color: #333;
			background: #fff;
		}
		.spec_list .spec_val_name div {
			font-size: 12px;
			line-height: 22px;
			color: #fff;
			background: #f23030;
		}
		.spec_list .spec_price {
			color: #ff4d45;
			width: 100%;
		}
		.right {
			float: right;
		}
		.clr {
			zoom: 1;
		}
		.spec_buy_num .wrap .plus a {
			width: 30px;
			float: left;
			height: 28px;
			border: #e5e5e5 1px solid;
			text-align: center;
			color: #333333;
			line-height: 28px;
			font-size: 20px;
			font-family: "Arial";
		}
		.spec_buy_num .wrap .plus input {
			width: 65px;
			text-align: center;
			float: left;
			border: #e5e5e5 1px solid;
			border-left: none;
			border-right: none;
			height: 28px;
			font-size: 14px;
			border-radius: 0px;
		}

		.normal .wrap .plus a {
			width: 30px;
			float: left;
			height: 28px;
			border: #e5e5e5 1px solid;
			text-align: center;
			color: #333333;
			line-height: 28px;
			font-size: 20px;
			font-family: "Arial";
		}
		.normal .wrap .plus input {
			width: 50px;
			text-align: center;
			float: left;
			border: #e5e5e5 1px solid;
			border-left: none;
			border-right: none;
			height: 28px;
			font-size: 14px;
			border-radius: 0px;
		}
		.normal .right {
			float: right;
		}
		.wait_close {
			color: #999999;
		}


        .input_width {
            width: 50% !important;
        }
		.add_properties {
			background: #06CCAB;
			border-radius: 5px;
			margin-left: 1%;
			width: 6rem;
			color: white;
			text-align: center;
			padding: 2px 5px;
		}
		.add_properties a {
			color: white;
		}
		.box_del {
			color: #428bca;
		}
		input {
			padding: 0 !important;
			text-align: center;
		}
	</style>

<script src="js/mui.js" type="text/javascript" charset="utf-8"></script>

<script id="pluscardLists" type="text/html">
	{{# var data=d; }}
	{{# console.log(data); }}
	<div class="commod detail_list">
		<input type="hidden" value="{{data.ticket}}" name="ticket" id="ticket"/>
		<input type="hidden" value="{{data.client}}" name="client" id="client"/>
		<input type="hidden" value="{{data.goods_id}}" name="goods_id" id="goods_id"/>

		<input type="hidden" value="{{data['Device-Id']}}" name="Device-Id" id="Device-Id"/>
		<input type="hidden" value="{{data.app_version}}" name="app_version" id="app_version"/>
		<input type="hidden" value="{{data.now_lang}}" name="now_lang" id="now_lang"/>

		<input type="hidden" class="limit_num" data-min_unit="{{d.now_goods.min_unit}}" data-min_num="{{d.now_goods['min_num']}}" data-stock_num="{{d.now_goods.stock_num}}"/>
		<div class="top clr">
			<h2 class="fl">{{L_('商品信息')}}</h2>
		</div>
		<div class="commod_list">
			<div class="img fl" style="width: 100px;height: 100px;">
				<img src="{{ data.now_goods.pic }}">
			</div>
			<div class="content" style="margin-left: 110px;height: 100px;">
				<h2>
					{{ data.now_goods.name }}
					{{# if (data.now_goods.number!='') { }}
					<span class="ecc">({{data.now_goods.number}})</span>
					{{# } }}
				</h2>
				<div class="clr">
					<div class="fl total">商品单位：
						{{ data.now_goods.unit }}
					</div>
				</div>
			</div>
		</div>


		<div class="user_list">
			<ul>
				<li class="clr" style="display: none;">
					<span class="fl">{{L_('状态')}}</span>
					<span class="fr">
					<div class="mui-row">
					    <div class="mui-col-sm-4">
					    	<div class="mui-input-row mui-radio mui-left">
								<label for=""><input disabled="disabled" value="1" type="radio" {{# if (data.now_goods['status']==1) {}}checked='checked'{{# } }}/> <L_>正常</L_></label>
							</div>
						</div>
					    <div class="mui-col-sm-5">
					    	<div class="mui-input-row mui-radio mui-left">
								<label for=""><input disabled="disabled" type="radio" value="0" {{# if (data.now_goods['status']==0) {}}checked='checked'{{# } }}/> <L_>下架</L_></label>
							</div>
						</div>
					</div>
					</span>
				</li>
				<li class="clr flex">
					<span class="fl">{{L_('最小批发倍数单位')}}</span>
					<span class="fr">
						<input name="min_unit" value="{{ data.now_goods.min_unit }}" class="min_unit input_width fr" type="number">
					</span>
				</li>
				<li class="clr flex">
					<span class="fl" style="margin-right: 25%;">{{L_('商品分类')}}({{L_('点击选择')}})</span>
					<div class="flex fr input_width" id="choose_category" cat_fid="{{ data.now_goods.cat_fid }}" cat_id="{{ data.now_goods.cat_id }}"></div>
				</li>

				{{# if (!data.now_goods.list) { }}

					<li class="clr">
						{{# if (1==data.config.merchant_type_switch) { }}
						<span class="fl">{{L_('普通批发价')}}</span>
						{{# } else { }}
						<span class="fl">{{L_('批发价')}}</span>
						{{# }  }}
						<span class="fr">
							<input name="wholesale_price" value="{{ data.now_goods.wholesale_price }}" class="wholesale_price input_width fr" type="text">
						</span>
					</li>
					{{# if (1==data.config.merchant_type_switch) { }}
					<li class="clr">
						<span class="fl">{{L_('VIP批发价')}}</span>
						<span class="fr">
							<input name="vip_wholesale_price" value="{{ data.now_goods.vip_wholesale_price }}" class="vip_wholesale_price input_width fr" type="text">
						</span>
					</li>
					{{# }  }}
					<li class="clr">
						<span class="fl">{{L_('最低批发数')}}</span>
						<span class="fr">
							<input name="min_num" value="{{ data.now_goods.min_num }}" class="min_num input_width fr" type="number">
						</span>
					</li>
					<li class="clr">
						<span class="fl">{{L_('库存')}}</span>
						<span class="fr">
							<input name="stock" value="{{ data.now_goods.stock }}" class="stock_info input_width fr" type="number">
						</span>
					</li>
					{{# if (data.express_list) { }}
						<li class="clr">
							<span class="fl">{{L_('运费模板')}}</span>
							<span class="fr flex">
								<select name="express_template_id" style="width:100%;"  data-spec="false">
									<option value="0" {{# if (data.now_goods['express_template_id']<=0) {}}selected='selected'{{# } }}>未选择运费模板</option>
									{{# for (var i in data.express_list) { }}
											<option {{# if (data.now_goods['express_template_id']==data.express_list[i]['id']) {}}selected='selected'{{# } }} class="express_info express_info_{{data.express_list[i]['is_type']}}" data-is_type="{{data.express_list[i]['is_type']}}" data-val="{pigcms{$vo['id']}" value="{{data.express_list[i]['id']}}">{{data.express_list[i]['name']}}</option>
									{{# }  }}
								</select>

								{{# for (var i in data.express_list) { }}
										<input class="express_template_is_freight_{{data.express_list[i]['id']}}" type="hidden" value="{{data.express_list[i]['is_freight']}}" />
								{{# }  }}

							</span>
						</li>
						<li class="clr">
							<span class="fl">{{L_('其他区域运费')}}</span>
							<span class="fr">
								<input name="express_fee" value="{{ data.now_goods.express_fee }}" class="express_fee input_width fr" type="number">
							</span>
						</li>
					{{# }  }}

					<li class="clr goods_weight" style="display: none;">
						<span class="fl">{{L_('重量')}}</span>
						<span class="fr">
							<input name="goods_weight" value="{{ data.now_goods.goods_weight }}" class="goods_weight input_width fr" type="text">
						</span>
					</li>
					<li class="clr goods_volume" style="display: none;">
						<span class="fl">{{L_('体积')}}</span>
						<span class="fr">
							<input name="goods_volume" value="{{ data.now_goods.goods_volume }}" class="goods_weight input_width fr" type="text">
						</span>
					</li>
				{{# }  }}

				<li class="clr pick_title" {{# if (data.pick_addr && data.now_goods['is_pick']==1) { }}style="border-bottom:none;"{{# }  }}>
					<span class="fl">{{L_('是否可以自提')}}</span>
					<span class="fr">
					<div class="mui-row">
					    <div class="mui-col-sm-4">
					    	<div class="mui-input-row mui-radio mui-left">
								<label for=""><input class="is_pick_click" name="is_pick" value="1" type="radio" {{# if (data.now_goods['is_pick']==1) {}}checked='checked'{{# } }}/> <L_>是</L_></label>
							</div>
						</div>
					    <div class="mui-col-sm-5">
					    	<div class="mui-input-row mui-radio mui-left">
								<label for=""><input class="is_pick_click" name="is_pick" type="radio" value="0" {{# if (data.now_goods['is_pick']==0) {}}checked='checked'{{# } }}/> <L_>否</L_></label>
							</div>
						</div>
					</div>
					</span>
				</li>
				{{# if (data.pick_addr) { }}
					{{# for (var n in data.pick_addr) { }}
						<li class="clr pick_content" style="border-bottom:none;padding: 5px;{{# if (data.now_goods['is_pick']!=1) { }}display:none;{{# }  }}">
							<div class="mui-row">
								<div class="mui-col-sm-4">
									<div class="mui-input-row mui-checkbox mui-left">
										<label for=""><input name="pick_info[{{n}}]" value="{{data.pick_addr[n]['pick_addr_id']}}" type="checkbox" {{# if (data.pick_addr[n]['is_checked']) {}}checked='checked'{{# } }}/> <L_>{{data.pick_addr[n]['name']}}</L_></label>
									</div>
								</div>
							</div>
						</li>
					{{# }  }}
				{{# }  }}
				<li class="clr white_list_title" {{# if (data.white_msg && data.now_goods['is_add_white_list']==1) { }}style="border-bottom:none;"{{# }  }}>
					<span class="fl">{{L_('是否加入白名单')}}</span>
					<span class="fr">
					<div class="mui-row">
					    <div class="mui-col-sm-4">
					    	<div class="mui-input-row mui-radio mui-left">
								<label for=""><input class="is_add_white_list_click" name="is_add_white_list" type="radio" value="1" {{# if (data.now_goods['is_add_white_list']==1) {}}checked='checked'{{# } }}/> <L_>是</L_></label>
							</div>
						</div>
					    <div class="mui-col-sm-5">
					    	<div class="mui-input-row mui-radio mui-left">
							<label for=""><input class="is_add_white_list_click" name="is_add_white_list" type="radio" value="0" {{# if (data.now_goods['is_add_white_list']==0) {}}checked='checked'{{# } }}/> <L_>否</L_></label>
							</div>
						</div>
					</div>
					</span>
				</li>
				<li class="clr">
					<span class="fl">
						<a style="color: #428bca;" href="javascript:;" class="give_white_list"><L_>选择白名单成员</L_></a>
					</span>
				</li>
				{{# if (data.white_msg) { }}
				<li class="clr white_list_content" {{# if (data.now_goods['is_add_white_list']!=1) { }}style="display:none;"{{# }  }}>
					<span class="fl">
						{{# for (var m in data.white_msg) { }}
							{{data.white_msg[m]['name']}}&nbsp;&nbsp;&nbsp;
						{{# }  }}
					</span>
				</li>
				{{# }  }}
				{{# if (data.now_goods.discount_info) { }}
					{{# var discount_info=data.now_goods.discount_info; }}
					<li class="clr discount_msg">
						{{# for (var l in discount_info) { }}
							<div class="question_box properties">
								<p class="question_info">
									<span>{{L_("批发满")}}</span>
									<input type="text" class="txt properties_name" value="{{discount_info[l]['num']}}" name="nums[]" style="width:50px"/>
									<span>{{L_("件，享受")}}</span>
									<input type="text" class="txt properties_num" value="{{discount_info[l]['discount']}}" name="discounts[]" style="width:50px"/>{{L_("折优惠")}}
									<a href="javascript:;" class="box_del">{{L_("删除")}}</a>
								</p>
							</div>
						{{# }  }}
						<p class="add_properties" id="add_properties" style="margin-left:12px;"><a href="javascript:;" title="{{L_('添加')}}" class="btn btn-sm btn-success">{{L_("新增优惠")}}</a></p>
					</li>
				{{# }  }}


				{{# if (data.now_goods.spec_list) { }}
					{{# if (data.express_list) { }}
						<li class="clr">
							<span class="fl">{{L_('运费模板')}}</span>
							<span class="fr flex">
								<select name="express_template_id" style="width:100%;"  data-spec="false">
									<option value="0" {{# if (data.now_goods['express_template_id']<=0) {}}selected='selected'{{# } }}>未选择运费模板</option>
									{{# for (var i in data.express_list) { }}
											<option {{# if (data.now_goods['express_template_id']==data.express_list[i]['id']) {}}selected='selected'{{# } }} class="express_info express_info_{{data.express_list[i]['is_type']}}" data-is_type="{{data.express_list[i]['is_type']}}" data-val="{pigcms{$vo['id']}" value="{{data.express_list[i]['id']}}">{{data.express_list[i]['name']}}</option>
									{{# }  }}
								</select>

								{{# for (var i in data.express_list) { }}
										<input class="express_template_is_freight_{{data.express_list[i]['id']}}" type="hidden" value="{{data.express_list[i]['is_freight']}}" />
								{{# }  }}
							</span>
						</li>
						<li class="clr">
							<span class="fl">{{L_('其他区域运费')}}</span>
							<span class="fr">
								<input name="express_fee" value="{{ data.now_goods.express_fee }}" class="express_fee input_width fr" type="number">
							</span>
						</li>
					{{# }  }}

				{{# }  }}



			</ul>
		</div>


		{{# if (data.now_goods.spec_list) { }}
		<div class="spec_info detail_list">
			<div class="top clr">
				<h2 class="fl">{{L_('规格信息')}}</h2>
			</div>
			<div class="user_list spec_list" style="border-bottom: #f1f1f1 1px solid;padding: 15px 10px;">

				{{# var spec_list=data.now_goods['spec_list']; }}
				<div class="flex" >
					<div class="list_title_name flex">
						{{# for(var k in spec_list) { }}
						{{# if (spec_list[k] && spec_list[k]['name']) { }}
						<div class="spec_title_name">
							<div>
								{{# if (k>0) { }}/{{# } }}{{spec_list[k]['name']}}
							</div>
						</div>
						{{# } }}
						{{# } }}
					</div>

					{{# if (1==data.config.merchant_type_switch) { }}
					&nbsp;&nbsp;
					<div class="spec_title_name title">
						<div>
							{{L_("普通批发价")}}
						</div>

            var category_list = data.category_list_json;
            if (category_list != undefined) {
                var father_category_list = $.parseJSON(category_list);
                var son_category_list = null, cat_fid = parseInt($('#choose_category').attr('cat_fid')), cat_id = parseInt($('#choose_category').attr('cat_id'));

                if (cat_fid == 0) {
                    area_dom += '<option value="0" selected="selected" >'+L_("选择分类")+'</option>';
                } else {
                    area_dom += '<option value="0">'+L_("选择分类")+'</option>';

                $.each(father_category_list, function(i, item){
                    if (item.id == cat_fid) {
                        if (item.son_list != undefined) {

                            show_son_category(item.son_list, cat_id)
                        }

                    } else {
                        area_dom += '<option value="'+item.id+'">'+item.name+'</option>';
                    }
                });

    function show_son_category(son_category_list, cat_id)
    {
        var area_dom = '<select id="cat_id" name="cat_id" class="fr" style="margin-right:10px;">', now_cat_id = 0, isFirst = 0;
        $.each(son_category_list, function(i, item){
            if (cat_id == 0) {
                if (isFirst == 0) {
                    now_cat_id = item.id;
                    area_dom += '<option value="'+item.id+'" selected="selected" >'+item.name+'</option>';
                } else {
                    area_dom += '<option value="'+item.id+'">'+item.name+'</option>';
                }
                isFirst ++;
            } else {
                if (item.id == cat_id) {
                    now_cat_id = item.id;
                    area_dom += '<option value="'+item.id+'" selected="selected" >'+item.name+'</option>';
                } else {
                    area_dom += '<option value="'+item.id+'">'+item.name+'</option>';
                }
            }
        });
        area_dom += '</select>';
        if (document.getElementById('cat_id')) {
            $('#cat_id').replaceWith(area_dom);
        } else if(document.getElementById('cat_fid')) {
            $('#cat_fid').after(area_dom);
        } else {
            $('#choose_category').prepend(area_dom);
        }
    }
