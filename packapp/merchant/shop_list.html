<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
    <title>快店管理</title>
    <link href="css/mui.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="css/shop_list.css"/>
    <style type="text/css">
        .mui-card .mui-card-content button {
            width: 28%;
        }
        .quick-switch-shop-btn {
            color: #333!important;
            margin-right: 10px;
        }
        #quickSwitchShopPopup .mui-card .mui-card-header {
            background-color: #fff;
            color: #333;
            font-weight: bold;
            justify-content: center;
            padding: 14px 10px;
            box-sizing: border-box;
        }
        #quickSwitchShopPopup .mui-card .mui-card-content {
            min-height: 100px;
            height: auto;
        }
        .close-shop-reason-input {
            margin: 20px 10px;
            width: calc(100% - 20px)!important;
            font-size: 15px;
        }
        .switch-shop-btn-wrap {
            padding: 10px 0 40px 0;
            box-sizing: border-box;
        }
        .switch-shop-btn-wrap .switch-shop-btn {
            flex: 1;
            margin: 0 10px!important;
            height: 40px;
            line-height: 40px;
            border-radius: 6px;
            padding: 0!important;
        }
        .switch-shop-btn-wrap .switch-shop-btn.switch-shop-confirm-btn {
            background-color: #1EBBF5;
            color: #fff;
        }
        .switch-shop-btn-wrap .switch-shop-btn.switch-shop-cancel-btn {
            background-color: #F7F7F7;
        }
    </style>
</head>
<body>
<header class="mui-bar mui-bar-nav">
    <div class=" mui-icon mui-icon-left-nav mui-pull-left" data-url="back"></div>
    <h1 class="mui-title"><span class="ashop"><L_>快店管理</L_></span></h1>
</header>
<div class="mui-content shop-list">

</div>
<!--更多-->
<div id="moreList" class="mui-popover">
    <div class="mui-card">
        <div class="mui-card-header" style="margin-left: 0px;">
            <p style="margin-left: 15px;">
                <L_>更多操作</L_>
            </p>
            <sub class="mui-pull-right"></sub>
        </div>
        <div class="mui-card-content">
            <div class="mui-scroll-wrapper">
                <div style="text-align: center;padding: 50px 20px;">
                    <div style="margin-bottom: 20px;">
                        <button style="width: 68%;" type="button" class="shop_discount"><i></i>
                            <L_>营销中心</L_>
                        </button>
                    </div>
                    <div>
                        <button style="width: 68%;" type="button" class="clone_goods"><i></i>
                            <L_>克隆商品</L_>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<!--克隆-->
<div id="middlePopover" class="mui-popover">
    <div class="mui-card">
        <!--页眉，放置标题-->
        <div class="mui-card-header">
            <p class="L_">选择将商品克隆至哪个店铺(可多选)</p> <sub class="mui-pull-right"></sub>
        </div>
        <!--内容区-->
        <div class="mui-card-content">
            <div class="mui-scroll-wrapper">
                <div class="mui-scroll">

                </div>
            </div>
        </div>
        <div class="mui-card-footer">
            <button type="button" class="L_">保 存</button>
        </div>
    </div>
</div>
<!-- 一键开||关店 -->
<div id="quickSwitchShopPopup" class="mui-popover">
    <div class="mui-card">
        <div class="mui-card-header">
            <L_>紧急</L_>
        </div>
        <div class="mui-card-content">
            <input type="text" class="close-shop-reason-input" style="color: #333;" value="" placeholder="请输入" />
            <div class="flex justify-between align-center switch-shop-btn-wrap">
                <button type="button" class="switch-shop-btn switch-shop-confirm-btn"></button>
                <button type="button" class="switch-shop-btn switch-shop-cancel-btn">
                    <L_>取消</L_>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="js/fastclick.js"></script>
<script src="js/mui.min.js"></script>
<script type="text/javascript" src="js/mui.poppicker.js"></script>
<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
<script src="js/laytpl.js" type="text/javascript" charset="utf-8"></script>
<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
<script src="js/common.js" type="text/javascript" charset="utf-8"></script>
<!-- 关闭模板渲染 -->
<script id="pluscardLists" type="text/html">
{{# for(var i = 0, len = d.length; i < len; i++){ }}
<div class="mui-card" data-id="{{ d[i].store_id }}" data-is_close="{{d[i].is_close}}">
    <div class="mui-card-header">
        <span><i></i> {{ L_('店铺编号') }} <b>{{ d[i].store_id }}</b></span>
        {{# if(d[i].sid>0){ }}
        <div class="flex justify-between align-center">
            <span class="quick-switch-shop-btn">{{ d[i].is_close == 0?L_('一键关店'):L_('一键开店') }}</span>
            <p class="penci_shop"><i></i></p>
        </div>
        {{# } else { }}
        <button type="button" class="perfect_message penci_shop">{{ L_('完善店铺信息') }}</button>
        {{# } }}

    </div>
    <div class="mui-card-content">
        <h4>{{ d[i].name }}</h4>
        <h5><a href="tel: {{ d[i].phone }}">{{ d[i].phone }} <b></b></a></h5>
        {{# if(d[i].sid>0){ }}
        <div class="btn_border">
            <button class="view_order" type="button"><i></i> {{ L_('查看订单') }}</button>
            <button type="button" class="merchandise_control"><i></i> {{ L_('商品管理') }}</button>
            <button type="button" class="more-option"><i></i> {{ L_('更多功能') }}</button>
        </div>
        <div style="padding-bottom: 10px;">


        </div>
        {{# } }}
    </div>
</div>

{{# } }}
</script>
<script type="text/javascript" charset="utf-8">
var ticket = common.getCache('ticket')
var client = common.checkAndroidApp() ? 2 : (common.checkIosApp() ? 1 : 0)
var ashop = common.getCache('ashop')
var isclosed = true
$('.ashop').text(ashop)
$('title').html(L_(ashop + ' ' + L_('店铺管理')))
var store_idAll = common.getCache('store_idAll')
var shopId = 0//初始化店铺id
var flag = false
mui.init()
//初次加载页面渲染数据
common.http('WapMerchant&a=shopList', { 'ticket': ticket, 'client': client, 'store_id': store_idAll }, function (data) {
  if (data.length == 0) {
    mui.alert(L_('您没有添加店铺，或店铺没有开启'+ashop+'功能，或店铺正在审核中。'))
  }
  laytpl(document.getElementById('pluscardLists').innerHTML).render(data, function (html) {
    $('.mui-content').html(html)
  })
})
var mask = mui.createMask()//callback为用户点击蒙版时自动执行的回调；

//点击更多功能
mui('.mui-content').on('tap', '.more-option', function (e) {
  shopId = $(this).parents('.mui-card').attr('data-id')
  mask.show()
  mui('#moreList').popover('show')
  $('body').css('overflow', 'hidden')
})

//点击克隆商品
mui('#moreList').on('tap', '.clone_goods', function () {
    
  mui('#moreList').popover('hide')
  mui('#middlePopover').popover('show')
  common.http('WapMerchant&a=shopList', { 'ticket': ticket, 'client': client }, function (data) {
    var str = ''
    $.each(data, function (i, val) {
      if (val.store_id != shopId) {
        isclosed = false
        str += '<div class="mui-input-row mui-checkbox" data-shop_id=' + val.store_id + '><label><i></i> ' + val.name + '</label><input name="checkbox1" type="checkbox"></div>'
      }
    })
    $('.mui-scroll').html(str)
  })
  //点击保存按妞

  mui('#middlePopover').on('tap', 'button', function () {
    if (isclosed) {
        flag = false
      mui('#middlePopover').popover('hide')
      mask.close()
      $('body').css('overflow-y', 'scroll')
    } else {
        if(flag){
            return false
        }
        flag = true

      var ids = []
      $.each($('.mui-scroll>div'), function (i, val) {
        if ($(this).find('input').is(':checked')) {
          ids.push($(this).attr('data-shop_id'))
        }
      })
      common.http('WapMerchant&a=cloneGoods', {
        'ticket': ticket,
        'client': client,
        'store_id': shopId,
        'store_ids': ids
      }, function (data) {
        if (data.length == 0) {
          mui.toast(L_('克隆成功'))
          flag = false
        }
      })
      mui('#middlePopover').popover('hide')
      mask.close()
      $('body').css('overflow-y', 'scroll')
    }

  })
})

//点击蒙版
mui('body').on('tap', '.mui-backdrop', function () {
  mui('#middlePopover').popover('hide')
  mui('#moreList').popover('hide')
  mui('#quickSwitchShopPopup').popover('hide')
  mask.close()
  $('body').css('overflow-y', 'scroll')
})
//点击关闭按钮
mui('#middlePopover,#moreList,#quickSwitchShopPopup').on('tap', 'sub', function () {
  mui('#moreList').popover('hide')
  mui('#middlePopover').popover('hide')
  mui('#quickSwitchShopPopup').popover('hide')
  mask.close()
  $('body').css('overflow-y', 'scroll')
})

//点击完善信息
mui('.mui-content').on('tap', '.penci_shop', function () {
  shopId = $(this).parents('.mui-card').data('id')
  common.setCache('shopId', shopId)
  openWindow({
    url: 'fastStore_message.html',
    id: 'fastStore_message'
  })
})
//点击商品管理
mui('.mui-content').on('tap', '.merchandise_control', function () {
  shopId = $(this).parents('.mui-card').data('id')
  common.setCache('shopId', shopId)
  openWindow({
    url: 'commodity_management.html?shop_type=1',
    id: 'commodity_management'
  })
})
mui('.mui-scroll-wrapper').scroll({
  deceleration: 0.0005 //flick 减速系数，系数越大，滚动速度越慢，滚动距离越小，默认值0.0006
})
//查看订单
mui('.mui-content').on('tap', '.view_order', function (e) {
  var store_id = $(this).parents('.mui-card').attr('data-id')
  openWindow({
    url: 'fastList.html?store_id=' + store_id  +'&shop_type=1',
    id: 'fastList'
  })
})
// 营销中心
mui('#moreList').on('tap', '.shop_discount', function (e) {
  // var store_id=$(this).parents('.mui-card').attr('data-id');
  openWindow({
    url: 'shop_sell_center.html?store_id=' + shopId +'&shop_type=1',
    id: 'fastList'
  })
})

// 一键开店 || 一键关店
let isClose = 0 // 1-关店，0-开店
mui('.mui-content').on('tap', '.quick-switch-shop-btn', function (e) {
    shopId = $(this).parents('.mui-card').attr('data-id')
    isClose = $(this).parents('.mui-card').attr('data-is_close')
    $('#quickSwitchShopPopup .mui-card .mui-card-header').html(`<L_>紧急${isClose == 0?'关店':'开店'}</L_>`)
    $('#quickSwitchShopPopup .close-shop-reason-input').prop('placeholder', isClose == 0?L_('输入关店理由'):L_('输入开店理由'));
    $('#quickSwitchShopPopup .close-shop-reason-input').val('')
    $('#quickSwitchShopPopup .switch-shop-btn.switch-shop-confirm-btn').html(`<L_>确认${isClose == 0?'关店':'开店'}</L_>`)
    mask.show()
    mui('#quickSwitchShopPopup').popover('show')
    $('body').css('overflow', 'hidden')
})

//一键开店 || 一键关店点击确认按钮
mui('#quickSwitchShopPopup').on('tap', '.switch-shop-btn.switch-shop-confirm-btn', function () {
    let is_close = isClose == 0?1:0 // 1-关店，0-开店
    common.http('WapMerchant&a=changeStoreShopState', {
        'ticket': ticket,
        'store_id': shopId,
        'is_close': is_close,
        'close_reason': $('#quickSwitchShopPopup .close-shop-reason-input').val()
    }, function (data) {
        mui.toast(L_('操作成功'))
        $.each($('.shop-list .mui-card'), function (i, val) {
            if(shopId == $(this).attr('data-id')) {
                $(this).find('.quick-switch-shop-btn').html(is_close == 0?L_('一键关店'):L_('一键开店'))
                $(this).attr('data-is_close',is_close)
            }
        })
        mui('#quickSwitchShopPopup').popover('hide')
        mask.close()
        $('body').css('overflow-y', 'scroll')
    })
})

//一键开店 || 一键关店点击取消按钮
mui('#quickSwitchShopPopup').on('tap', '.switch-shop-btn.switch-shop-cancel-btn', function () {
    mui('#quickSwitchShopPopup').popover('hide')
    mask.close()
    $('body').css('overflow-y', 'scroll')
})
</script>
</body>
</html>
