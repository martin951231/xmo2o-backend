<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
	<title>跑腿</title>
	<link rel="stylesheet" type="text/css" href="css/mui.css" />
	<link rel="stylesheet" type="text/css" href="css/printer.css" />
	<style type="text/css" scoped>
		.mui-icon-left-nav-iframe:before {
			content: '\e471';
		}

		.mui-icon-left-nav-iframe {
			margin-right: -3px;
		}
	</style>
</head>

<body>
	<header class="mui-bar mui-bar-nav">
		<div class=" mui-icon mui-icon-left-nav-iframe mui-pull-left" data-url="back"></div>
		<h1 class="mui-title">
			<L_>跑腿</L_>
		</h1>
	</header>
	<div class="mui-content">
		<iframe id="iframe" src="#" width="100%" height="768px" style="border:0;scrollbar-width: none;display: none;">

		</iframe>
	</div>

	<script src="js/fastclick.js"></script>
	<script src="js/mui.min.js"></script>
	<script src="js/jquery-1.9.1.min.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/layer/layer.m.js" type="text/javascript" charset="utf-8"></script>
	<script src="js/common.js?t=10" type="text/javascript" charset="utf-8"></script>
	<script type="text/javascript">

		$(function () {
			var iframe = $('#iframe');
			var iframeWindowHref = ''

			//获取手机屏幕高度
			var screenHeight = window.screen.height;
			console.log('获取高度结果', screenHeight)

			//IOS手机底部安全高度
			var safeHeight = 44;
			if (screenHeight == 812 || screenHeight == 896) {
				safeHeight = 120;
			}
			iframe.css('height', screenHeight - safeHeight);

			//手机顶部刘海屏安全高度
			var topHeight = 0;
			if (screenHeight == 812 || screenHeight == 896) {
				topHeight = 5;
				$('.mui-content').css('margin-top', topHeight);
			}

			//获取当前访问地址url参数
			var url = $.getUrlParam('url')
			iframe.attr('src', url)
			iframe.css('display', 'block')


			$('.mui-icon-left-nav-iframe').click(function (e) {
				iframeWindowHref = iframe[0].contentWindow.location.href;
				
				e.stopPropagation();
				e.preventDefault();
				if (iframeWindowHref.indexOf('pages/runErrands/confirm') != -1) {
					if (common.checkApp()) {
						if (common.checkAndroidApp()) {
							window.pigcmspackapp.closewebview(2);
						} else {
							common.iosFunction('closewebview/2', { name: 'closewebview', type: '2' });
						}
					} else {
						window.history.go(-1);
					}
				} else {
					window.history.go(-1);
				}
				return false;
			});
		});
	</script>
</body>

</html>
