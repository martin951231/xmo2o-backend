        <script type="text/javascript">
            //修改价格
			mui('#data').on('tap','.change_price',function(e){
		 
            	e.stopPropagation();
                $('#order_id').val($(this).data('id'));
                $('#order_money_now').html($(this).data('old_price'));
                $(".amend, .mask").show();
                return false;
            })

            //修改价格确认
            $(document).on('click', '.ensure_change', function(e){
                var price = $('#change_price').val();
                console.log(price)
                console.log($('#order_id').val())

                common.http('Merchantapp&a=change_appoint_order_price',{'order_id':$('#order_id').val(),price:price, noTip:true}, function(data){
                    console.log(data)
                    $(".amend, .mask").hide();
                    $('.old_price').html(price);
                    $('.change_price').data('old_price',price);
                    $('#change_price').val('');
                    motify.log('修改成功');
                    
                    order_list = order_list.map(item => {
                        if (item.product_id > 0) {
                            item.product_price = price
                        } else {
                            item.appoint_price = price
                        }
                        return item
                    })
                    laytpl(document.getElementById('pluscardLists').innerHTML).render(order_list, function(html){
                        $('.kd_entry ul').html('');
                        $('.kd_entry ul').append(html);
                    });
                    
                    return false;
                });
            });

            $(".mask,.seek .del, .close,.amend .del").click(function(){
                $(".seek,.mask,.amend").hide();
            });
        </script>
