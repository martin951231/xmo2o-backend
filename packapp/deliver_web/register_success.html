<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>注册成功</title>
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/vant.css">
    <link rel="stylesheet" href="./css/common.css">
    <script src="scripts/jquery-1.8.3.min.js"></script>
    <script src="scripts/vue@2.6.10.min.js"></script>
    <script src="scripts/vant.min.js"></script>
</head>

<body>
    <div id="app">
        <!-- <section id="header" class="header bg-white"></section> -->
        <div id="content">
            <div class="success-img">
                <img src="./images/success.png" />
            </div>
            <div class="success-desc">
                {{L_('您已提交注册成功，平台将会及时进行审核，审核结果将会通过短信通知到你')}}
                <span v-if="phone">
                    ，{{L_('如有疑问可拨打电话')}}
                    <span class="phone">{{phone}}</span>
                </span>
            </div>
            <div class="bottom" v-if="showBtn">
                <div class="download" @click="downLoad">{{L_('下载配送员app')}}</div>
                <div class="desc">{{L_('点击下载，即刻加入配送团队')}}~</div>
            </div>
        </div>

    </div>
</body>
<script src="scripts/common.js?t=1"></script>
<script src="./scripts/work/register_success.js?t=1"></script>
<style>
    #app {
        text-align: center;
        position: fixed;
        top: 50px;
        top: calc(50px + constant(safe-area-inset-top));
        top: calc(50px + env(safe-area-inset-top));
        left: 40px;
        right: 40px;
        bottom: 20px;
        bottom: calc(20px + constant(safe-area-inset-bottom));
        bottom: calc(20px + env(safe-area-inset-bottom));
        height: auto;
    }

    .success-img img {
        width: 80px;
        height: 80px;
    }

    .success-desc {
        margin-top: 20px;
        line-height: 30px;
        vertical-align: middle;
        font-size: 14px;
        color: #666666;
    }

    .success-desc .phone {
        color: #27A3F7;
    }

    .bottom {
        position: fixed;
        bottom: 50px;
        left: 0;
        right: 0;
    }

    .download {
        width: 160px;
        background-color: #27A3F7;
        height: 40px;
        border-radius: 4px;
        margin: 10px auto;
        line-height: 40px;
        font-size: 16px;
        color: #ffffff;
        font-weight: bold;
    }

    .desc {
        color: #999999;
    }
</style>

</html>
