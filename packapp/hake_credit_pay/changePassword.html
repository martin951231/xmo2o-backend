<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>更改密码</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/> 
		<meta name="format-detection" content="address=no"/>   
		<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/pigcms.css" rel="stylesheet"/> 
		<style>
		.weui-dialog__bd{
			text-align: center
		}
		</style>
	</head>
	<body> 
		 <div class="">
		 	<div class="pwdTil center "><label><L_>请输入您旧的4位数字支付密码</L_></label></div> 
			 <div class="pwdInput center">
				 <div class="input_pwd">
					<span class="pwd_Txt" id="pwd_Txt0"></span>
                    <span class="pwd_Txt" id="pwd_Txt1"></span> 
					<span class="pwd_Txt" id="pwd_Txt2"></span>
					<span class="pwd_Txt" id="pwd_Txt3"></span>
					<div class="clear"></div>  
				 </div>
				<input type="tel"  name="password" autofocus='autofocus' onkeyup="this.value=this.value.replace(/[^\d]/g,'');" id="password"  maxlength="4" oninput="if(value.length>4)value=value.slice(0,4)" />
			 </div> 
		 </div> 
		 <div class="bottmButton">
		 	<a href="javascript:;"><label><L_>下一步</L_></label><i class="iconfont">&#xe600;</i></a>
		 </div> 
		<script src="scripts/jquery-1.8.3.min.js"></script>
		
		<script src="scripts/common.js?8759"></script>
		<script src="scripts/weui/weui.min.js?8759"></script>
		<script src="scripts/work/changePassword.js"></script>  
		<script>   
		   // common.androidKeybordTop(); 
			common.iosKeybordTop('password'); 
			if(!common.checkIos()){
				$('#password').focus();
			}  
			$('.input_pwd').click(function(){
				$('#password').focus();
			}) 
			
		 
			$('input[name="password"]').on('keyup',function(e){   
			   	if($('#password').val() == ''){
					$('.input_pwd .pwd_Txt').css('-webkit-text-security','none');
				}  
				var input_array=$(this).val().split(''); 
				input_array.forEach(function( val, index ) {
					$('.input_pwd #pwd_Txt'+index+'').text(input_array[index]); 
					setTimeout(function(){ 
						$('.input_pwd #pwd_Txt'+index+'').css('-webkit-text-security','disc');
					},200)
				})   
				var _this = $(this);
				var ev = e; 
				keyupfun(_this,ev);  
				if(input_array.length == 4){
					$('.bottmButton label').addClass('red');
				}else{
					$('.bottmButton label').removeClass('red');
				}
			})  
			function keyupfun(value,e){
				var k = e.keyCode;
				var val = e.key;
				if(k == 8){ //8是backspace的keyCode
					var input_array=$('input[name="password"]').val().split('');  
					var len=input_array.length;
					$('.input_pwd .pwd_Txt').text(''); 
						input_array.forEach(function( val, index ) { 
						$('.input_pwd #pwd_Txt'+index+'').text(input_array[index]); 
					})   
				}else{
					return false;
				}
			}    
          
			$('.bottmButton').click(function(){
				if($('.bottmButton label').hasClass('red')){ 
					var numberPwd=$('input[name="password"]').val();
					common.http('Hake_credit&a=check_old_pwd',{pay_pwd:numberPwd},function(data){  
						 redirect_self('setNewsPwd.html');
						
					},function(errData){
                        $('.input_pwd .pwd_Txt').text('');
                        $('#password').val('');
						var msg = errData.errorMsg;
						if(msg == 'emptypwd'){
							weui.alert(L_('您还未设置支付密码'));
						}else if(msg == 'wrong'){
							weui.alert(L_('密码输入错误，请重新输入'), function(){
								$('.input_pwd .pwd_Txt').text('');
							    $('#password').focus();
						        $('.input_pwd .pwd_Txt').css('-webkit-text-security','none');

							});
						}else if(msg == 'wrongmany'){
							weui.confirm(L_('密码输入错误过多，请找回密码或明天再试。'), {
								buttons: [{
									label: L_('知道了'),
									type: 'gray',
									onClick: function(){
										history.go(-1);
									}
								}, {
									label: L_('找回密码'),
									type: 'primary',
									onClick: function(){
										redirect_self('inputCode.html');
									}
								}]
							});
						}else{
							weui.alert(msg);
						}
					}); 
				}
			});
 	
        </script> 
	</body>
</html>
