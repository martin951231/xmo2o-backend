<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>我的银行卡</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/> 
		<meta name="format-detection" content="address=no"/>  
		<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/pigcms.css" rel="stylesheet"/> 
		<style>
		 .weui-dialog__bd:first-child{
			 text-align: center
		 }
		</style>
	</head>
	<body> 
		<div class="myBank">   
			<ul class="ul_bankAddList">  
			 	<li><div class="bankAdd" id="addBank"><i class="iconfont">&#xe6ec;</i><span><L_>添加我的银行卡</L_></span></div></li> 
			 	<li><div class="bankAdd"  id="setPwd"><i class="iconfont">&#xe630;</i><span><L_>支付密码设置</L_></span></div></li>
			 </ul>   
			<div class="bg02"><img src="images/bg02.png"></div>
			<div class="bg03"><img src="images/bg03.png"></div>
		</div>  

		<!-- <p class="overp p1">CBSA</p>
		<p class="overp p2">Debit Card</p> -->
		<script id="listTpl" type="text/html">
			{{# for(var i = 0, len = d.length; i < len; i++){ }}
				<li class="li_bankList" data-id="{{ d[i].id }}">
			 		<div class="bankList flex"> 
			 			<div class="bankListFl bankList flex">
			 				<span class="bankImg">
				 				<img src="images/{{ d[i].card_type }}.png"  />
				 			</span>
				 			<div class="bankInfo"> 
					 			<p class="overp p3" >
									<label>{{ d[i].card_first_four }}</label>
									<label class="lab1">****</label> 
									<label class="lab1">****</label> 
									<label>{{ d[i].card_last_four }}</label>
					 				 
					 			</p>
				 			</div> 
			 			</div>
			 			<div class="bankGo"><i class="iconfont">&#xe600;</i></div>
			 		</div>
			 	</li>
			{{# } }}
		</script>
		<script src="scripts/jquery-1.8.3.min.js"></script>
		<script src="scripts/fastclick.js"></script>
		<script src="scripts/common.js"></script>
		<script src="scripts/weui/weui.min.js"></script>
		<script src="scripts/work/index.js"></script>  
	</body>
</html>
