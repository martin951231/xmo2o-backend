<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>设置支付密码</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/>
		<meta name="format-detection" content="address=no"/>  
		<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/pigcms.css" rel="stylesheet"/>  
	</head>
	<body> 
		<div class="">
		 	<p class="pwdTil center "><L_>请输入验证码，以验证身份</L_></p>   
			 <div class="pwdInput center">
				<div class="codeInput">
					<span class="code_Txt" id="code_Txt0"></span>
					<span class="code_Txt" id="code_Txt1"></span> 
					<span class="code_Txt" id="code_Txt2"></span>
					<span class="code_Txt" id="code_Txt3"></span>
					<div class="clear"></div>  
				</div>
				<input type="UITextContentTypeOneTimeCode"  name="code" autofocus='autofocus' id="code" onkeyup="this.value=this.value.replace(/[^\d]/g,'');"  maxlength="4" oninput="if(value.length>4)value=value.slice(0,4)" />
			</div> 
			 
		</div> 
		<div class="bottmButton">
		 	<a href="javascript:;"><label><L_>下一步</L_></label><i class="iconfont">&#xe600;</i></a>
		</div> 
		<script src="scripts/jquery-1.8.3.min.js"></script>
	
		<script src="scripts/common.js?8759"></script>
		<script src="scripts/weui/weui.min.js?8759"></script> 
		<script>  
			var page_from = common.getCache('from',true);
			var pay_pwd = common.getCache('pay_pwd',true);  
			var resetPwd = common.getCache('resetPwd',true);
			var userInfo = common.getCache('userInfo',true);   
			if(!userInfo.phone){
				weui.confirm(L_('请先绑定手机号!'), {
					buttons: [{
						label: L_('确定'), 
						onClick: function(){  
							openWebviewUrl('back')
						} 
					}]
				});  
			 } 
			
			if(resetPwd == '1' ){ 
				document.title=L_('重新设置支付密码');
			}  
			 
			common.androidKeybordTop();
			common.iosKeybordTop('code'); 
			if(!common.checkIos()){
				// $('#code').focus();
			}  
			$('.pwdInput').click(function(){
				$('#code').focus();
			}) 
 
            var input_array='' 
			$('input[name="code"]').on('keyup',function(e){   
				if($('#code').val() == ''){
					$('.input_pwd .pwd_Txt').css('-webkit-text-security','none');
				}   
				input_array=$(this).val().split(''); 
				input_array.forEach(function( val, index ) {
					$('.codeInput #code_Txt'+index+'').text(input_array[index]);  
				})   
				var _this = $(this);
				var ev = e; 
				keyupfun(_this,ev);  
				if(input_array.length == 4){
					$('.bottmButton label').addClass('red');
				}else{
					$('.bottmButton label').removeClass('red');
				}
			})  
			function keyupfun(value,e){
				var k = e.keyCode;
				var val = e.key;
				if(k == 8){ //8是backspace的keyCode
					var input_array=$('input[name="code"]').val().split('');  
					var len=input_array.length;
					$('.codeInput .code_Txt').text(''); 
						input_array.forEach(function( val, index ) { 
						$('.codeInput #code_Txt'+index+'').text(input_array[index]); 
					})   
				}else{
					return false;
				}
			}    
			
			//发送验证码
			common.http('Login&a=sendCodeUser',{},function(data){ 
				if(page_from == 'pay' && pay_pwd == false){
					weui.confirm(L_('还未设置支付密码，为了您的支付安全，请您先设置支付密码，验证码已发送到'+userInfo.showPhone), {
						buttons: [{
							label: L_('确定'), 
							onClick: function(){  
								$('#code').focus();
							} 
						}]
					});  
				}else{
					weui.alert(L_('验证码已发送至您账号绑定的手机'),function(){
						$('#code').focus();
					});
				}
				
				if(data.errorCode == 20046036 ){				
				} 
				 
			},function(errData){   
				weui.confirm(errData.errorMsg, {
						buttons: [{
							label: L_('返回'),
							type: 'gray',
							onClick: function(){
								history.go(-1);
							}
						}, {
							label: L_('重试'),
							type: 'primary',
							onClick: function(){
								location.reload();
							}
						}]
					});

			});
		  
			$('.bottmButton').click(function(){
				if($('.bottmButton label').hasClass('red')){
					var code = $('#code').val(); 
					common.http('Login&a=verifyCodeUser',{code:code},function(data){  
						if(page_from == 'pay'){    
							if(pay_pwd == false){ 
                                redirect_self('setNewsPwd.html?id='+urlParam.id);
							}else if(resetPwd == '1'){
								redirect_self('setNewsPwd.html?id='+urlParam.id);
							}
							else{
								redirect_self('payPassword.html');
							}
						}else{
							redirect_self('setNewsPwd.html');
						}
					}); 

				}
			})  
			
		</script>
	</body>
</html>
