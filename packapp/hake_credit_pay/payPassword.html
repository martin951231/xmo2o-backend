<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<title>请输入支付密码</title>
		<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
		<meta http-equiv="pragma" content="no-cache"/>
		<meta name="apple-mobile-web-app-capable" content="yes"/>
		<meta name='apple-touch-fullscreen' content='yes'/>
		<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
		<meta name="format-detection" content="telephone=no"/> 
		<meta name="format-detection" content="address=no"/>   
		<link href="scripts/weui/weui.min.css" rel="stylesheet"/>
		<link href="css/pigcms.css" rel="stylesheet"/> 
		<style>
		.weui-dialog__bd{
			text-align: center
		} 
        .pwdInput input{
            left: 0;
            text-indent:0em;
            margin-left:0
        }
		</style>
	</head>
	<body> 
		 <div class="">
		 	<p class="pwdTil center"><L_>请输入4位数字支付密码</L_></p> 
			 <div class="pwdInput center">
				<div class="input_pwd">
					<span class="pwd_Txt" id="pwd_Txt0"></span>
					<span class="pwd_Txt" id="pwd_Txt1"></span> 
					<span class="pwd_Txt" id="pwd_Txt2"></span>
					<span class="pwd_Txt" id="pwd_Txt3"></span>
					<div class="clear"></div>  
				</div>
				<input type="tel"  name="password" autofocus='autofocus' id="password" onkeyup="this.value=this.value.replace(/[^\d]/g,'');"  maxlength="4" oninput="if(value.length>4)value=value.slice(0,4)"  style="-webkit-text-security:disc"/>
			</div> 
			 <div class="center forgetPwd" style="display: block"><L_>忘记支付密码？</L_></div> 
		 </div> 
		 <!-- <div class="bottmButton">
		 	<a href="javascript:;"><label class="L_">完成</label></a>
		 </div>  -->
		<script src="scripts/jquery-1.8.3.min.js"></script>
		
		<script src="scripts/common.js?8759"></script>
		<script src="scripts/weui/weui.min.js?8759"></script>
		<!-- <script src="scripts/work/changePassword.js"></script> -->
		 
		<script>   
            // $('#password').focus(); 
			if(!common.checkIos()){
				$('#password').focus();
			}   
			$('.pwdInput').click(function(){
				$('#password').focus();
			}) 
			$('input[name="password"]').on('keyup',function(e){   
				if($('#password').val() == ''){
					$('.input_pwd .pwd_Txt').css('-webkit-text-security','none');
				}   
				var input_array=$(this).val().split(''); 
				input_array.forEach(function( val, index ) {
					$('.input_pwd #pwd_Txt'+index+'').text(input_array[index]); 
					setTimeout(function(){ 
						$('.input_pwd #pwd_Txt'+index+'').css('-webkit-text-security','disc');
					},200)
				})   
				var _this = $(this);
				var ev = e; 
				keyupfun(_this,ev);  
				if(input_array.length == 4){  
                     $('#password').blur();
					finshPay()
				} 
			})  
			function keyupfun(value,e){
				var k = e.keyCode;
				var val = e.key;
				if(k == 8){ //8是backspace的keyCode
					var input_array=$('input[name="password"]').val().split('');  
					var len=input_array.length;
					$('.input_pwd .pwd_Txt').text(''); 
						input_array.forEach(function( val, index ) { 
						$('.input_pwd #pwd_Txt'+index+'').text(input_array[index]); 
					})   
				}else{
					return false;
				}
			}   
			// 输入密码后完成支付
			function finshPay(){ 
				var page_from = common.getCache('from',true);
				var numberPwd=$('input[name="password"]').val();
				var postData = {pay_pwd:numberPwd}; 
				postData.id = urlParam.id;
				postData.orderid = common.getCache('orderid',true);
				postData.is_pay = true;
				common.http('Hake_credit&a=check_old_pwd',postData,function(data){   
					weui.confirm(L_('支付成功'), {
						buttons: [{
							label: L_('确定'), 
							onClick: function(){ 
								redirect_self(data);
							}
						}]
					});  
				},function(errData){
					var msg = errData.errorMsg;
					if(msg == 'emptypwd'){
						weui.alert(L_('您还未设置支付密码'));
					}else if(msg == 'wrong'){
						weui.confirm(L_('支付密码错误，请重试'), {
							buttons: [{
								label: L_('重试'),
								type: 'gray',
								onClick: function(){ 
									$('.pwd_Txt').text('');
									$('#password').val('');
									$('#password').focus();
									$('.input_pwd .pwd_Txt').css('-webkit-text-security','none');
								}
							}, {
								label: L_('忘记密码'),
								type: 'primary',
								onClick: function(){
									if(page_from == 'pay'){  
										setTimeout(function(){
											forgetPwd()
										},350)
									}else{
										redirect_self('inputCode.html?id='+urlParam.id);
									} 
								}
							}]
						});
					}else if(msg == 'wrongmany'){
						weui.confirm(L_('密码输入错误过多，请找回密码或明天再试。'), {
							buttons: [{
								label: L_('知道了'),
								type: 'gray',
								onClick: function(){
									history.go(-1);
								}
							}, {
								label: L_('找回密码'),
								type: 'primary',
								onClick: function(){
									if(page_from == 'pay'){  
										setTimeout(function(){
											forgetPwd()
										},350)
									}else{
										redirect_self('inputCode.html');
									}
								}
							}]
						});
					}else{ 
						weui.confirm(msg, {
							buttons: [{
								label: L_('知道了'),
								type: 'gray',
								onClick: function(){
									history.go(-1);
								}
							}]
						});

					}
				}); 
			}  

			$('.forgetPwd').click(function(){
				forgetPwd();
			})
			function forgetPwd(){
				weui.confirm(L_('您可通过验证手机号码来重新设置您的的密码'), {
					buttons: [{
						label: L_('再想想'),
						type: 'gray',
						onClick: function(){  
							$('.pwd_Txt').text('');
							$('#password').val('');
							$('#password').focus();
						}
					}, {
						label: L_('重置密码'),
						type: 'primary',
						onClick: function(){
							common.setCache('resetPwd',1,true);
							redirect_self('inputCode.html?id='+urlParam.id); 
						}
					}]
				});
			}
		</script> 
	</body>
</html>
